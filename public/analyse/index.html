  var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var el = document.getElementById("an");
  var st = { i: 0, clients: null, cat: null, dorm: null, pains: [] };
  var track = function (e) { try { var b = JSON.stringify({ e: e }); if (navigator.sendBeacon) navigator.sendBeacon("/api/event", new Blob([b], { type: "application/json" })); else fetch("/api/event", { method: "POST", headers: { "Content-Type": "application/json" }, body: b, keepalive: true }); } catch (x) {} };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]; }); };
  var fmt = function (n) { return Math.round(n).toLocaleString("fr-FR"); };
  var accounts = false;
  fetch("/api/health").then(function (r) { return r.ok ? r.json() : null; }).then(function (j) { accounts = !!(j && j.accounts); var b = document.getElementById("rsave"); if (b) { if (accounts) b.hidden = false; else b.remove(); } }).catch(function () {});

  var c0 = new URLSearchParams(location.search).get("c");
  if (c0 !== null && CLIENTS[+c0]) { st.clients = +c0; st.i = 1; track("analyse_q1"); }
  track("analyse_debut");

  function steps() {
    return [
      { k: "clients", t: "Combien de clients suivez-vous ?", s: "Les personnes qui vous achètent régulièrement, même de temps en temps.", o: CLIENTS.map(function (x, n) { return [n, x[0], ""]; }) },
      { k: "cat", t: "Que vendez-vous surtout ?", s: "Recharge connaît la durée habituelle de chaque type de produit.", o: CATS.map(function (x, n) { return [n, x[1], x[2]]; }) },
      { k: "dorm", t: "Combien de clients n’ont rien commandé depuis plus de 3 mois ?", s: "Une estimation suffit. Tout le monde en a : ce sont des ventes à récupérer.", o: DORM.map(function (x, n) { return [n, x[0], ""]; }) },
      { k: "pains", multi: true, t: "Qu'est-ce qui vous freine aujourd'hui ?", s: "Plusieurs réponses possibles.", o: PAINS.map(function (x) { return [x[0], x[1], x[2]]; }) }
    ];
  }
  function draw(html) { el.innerHTML = '<div class="fade">' + html + "</div>"; window.scrollTo(0, 0); }
  function question() {
    var S = steps(), q = S[st.i], val = st[q.k];
    var opts = q.o.map(function (o) {
      var on = q.multi ? st.pains.indexOf(o[0]) >= 0 : val === o[0];
      return '<button type="button" class="aopt' + (on ? " on" : "") + '" data-v="' + o[0] + '"><b>' + esc(o[1]) + "</b>" + (o[2] ? "<small>" + esc(o[2]) + "</small>" : "") + "</button>";
    }).join("");
    draw('<div class="abar"><span style="width:' + Math.round((st.i + 1) / (S.length + 1) * 100) + '%"></span></div>' +
      '<div class="astep">Question ' + (st.i + 1) + " sur " + S.length + "</div>" +
      '<h1 class="aq">' + q.t + '</h1><p class="asub">' + q.s + "</p>" +
      '<div class="aopts' + (q.o.length < 5 && !q.multi ? "" : "") + '">' + opts + "</div>" +
      '<div class="anav">' + (st.i > 0 ? '<button type="button" class="back" data-a="back">← Retour</button>' : "<span></span>") +
      (q.multi ? '<button type="button" class="btn orange" data-a="next"' + (st.pains.length ? "" : " disabled") + ">Voir mon analyse" + ARROW + "</button>" : "") + "</div>");
  }
  function compute() {
    var n = CLIENTS[st.clients][1], c = CATS[st.cat], d = DORM[st.dorm][1];
    var rate = 0.6, renouv = Math.max(1, Math.round(n * 30 / c[3] * rate)), semaine = Math.max(1, Math.round(n * 7 / c[3] * rate));
    var dorm = d < 0 ? Math.max(1, Math.round(n * .25)) : Math.min(d, n);
    var r10 = function (v) { return Math.round(v / 10) * 10; };
    // Un client fidèle sur un an : panier × nombre de rachats possibles × 6 sur 10
    var valClient = Math.round(c[4] * 365 / c[3] * rate);
    var revenus = Math.max(1, Math.round(dorm / 3)), reveilAn = r10(dorm / 3 * valClient);       // 1 client endormi sur 3 revient après un message
    var nouveaux = Math.round(n * 5 / 10), resAn = r10(nouveaux * valClient);                     // 5 personnes présentées par client, 1 sur 10 achète
    var totalAn = reveilAn + resAn;
    var prio = n <= 25 ? "croissance" : dorm >= n * .2 ? "reveil" : "rachats";
    return { clients: n, cat: c[0], catLabel: c[1], dorm: dorm, pains: st.pains.slice(), renouv: renouv, panier: c[4], duree: c[3], semaine: semaine,
      valClient: valClient, revenus: revenus, reveilAn: reveilAn, nouveaux: nouveaux, resAn: resAn, totalAn: totalAn, prio: prio,
      fois: Math.floor(totalAn / 89), cmdRemb: Math.max(1, Math.ceil(89 / c[4])), at: new Date().toISOString().slice(0, 10) };
  }
  function result() {
    var a = compute();
    try { localStorage.setItem(KEY, JSON.stringify(a)); } catch (e) {}
    track("analyse_resultat");
    var max = Math.max(a.clients, 1);
    var head = "Jusqu’à <em>~" + fmt(a.totalAn) + " € par an</em> à aller chercher dans votre activité.";
    var PRIO = { croissance: "votre priorité : <b>agrandir votre clientèle</b>. Vos clients connaissent des personnes qui ont besoin de vos produits.",
      reveil: "dont ~" + a.dorm + " qui n’ont rien commandé depuis 3 mois, votre priorité : <b>réveiller vos clients endormis</b>.",
      rachats: "votre priorité : <b>ne plus laisser passer un seul rachat</b>, au bon moment pour chaque client." };
    var sub = "Avec environ " + fmt(a.clients) + " clients en " + esc(a.catLabel.toLowerCase()) + ", " + PRIO[a.prio];
    var gain = '<div class="rgain"><div class="rg-k">Votre potentiel sur un an</div><div class="rg-v">~<b id="rgTotal">0</b> €</div>' +
      '<div class="rg-row"><span>Clients endormis à réveiller (' + a.dorm + ', si 1 sur 3 revient)</span><b>~' + fmt(a.reveilAn) + ' €</b></div>' +
      '<div class="rg-row"><span>Nouveaux clients amenés par vos clients (<span id="rgNew">' + a.nouveaux + '</span>)</span><b>~<span id="rgRes">' + fmt(a.resAn) + '</span> €</b></div></div>';
    var roi = '<div class="rroi"><div class="ro-p"><b>89 €</b><span>par an avec Recharge, <br>soit 7,42 € par mois</span></div><div class="ro-t">' +
      '<p>Remboursé dès la <b>' + a.cmdRemb + (a.cmdRemb > 1 ? "e" : "re") + ' commande récupérée</b>.</p>' +
      (a.fois >= 2 ? '<p>Votre potentiel représente <b id="rgFois">' + a.fois + ' fois</b> son prix.</p>' : "") +
      '<small>Au mois : 9,90 € (118,80 € sur un an). L’annuel vous fait économiser 29,80 €.</small></div></div>';
    var stats = '<div class="rstats"><div class="rs"><b>' + a.renouv + '</b><span>renouvellements possibles par mois</span></div>' +
      '<div class="rs"><b>~' + a.dorm + '</b><span>clients endormis depuis 3 mois</span></div>' +
      '<div class="rs hl"><b>~' + fmt(a.valClient) + ' €</b><span>par an pour un client fidèle</span></div></div>';
    var bars = '<div class="rbars"><div class="rbar"><small><span>Clients actifs</span><span>~' + (a.clients - a.dorm) + '</span></small><i><span style="width:' + Math.round((a.clients - a.dorm) / max * 100) + '%"></span></i></div>' +
      '<div class="rbar o"><small><span>Clients endormis, à réveiller</span><span>~' + a.dorm + '</span></small><i><span style="width:' + Math.round(a.dorm / max * 100) + '%"></span></i></div></div>';
    var week = '<div class="rweek">Cette semaine, environ ' + a.semaine + " de vos clients arrivent au bout de leur produit. C’est le bon moment pour leur écrire.</div>";
    var hyp = '<p class="rhyp">Estimation, pas une promesse : produit racheté ' + esc(CATS[st.cat][2]) + ", 6 clients sur 10 qui rachètent, panier moyen d’environ " + a.panier + " €, soit environ " + fmt(a.valClient) + " € par an pour un client fidèle. 1 client endormi sur 3 qui revient après un message. Côté réseau : 5 personnes présentées par client, dont 1 sur 10 devient cliente. Avec vos vrais clients, Recharge calcule tout précisément.</p>";
    var keys = a.pains.length ? a.pains : ["oubli", "quoi", "temps"];
    var forList = keys.slice(0, 4).map(function (k) { return "<li><i>" + CHECK + "</i><span>" + FOR[k] + "</span></li>"; }).join("");
    var save = '<div class="rsave" id="rsave"><h3>Gardez votre analyse</h3><p>Recevez un lien d’accès par email : vous retrouvez vos résultats dans Recharge, sur n’importe quel téléphone.</p>' +
      '<form id="saveForm" novalidate><input type="email" id="saveEmail" inputmode="email" autocomplete="email" placeholder="vous@exemple.fr" required aria-label="Votre email"><button class="btn dark" type="submit">Recevoir mon lien</button></form>' +
      '<label class="ck"><input type="checkbox" id="saveNews"> Je veux aussi recevoir des conseils de vente par email (1 à 2 par mois, désinscription en 1 clic).</label><div id="saveMsg"></div></div>';
    var tabs = '<div class="rtabs" role="tablist"><button type="button" class="on" data-tab="0" role="tab">Vos clients</button><button type="button" data-tab="1" role="tab">Votre réseau</button><button type="button" data-tab="2" role="tab">Plan du coach</button></div>';
    var pane0 = '<div class="rpane" data-pane="0">' + stats + bars + week + hyp + "</div>";
    var pane1 = '<div class="rpane" data-pane="1" hidden><div class="rnet"><h3>Votre micro-marché</h3><p class="lede2">Vos clients connaissent des proches, des collègues, des voisins qui pourraient avoir besoin de vos produits.</p>' +
      '<div class="pot-viz"><svg id="anSvg" viewBox="-200 -200 400 400" role="img" aria-label="Votre réseau : vos clients et les personnes qu’ils peuvent vous présenter"></svg><div class="pot-mid"><b id="anTot">0</b><span>personnes<br>à toucher</span></div></div>' +
      '<label class="pslide o" for="anK"><span>Chaque client pourrait vous présenter <b id="anKOut">5</b></span><input type="range" id="anK" min="1" max="15" value="5" aria-label="Personnes présentées par client"></label>' +
      '<div class="pot-res"><div><b id="anNet">0</b><span>personnes que vos clients peuvent vous présenter</span></div><div class="hl"><b id="anNew">+0</b><span>nouveaux clients si 1 sur 10 achète</span></div><div><b id="anCA">≈ 0 €</b><span>de ventes en plus par an</span></div></div>' +
      '<p class="n">Ce sont des estimations à ajuster selon votre réalité : 1 personne présentée sur 10 qui devient cliente, panier moyen d’environ ' + a.panier + ' €.</p></div></div>';
    var k5 = Math.min(5, a.clients), contacts = k5 * 2;
    var extra = a.pains.indexOf("equipe") >= 0 ? ["Partagez Recharge avec vos filleuls", "Chacun suit ses clients, vous voyez les résultats de l’équipe."]
      : a.pains.indexOf("nouveaux") >= 0 ? ["Activez votre micro-marché local", "Commerçants, salles de sport, associations de votre ville : Recharge vous donne des idées concrètes chaque semaine."]
      : a.pains.indexOf("temps") >= 0 ? ["Bloquez 15 minutes chaque matin", "Le plan du jour est prêt : vous ouvrez, vous envoyez, c’est fait."]
      : ["Activez votre micro-marché local", "Commerçants, salles de sport, associations de votre ville : Recharge vous donne des idées concrètes chaque semaine."];
    var P = {
      reveil: ["Écrivez à vos ~" + a.dorm + " clients endormis, un message simple et sans pression", "Si 1 sur 3 revient : ≈ " + a.revenus + " clients, ≈ " + fmt(a.reveilAn) + " € par an"],
      relance: ["Cette semaine, écrivez aux ~" + a.semaine + " clients qui arrivent au bout de leur produit", "Si 6 sur 10 rachètent : ≈ " + Math.max(1, Math.round(a.semaine * .6)) + " commandes, ≈ " + fmt(Math.max(1, Math.round(a.semaine * .6)) * a.panier) + " €"],
      reco: ["Demandez à vos " + k5 + " clients les plus fidèles à qui ils pensent", "S’ils vous donnent 2 noms chacun : " + contacts + " contacts chauds, qui vous font déjà confiance"],
      carte: ["Offrez la carte fidélité à vos clients réguliers", "Une raison de racheter chez vous, et pas ailleurs"],
      extra: extra
    };
    var order = a.prio === "croissance" ? ["reco", "extra", "reveil", "relance"] : a.prio === "reveil" ? ["reveil", "relance", "reco", "carte"] : ["relance", "carte", "reco", "reveil"];
    var plan = order.map(function (k) { return P[k]; });
    var pane2 = '<div class="rpane" data-pane="2" hidden><div class="rcoach"><div class="who"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M13 7l-3 5h4l-3 5"/></svg></span><div><b>Votre coach Recharge</b><small>Voici par où je commencerais</small></div></div>' +
      "<ol>" + plan.map(function (x) { return "<li><div><b>" + esc(x[0]) + "</b><em>" + esc(x[1]) + "</em></div></li>"; }).join("") + "</ol>" +
      '<p class="n">Des estimations pour vous donner un ordre de grandeur, pas des résultats garantis. Dans l’appli, le coach s’appuie sur vos vrais clients.</p></div></div>';
    draw('<div class="abar"><span style="width:100%"></span></div><div class="rk">Votre analyse</div><h1 class="rh">' + head + '</h1><p class="rsub">' + sub + "</p>" + gain + roi + tabs + pane0 + pane1 + pane2 +
      '<div class="rfor"><h2>Ce que Recharge fait pour vous</h2><ul>' + forList + "</ul></div>" +
      '<div class="rtry"><h2>Passez de l’estimation à vos vrais clients</h2><p>Ajoutez vos 3 premiers clients : Recharge vous dit qui relancer cette semaine, avec le message prêt. Gratuit, sans compte, vos données restent dans votre téléphone.</p>' +
      '<a class="btn orange" id="tryGo" href="/app/?from=analyse">Essayer avec mes clients' + ARROW + "</a><small>2 minutes · Toutes marques</small></div>" +
      (accounts ? save : save.replace('class="rsave"', 'class="rsave" hidden')) +
      '<button type="button" class="again" data-a="again">Refaire l’analyse</button>');
    netA = a; netUpd = null;
    (function (el, to) { var t0 = performance.now(), d = 1100; (function step(t) { var k = Math.min(1, (t - t0) / d), v = to * (1 - Math.pow(1 - k, 3)); el.textContent = fmt(Math.round(v / 10) * 10); if (k < 1) requestAnimationFrame(step); })(t0); })(document.getElementById("rgTotal"), a.totalAn);
    var f = document.getElementById("saveForm");
    if (f) f.addEventListener("submit", submitSave);
    if (accounts) { var b = document.getElementById("rsave"); if (b) b.hidden = false; }
    document.getElementById("tryGo").addEventListener("click", function () { track("analyse_essai"); });
  }
  function submitSave(ev) {
    ev.preventDefault();
    var email = document.getElementById("saveEmail").value.trim(), msg = document.getElementById("saveMsg"), btn = ev.target.querySelector("button");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { msg.innerHTML = '<p class="err">Cette adresse email ne semble pas valide.</p>'; return; }
    btn.disabled = true; msg.innerHTML = "";
    var a = {}; try { a = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
    fetch("/api/lead", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: email, news: document.getElementById("saveNews").checked, analyse: a }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        btn.disabled = false;
        if (!x.ok) { msg.innerHTML = '<p class="err">' + esc(x.j.error || "Une erreur est survenue. Réessayez.") + "</p>"; return; }
        track("analyse_email");
        ev.target.outerHTML = '<p class="ok">C’est envoyé ! Ouvrez l’email depuis ce téléphone : le lien vous connecte à Recharge avec votre analyse.</p>' + (x.j.devLink ? '<p><a href="' + esc(x.j.devLink) + '">Lien de test</a> · code ' + esc(x.j.devCode) + "</p>" : "");
      })
      .catch(function () { btn.disabled = false; msg.innerHTML = '<p class="err">Pas de connexion internet pour le moment.</p>'; });
  }
  var netA = null, netUpd = null;
  function showNet() {
    var svg = document.getElementById("anSvg"); if (!svg || typeof constellation !== "function") return;
    var k = document.getElementById("anK"), run = function () {
      var kv = +k.value; document.getElementById("anKOut").textContent = kv; k.style.setProperty("--p", ((kv - 1) / 14 * 100) + "%");
      var r = netUpd(netA.clients, 0, kv, 0, false), nw = Math.round(r.net / 10);
      document.getElementById("anNet").textContent = fmt(r.net); document.getElementById("anNew").textContent = "+" + fmt(nw);
      var an = Math.round(nw * netA.valClient / 10) * 10;
      document.getElementById("anCA").textContent = "≈ " + fmt(an) + " €";
      document.getElementById("rgNew").textContent = nw; document.getElementById("rgRes").textContent = fmt(an);
      document.getElementById("rgTotal").textContent = fmt(netA.reveilAn + an);
      var fo = document.getElementById("rgFois"); if (fo) fo.textContent = Math.floor((netA.reveilAn + an) / 89) + " fois";
    };
    if (!netUpd) {
      netUpd = constellation(svg, svg.parentNode.querySelector(".pot-mid"), document.getElementById("anTot"));
      netUpd(netA.clients, 0, 0, 0, false);          // d'abord vos clients…
      setTimeout(run, 700);                          // … puis les personnes qu'ils connaissent
      k.addEventListener("input", run);
    }
  }
  el.addEventListener("click", function (e) {
    var tb = e.target.closest(".rtabs button");
    if (tb) {
      var n = tb.dataset.tab;
      el.querySelectorAll(".rtabs button").forEach(function (b) { b.classList.toggle("on", b === tb); });
      el.querySelectorAll(".rpane").forEach(function (p) { p.hidden = p.dataset.pane !== n; });
      if (n === "1") { showNet(); track("analyse_reseau"); } if (n === "2") track("analyse_coach");
      return;
    }
    var o = e.target.closest(".aopt"), a = e.target.closest("[data-a]");
    if (o) {
      var q = steps()[st.i], v = o.dataset.v;
      if (q.multi) { var k = st.pains.indexOf(v); if (k >= 0) st.pains.splice(k, 1); else st.pains.push(v); question(); return; }
      st[q.k] = +v; track("analyse_q" + (st.i + 1));
      o.classList.add("on"); setTimeout(function () { st.i++; question(); }, 180); return;
    }
    if (!a) return;
    if (a.dataset.a === "back") { st.i = Math.max(0, st.i - 1); question(); }
    if (a.dataset.a === "next") { track("analyse_q4"); result(); }
    if (a.dataset.a === "again") { st = { i: 0, clients: null, cat: null, dorm: null, pains: [] }; question(); }
  });
  question();
})();
</script>
</body>
