.ring{position:relative;width:60px;height:60px;flex:none}
.ring svg{width:60px;height:60px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .v b{font-size:1.15rem;font-weight:700;letter-spacing:-.04em}
.ring .v small{font-size:.56rem;font-weight:700;color:var(--ink-3);margin-top:2px}
.who{min-width:0}
.name{background:none;border:0;padding:0;font-size:1.1rem;font-weight:750;letter-spacing:-.025em;text-align:left;color:var(--ink)}
.status{font-size:.84rem;font-weight:700;margin-top:1px}
.status.late{color:var(--late)} .status.soon{color:var(--o-text)} .status.ok{color:var(--b-text)}
.meta2{font-size:.84rem;color:var(--ink-3);font-weight:550;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:.62rem;font-weight:750;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--ink-3);vertical-align:2px;margin-left:6px;letter-spacing:.02em}
.track{display:flex;justify-content:space-between;font-size:.74rem;color:var(--ink-3);font-weight:600;margin-top:14px}
.line{height:6px;border-radius:9px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.line span{display:block;height:100%;border-radius:9px;background:var(--grad)}
.line.late span{background:linear-gradient(90deg,#ff8a6b,var(--late))}

.bubble{margin-top:14px;background:var(--surface-2);border-radius:20px 20px 20px 6px;padding:11px 14px 4px}
.bubble .top{display:flex;justify-content:space-between;align-items:center}
.bubble textarea{display:block;width:100%;border:0;background:transparent;resize:none;overflow:hidden;padding:6px 0 10px;min-height:60px;font-size:.94rem;line-height:1.5;color:var(--ink);font-weight:500}
.bubble textarea:focus{outline:none}
.vary{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 10px;color:var(--b-text);font-weight:700;font-size:.74rem;display:flex;gap:5px;align-items:center}
.vary svg{width:13px;height:13px}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border-radius:99px;border:0;
  font-weight:700;font-size:1rem;letter-spacing:-.015em;text-decoration:none;padding:0 20px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn.orange{background:var(--grad);color:#fff;box-shadow:0 10px 24px -10px rgba(255,94,31,.7)}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn.outline{background:transparent;border:1px solid var(--line-2);color:var(--ink)}
.btn.danger{background:var(--late-soft);color:var(--late)}
.btn.sm{min-height:38px;font-size:.84rem;width:auto;padding:0 14px;white-space:nowrap}
.send{margin-top:12px}
.alt{text-align:center;font-size:.8rem;color:var(--ink-3);margin-top:8px;font-weight:550}
.alt button{background:none;border:0;padding:2px;color:var(--b-text);font-weight:700;font-size:.8rem}

.acts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px}
.acts button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:.78rem;font-weight:700;color:var(--ink);padding:2px}
.acts .ic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:var(--btn-ink);transition:transform .1s}
.acts button:active .ic{transform:scale(.92)}
.acts .ic svg{width:21px;height:21px}
.acts .reco .ic{background:var(--grad);color:#fff;box-shadow:0 8px 20px -8px rgba(255,94,31,.75)}
.acts .later .ic{background:var(--gradB);color:#fff;box-shadow:0 8px 20px -8px rgba(79,108,247,.7)}

.list .row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px}
.list .row+.row{border-top:1px solid var(--line)}
.row .btns{display:flex;gap:6px;flex:none}
.x{width:38px;height:38px;border:0;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;flex:none}
.x svg{width:14px;height:14px}
.empty{text-align:center;color:var(--ink-3);padding:26px 16px;font-size:.92rem;font-weight:550}
.empty b{color:var(--ink)}

/* ---------- Clients ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:0 18px;margin-top:14px;box-shadow:var(--shadow)}
.search svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.search input{flex:1;min-height:52px;border:0;background:transparent;font-size:1rem;font-weight:550}
.search input:focus{outline:none}
.crow{display:flex;width:100%;align-items:center;gap:12px;background:none;border:0;padding:12px 16px;text-align:left}
.crow+.crow{border-top:1px solid var(--line)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--o-soft);color:var(--o-text);display:grid;place-items:center;font-weight:750;font-size:.9rem;flex:none}
.crow .grow{flex:1;min-width:0}
.crow b{font-weight:700;letter-spacing:-.015em}
.chip{flex:none;font-size:.74rem;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.chip.late{background:var(--late-soft);color:var(--late)} .chip.soon{background:var(--o-soft);color:var(--o-text)}
.chip.done{background:var(--b-soft);color:var(--b-text)}
.chip.ok{background:var(--b-soft);color:var(--b-text)}
.avatar.blue{background:var(--b-soft);color:var(--b-text)}

/* ---------- Résultats ---------- */
.seg{display:flex;background:var(--surface-2);border-radius:99px;padding:4px;gap:4px;margin-top:14px}
.seg button{flex:1;min-height:40px;border:0;border-radius:99px;background:transparent;font-weight:700;font-size:.88rem;color:var(--ink-2)}
.seg button.on{background:var(--btn);color:var(--btn-ink)}
.kpi{position:relative;overflow:hidden;border-radius:28px;padding:22px;margin-top:12px;color:#fff;background:var(--grad);box-shadow:0 18px 40px -20px rgba(255,94,31,.8)}
.kpi::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.22) 1px,transparent 1.3px);background-size:11px 11px;
  -webkit-mask-image:linear-gradient(110deg,transparent 35%,#000 100%);mask-image:linear-gradient(110deg,transparent 35%,#000 100%)}
.kpi>*{position:relative}
.kpi .lbl{font-size:.88rem;font-weight:700;opacity:.92}
.kpi .val{font-size:3.3rem;font-weight:700;line-height:1.05;margin-top:8px;letter-spacing:-.055em}
.kpi .split{display:grid;grid-template-columns:repeat(3,1fr);margin:16px -22px -22px;border-top:1px solid rgba(255,255,255,.25)}
.kpi .split div{padding:12px 8px 14px 22px;min-width:0}
.kpi .split div+div{border-left:1px solid rgba(255,255,255,.25);padding-left:12px}
.kpi .split span{display:block;font-size:.68rem;font-weight:700;opacity:.88;white-space:nowrap;letter-spacing:-.01em}
.kpi .split b{font-size:1.1rem;font-weight:750;letter-spacing:-.03em}
.kpi .sub{font-size:.86rem;opacity:.9;margin-top:6px;font-weight:600}
.rate{padding:20px 18px 18px;text-align:center}
.bars{padding:6px 16px 14px}
.bars .b{padding:12px 0}
.bars .b+.b{border-top:1px solid var(--line)}
.bars .t{display:flex;justify-content:space-between;align-items:baseline;font-weight:650;font-size:.92rem}
.bars .t b{font-size:1.2rem;font-weight:700}
.bars .line{margin-top:9px}
.bars .line.blue span{background:var(--gradB)}
.hint{color:var(--ink-3);font-size:.82rem;margin:12px 4px 0;line-height:1.55;font-weight:550}
.hist{list-style:none;padding:0;margin:0}
.hist li{padding:12px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.hist li+li{border-top:1px solid var(--line)}
.hist small{color:var(--ink-3);font-size:.8rem;font-weight:550}

/* ---------- Réglages ---------- */
.pad{padding:16px}
.prodhead,.prodrow{display:grid;grid-template-columns:1fr 58px 72px 38px;gap:6px;align-items:center}
.prodhead{font-size:.72rem;font-weight:700;color:var(--ink-3);margin-bottom:6px}
.prodrow+.prodrow{margin-top:6px}
.prodrow .input{min-height:42px;margin:0;padding:0 10px;font-size:.9rem;border-radius:12px}

/* ---------- Formulaires ---------- */
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:.8rem;font-weight:700;color:var(--ink-2);margin-bottom:7px}
.field>span i{font-style:normal;font-weight:550;color:var(--ink-3)}
.input{display:block;width:100%;min-height:52px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface);padding:0 16px;font-size:1rem;font-weight:550;transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--b1);box-shadow:0 0 0 4px var(--b-soft)}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:10px 14px;font-weight:700;font-size:.88rem;display:flex;gap:6px;align-items:baseline}
.pchip small{color:var(--ink-3);font-weight:650;font-size:.76rem}
.pchip.on{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.pchip.on small{color:inherit;opacity:.65}
.pchip.add{border-style:dashed;color:var(--o-text)}
.stepper{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:99px;overflow:hidden;background:var(--surface);width:max-content}
.stepper button{width:48px;height:50px;border:0;background:transparent;font-size:1.3rem;font-weight:600;color:var(--ink)}
.stepper output{min-width:34px;text-align:center;font-weight:750;font-size:1.1rem}
.two{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:end}
.summary{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--o-soft);border-radius:20px;padding:13px 16px;margin-top:16px}
.summary .small{color:var(--o-text)}
.summary b{display:block;font-size:1.02rem;font-weight:750;letter-spacing:-.02em}
.summary .price{font-weight:750;font-size:1.2rem;letter-spacing:-.03em}
.subform{border:1px dashed var(--line-2);border-radius:20px;padding:2px 14px 14px;margin-top:10px}

/* ---------- Panneau ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,11,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(32px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line-2);margin:4px auto 12px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.shead h3{margin:0;font-size:1.4rem;font-weight:750;letter-spacing:-.04em}
.close{border:0;background:var(--surface-2);color:var(--ink);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.close svg{width:15px;height:15px}

/* ---------- Navigation ---------- */
nav.tabs{position:fixed;left:14px;right:14px;bottom:calc(12px + var(--badge) + env(safe-area-inset-bottom));z-index:30;display:flex;justify-content:center;pointer-events:none}
nav.tabs .in{pointer-events:auto;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;width:100%;max-width:532px;
  background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
  border:1px solid var(--line);border-radius:99px;box-shadow:0 14px 34px -14px rgba(16,19,18,.3);padding:6px 8px}
nav.tabs .tab{position:relative;border:0;background:none;padding:6px 2px;font-size:.66rem;font-weight:700;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs .tab svg{width:22px;height:22px}
nav.tabs .tab.on{color:var(--ink)}
nav.tabs .tab svg{transition:background .2s,color .2s}
nav.tabs .tab.on svg{width:38px;height:38px;padding:8px;margin:-8px 0 -5px;border-radius:50%;background:var(--ink);color:#fff;box-shadow:0 8px 18px -8px rgba(16,19,18,.6)}
.dot{position:absolute;top:1px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--o1);color:#fff;font-size:.62rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface)}
.plus{justify-self:center;width:58px;height:58px;margin:-14px 0;border-radius:50%;border:3px solid var(--surface);background:var(--grad);color:#fff;display:grid;place-items:center;
  box-shadow:0 10px 26px -6px rgba(255,94,31,.75),inset 0 1px 0 rgba(255,255,255,.35)}
.plus svg{width:24px;height:24px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + var(--badge) + env(safe-area-inset-bottom));z-index:60;background:var(--btn);color:var(--btn-ink);
  border-radius:99px;padding:11px 18px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);width:max-content;font-size:.88rem;font-weight:650;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:up .2s}
.sheet-open .toast{bottom:auto;top:calc(14px + env(safe-area-inset-top))}
.toast button{background:none;border:0;color:var(--o2);font-weight:800;padding:4px}

.enter>*{animation:rise .34s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.03s}.enter>*:nth-child(3){animation-delay:.06s}.enter>*:nth-child(4){animation-delay:.09s}.enter>*:nth-child(5){animation-delay:.12s}.enter>*:nth-child(n+6){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ---------- iPad et ordinateur ---------- */
@media (min-width:760px){
  body{padding-left:224px}
  .topbar{padding-left:28px;padding-right:28px}
  .topbar .in,main{max-width:720px}
  main{padding:6px 28px 70px}
  nav.tabs{left:20px;right:auto;top:calc(84px + env(safe-area-inset-top));bottom:auto;width:188px;display:block}
  nav.tabs .in{display:flex;flex-direction:column;align-items:stretch;gap:2px;border-radius:28px;padding:12px;max-width:none}
  nav.tabs .tab{flex-direction:row;justify-content:flex-start;gap:12px;font-size:.95rem;padding:9px 10px;border-radius:16px;cursor:pointer}
  nav.tabs .tab:hover{background:var(--surface-2)}
  nav.tabs .tab.on{background:var(--surface-2)}
  nav.tabs .tab svg{width:24px;height:24px;flex:none}
  nav.tabs .tab.on svg{width:36px;height:36px;padding:7px;margin:-6px 0}
  #tabDot{order:3;margin-left:auto}#tabDot .dot{position:static;border:0}
  .plus{order:-1;justify-self:auto;width:auto;height:50px;margin:0 0 10px;border-radius:18px;border:0;display:flex;gap:8px;font:inherit;font-weight:800;font-size:.95rem;cursor:pointer}
  .plus::after{content:"Nouvelle vente"}
  .coachfab{bottom:calc(24px + var(--badge) + env(safe-area-inset-bottom))}
  .toast{bottom:calc(28px + var(--badge) + env(safe-area-inset-bottom))}
  .sheet-bg{align-items:center;padding:24px}
  .sheet{max-width:620px;border-radius:30px;max-height:88vh}
  .grab{display:none}
  .ctiles{grid-template-columns:repeat(3,1fr)}
  .themes{grid-template-columns:repeat(4,1fr)}
}
@media (min-width:1100px){
  body{padding-left:236px}
  .topbar .in,main{max-width:1120px}
  #app>.enter{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:22px;align-items:start}
  #app>.enter>*{grid-column:1/-1}
  #app>.enter>.rcard{grid-column:auto}
  #app>.enter>.coach{grid-column:1}
  #app>.enter>.dtiles{grid-column:2;grid-row:1;margin-top:8px;height:calc(100% - 8px);grid-template-columns:repeat(3,1fr)}
  #app>.enter>.chatbox{grid-column:1;grid-row:2/span 30;position:sticky;top:90px}
  #app>.enter:has(.chatbox)>*:not(.coachhero):not(.chatbox){grid-column:2}
  #app>.enter:has(.chatbox)>.section:first-of-type{margin-top:14px}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* =====================================================================
   Identité « Fusion » : la clarté du Recharge d'origine + la profondeur du bleu nuit.
   Fond clair, logo d'origine, grands blocs et boutons courants en bleu nuit,
   orange plein (sans dégradé ni halo) pour le bouton + et les actions clés.
   Recoloration uniquement ; supprimer ce bloc pour revenir à l'ancien design.
   ===================================================================== */
:root{
  --navy:#1C1A22; --navy-2:#2A2631; --navy-3:#3A3542; --orange:#FF782E; --paper:#F1F4F8; --green:#35B879;
  --bg:#F4EFE8; --surface:#ffffff; --surface-2:#F1EBE3; --line:#E7DFD5; --line-2:#D9CFC3;
  --ink:#1C1A22; --ink-2:#57515C; --ink-3:#8A8390;
  --o1:#FF782E; --o2:#FF9152; --o3:#FFC49B; --o-soft:#FFF1E7; --o-text:#D2601A;
  --grad:linear-gradient(135deg,#FF8A45 0%,#FF782E 100%);
  --btn:#1C1A22; --btn-ink:#ffffff;
  --b1:#6066D8; --b-soft:#EEEEFD; --b-text:#5258C8;
  --gradB:linear-gradient(135deg,#8E95FF 0%,#6066D8 100%);
  --g:#35B879; --g-soft:#E5F6EE; --g-text:#1F8F58;
  --glow:rgba(255,120,46,.10); --glowB:rgba(123,131,246,.12);
  --shadow:0 1px 2px rgba(28,26,34,.04),0 12px 30px -18px rgba(28,26,34,.22);
  --navyblock:radial-gradient(70% 90% at 100% 0%,rgba(123,131,246,.26),transparent 60%),radial-gradient(60% 80% at 0% 100%,rgba(255,120,46,.16),transparent 65%),linear-gradient(155deg,#2D2834,#1C1A22);
}
:focus-visible{outline-color:var(--b1)}
/* barre du haut claire, logo d'origine (fusion avec le Recharge du début) */
.topbar{background:color-mix(in srgb,var(--bg) 82%,transparent);box-shadow:0 1px 0 var(--line)}
/* grands blocs (accueil, coach, résultats) : marine profond, comme les bandeaux du site */
.coach,.coachhero,.kpi{background:var(--navyblock);box-shadow:0 20px 40px -24px rgba(28,26,34,.7)}
.coach::after{background:rgba(241,244,248,.05)}
.coach .hl-bar{background:rgba(241,244,248,.14)}.coach .hl-bar span{background:var(--orange)}
.kpi::before{background-image:radial-gradient(rgba(241,244,248,.12) 1px,transparent 1.3px)}
.hero{background:radial-gradient(70% 60% at 0% 0%,rgba(255,138,50,.16),transparent 70%),radial-gradient(70% 60% at 100% 0%,rgba(91,141,239,.32),transparent 70%),#0B1C3A}
.lcard{background:radial-gradient(80% 90% at 100% 0%,rgba(91,141,239,.42),transparent 60%),radial-gradient(70% 80% at 0% 100%,rgba(255,138,50,.28),transparent 65%),#0A1A36}
.lc-stamps i.on{background:var(--orange)}
.hello,.devtip{background:linear-gradient(150deg,#EAF0FA,#F7F9FC);box-shadow:var(--shadow);border:1px solid var(--line)}
.hl-line,.devtip p{color:var(--ink-2)}.hl-count{color:var(--ink-3)}.devtip .dt-k{color:var(--b-text)}
.coach.hello{background:var(--navyblock);border:0;box-shadow:0 20px 40px -24px rgba(28,26,34,.7)}
.coach.hello .hl-line{color:#C6D0DF}.coach.hello .hl-count{color:#fff}
/* boutons : marine sobre ; l'orange ne fait plus de gros aplats */
.btn.primary{background:var(--navy);color:#fff;box-shadow:0 10px 22px -14px rgba(28,26,34,.6)}
.btn.orange{background:var(--orange);color:var(--navy);font-weight:750;box-shadow:0 10px 22px -12px rgba(255,120,46,.7)}
.btn.soft{background:var(--surface-2);color:var(--navy)}
.acts .reco .ic{background:var(--navy);color:#fff;box-shadow:0 8px 18px -10px rgba(28,26,34,.6)}
.acts .later .ic{background:var(--navy-3);color:#fff;box-shadow:none}
.plus{background:var(--orange);color:var(--navy);box-shadow:0 10px 24px -8px rgba(255,120,46,.6)}
.chatgo,.hsteps li>span,.obrow>b,.upplan i{background:var(--navy);color:#fff}
.cm-av,.coachfab .cf-ring{background:var(--navy-2);color:var(--orange)}
.coachfab{background:var(--navy)}
.bravo{background:var(--navy);color:#fff;box-shadow:0 14px 30px -12px rgba(28,26,34,.6)}.bravo .bz{background:rgba(255,138,50,.2)}
.tchips button.on,.gtypes button.on,.satb button.on,.obtone.on,.upplan.on{border-color:var(--navy);background:#EEF2F8;color:var(--navy)}
.pslide input[type=range]{background:linear-gradient(90deg,#FF9A52 0%,#FF782E var(--p,0%),var(--surface-2) var(--p,0%))}
.pslide input[type=range]::-webkit-slider-thumb{border-color:var(--orange);box-shadow:0 4px 12px rgba(255,120,46,.4)}
.trange input{accent-color:var(--navy)}
/* positif en vert */
.status.ok,.chip.ok,.chip.done{color:var(--g-text)}.chip.ok,.chip.done{background:var(--g-soft)}

.sheet{background:#fff}
.input:focus{border-color:var(--navy-3);box-shadow:0 0 0 4px rgba(45,91,184,.12)}

.coach .hl-bar span,.hl-bar span{background:linear-gradient(90deg,#FFA352,#FF8A32);box-shadow:0 0 12px rgba(255,138,50,.55)}
.bravo .bz{background:var(--orange);color:#fff}
.kpi .val{background:linear-gradient(100deg,#FFB067,#FF8A32 60%);-webkit-background-clip:text;background-clip:text;color:transparent}
/* saisie en une phrase */
.sx-ex{display:flex;gap:6px;overflow-x:auto;margin:12px -2px 0;padding:2px;scrollbar-width:none}.sx-ex button{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:7px 11px;font:inherit;font-size:.8rem;font-weight:650;color:var(--ink-2);cursor:pointer}
.sx-in{position:relative;margin-top:12px}.sx-in textarea{min-height:92px;padding:14px 62px 14px 14px;font-size:16px;line-height:1.45;resize:none}
.sx-mic{position:absolute;right:10px;bottom:10px;width:46px;height:46px;border-radius:50%;border:0;background:var(--orange);color:var(--navy);font-size:1.25rem;cursor:pointer;box-shadow:0 8px 18px -8px rgba(255,120,46,.7)}
.sx-mic.listening{animation:micPulse 1.2s infinite}
.sx-prev{margin-top:12px;display:grid;gap:8px;min-height:44px}
.sx{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;animation:rise .25s ease both}
.sx-h{display:flex;gap:10px;align-items:center}.sx-h .avatar{width:36px;height:36px;font-size:.8rem}.sx-h b{display:block}.sx-h small{color:var(--ink-3);font-weight:650;font-size:.78rem}

.sx-short{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;margin-top:12px;border:1.5px dashed var(--orange);background:var(--o-soft);border-radius:16px;padding:12px 14px;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.sx-short span{font-size:.8rem;color:var(--ink-2);font-weight:600}
.durrow{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px}.durrow b{display:block}.durrow small{display:block;color:var(--ink-3);font-weight:650;margin:2px 0 10px}

.endlink{border:0;background:none;padding:0;font:inherit;font-size:inherit;color:var(--o-text);font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.durtip .em{font-weight:800;color:var(--ink)}
.prodtip{grid-column:1/-1;font-size:.8rem;font-weight:600;color:var(--ink-2);margin:4px 2px 8px}.prodtip b{color:var(--ink)}

<script>
"use strict";
/* ---------- Outils dates & texte ---------- */
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diff = (a, b) => Math.round((parse(a) - parse(b)) / 864e5); // a - b, en jours
const fmt = s => parse(s).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
const fmtLong = s => parse(s).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
const euro = n => (n || 0).toLocaleString("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: (n % 1 ? 2 : 0) });
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const firstName = n => (n || "").trim().split(/\s+/)[0] || "";
const initials = n => (n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const plural = (n, one, many) => n + " " + (n > 1 ? many : one);

/* ---------- Icônes ---------- */
const I = {
  wa: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>`,
  copy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l4.5 4.5L19.5 6.5"/></svg>`,
  bag: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/><path d="M9.5 13.5l2 2 3.5-3.5"/></svg>`,
  clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>`,
  redo: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4.5h-4.5"/></svg>`,
  x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>`,
  down: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>`,
  up: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5M7 9.5l5-5 5 5M5 20h14"/></svg>`
};

/* ---------- Données (stockées uniquement dans ce téléphone) ---------- */
// Mode démo (?demo) : utilisé par le téléphone du site, il ne touche jamais aux vraies données
const DEMO = new URLSearchParams(location.search).has("demo");
const KEY = DEMO ? "recharge.demo" : "recharge.v1";
if (DEMO) { try { localStorage.removeItem(KEY); } catch (e) {} document.documentElement.classList.add("demo"); }
const DEFAULT_PRODUCTS = [
  { id: "p1", name: "Gel aloe vera", days: 30, price: 35 },
  { id: "p2", name: "Complément alimentaire", days: 30, price: 30 },
  { id: "p3", name: "Crème visage", days: 45, price: 28 },
  { id: "p4", name: "Shampoing", days: 60, price: 15 }
];
let S;
let storageOk = true;

function seed() {
  const t = today();
  const s = { v: 1, products: DEFAULT_PRODUCTS.map(p => ({ ...p })), clients: [], sales: [], events: [], tone: "tu", lastExport: null, seeded: true };
  const ex = [
    ["Marie Dupont", "06 00 00 00 01", "p1", 1, -32],  // fini depuis 2 jours
    ["Sophie Martin", "", "p2", 1, -30],               // se termine aujourd'hui
    ["Karim Benali", "06 00 00 00 03", "p3", 1, -43],  // dans 2 jours
    ["Julie Bernard", "06 00 00 00 04", "p1", 2, -10]  // dans 50 jours
  ];
  for (const [name, phone, pid, qty, ago] of ex) {
    const c = { id: uid(), name, phone, example: true };
    s.clients.push(c);
    const p = s.products.find(x => x.id === pid);
    s.sales.push(makeSale(c.id, p, qty, addDays(t, ago), true));
  }
  s.clients[3].referredBy = s.clients[0].id; // Julie a été recommandée par Marie
  // Un prospect d'exemple : un contact donné par Marie
  s.prospects = [{ id: uid(), name: "Léa Moreau", phone: "06 00 00 00 05", interest: "Gel aloe vera", referredBy: s.clients[0].id,
    note: "Cherche quelque chose pour la digestion", next: t, contacts: 0, status: "open", createdAt: t, msg: 0, example: true, kind: "client" },
    { id: uid(), name: "Thomas Girard", phone: "06 00 00 00 07", interest: "Crème visage", note: "A goûté l'échantillon, peau sèche", next: t, contacts: 0,
      status: "open", createdAt: addDays(t, -3), msg: 0, example: true, kind: "client", where: "salon" }];
  // Sophie a la carte fidélité depuis 3 mois (3 tampons sur 5)
  s.clients[1].status = "vip"; s.clients[1].statusLog = [{ s: "direct", date: addDays(t, -200) }, { s: "vip", date: addDays(t, -90) }];
  s.clients[1].cardNo = "0001"; s.cardSeq = 1;
  for (const ago of [-60, -45]) { const o = makeSale(s.clients[1].id, s.products[1], 1, addDays(t, ago), true); o.status = "rachete"; s.sales.push(o); }
  const sandra = { id: uid(), name: "Sandra Lopez", phone: "06 00 00 00 06", example: true, status: "direct",
    statusLog: [{ s: "direct", date: addDays(t, -240) }], createdAt: addDays(t, -240) };
  s.clients.push(sandra);
  s.sales.push(makeSale(sandra.id, s.products[1], 1, addDays(t, -28), true));
  // Julie commande souvent : Recharge suggère de lui offrir la carte fidélité
  for (const ago of [-40, -75]) { const o = makeSale(s.clients[3].id, s.products[0], 2, addDays(t, ago), true); o.status = "rachete"; s.sales.push(o); }
  return s;
}
function makeSale(clientId, p, qty, date, example) {
  return { id: uid(), clientId, productId: p.id, product: p.name, days: p.days, price: p.price, qty, date,
    end: addDays(date, p.days * qty), status: "open", snooze: null, relancedAt: null, msg: Math.floor(Math.random() * 5), example: !!example };
}
function load() {
  try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { storageOk = false; return null; }
}
/* ---------- Compte léger et sauvegarde automatique (version complète) ----------
   - Version gratuite : aucune connexion, tout reste dans le téléphone.
   - Version complète : connexion par lien ou code reçu par email (sans mot de passe) ; les données sont
     sauvegardées automatiquement et se retrouvent sur un nouveau téléphone. */
const SESSION_KEY = "recharge.session", SYNC_KEY = "recharge.sync";
const readLS = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
const writeLS = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

function dayPlan(full) {

/* Une nouvelle vente du même produit remplace la précédente en cours */
/* ---------- Rythme réel de chaque client ----------
   Après 2 achats du même produit, Recharge mesure en combien de temps ce client le finit vraiment
   (intervalle entre deux commandes, ramené à la quantité achetée), et s'en sert pour la prochaine relance.
   On garde le plus récent (3 derniers intervalles, valeur médiane) et on ignore les écarts aberrants. */
function learnedRhythm(clientId, productName, baseDays, beforeDate) {
  const hist = S.sales.filter(x => x.clientId === clientId && x.product === productName && (!beforeDate || x.date <= beforeDate)).sort((a, b) => a.date.localeCompare(b.date));
  const iv = [];
  for (let i = 1; i < hist.length; i++) {
    const d = diff(hist[i].date, hist[i - 1].date); if (d <= 0) continue;
    const per = d / Math.max(1, hist[i - 1].qty || 1);
    if (per >= baseDays * .4 && per <= baseDays * 2.5) iv.push(per);
  }
  if (!iv.length) return null;
  const last = iv.slice(-3).sort((a, b) => a - b), m = last.length % 2 ? last[(last.length - 1) / 2] : (last[last.length / 2 - 1] + last[last.length / 2]) / 2;
  const w = iv.length >= 2 ? .8 : .5;                       // une seule mesure : on reste prudent, moitié théorie moitié réalité
  return { days: Math.max(3, Math.round(baseDays * (1 - w) + m * w)), real: Math.round(m), n: iv.length + 1 };
}
function applyRhythm(sale, clientId, p) {
  if (isGeneric(sale)) return;
  const cl = client(clientId), own = cl && cl.prodDays && cl.prodDays[p.name || sale.product];
  if (own) { sale.days = own; sale.end = addDays(sale.date, own * sale.qty); sale.ownDays = true; return; }
  const base = p.days || sale.days, r = learnedRhythm(clientId, p.name || sale.product, base, sale.date);
  if (!r) return;
  sale.days = r.days; sale.end = addDays(sale.date, r.days * sale.qty); sale.learned = r.n; sale.realDays = r.real;
}
function clientRhythms(c) {
  const names = [...new Set(S.sales.filter(x => x.clientId === c.id && !isGeneric(x)).map(x => x.product))];
  return names.map(nm => { const pr = S.products.find(x => x.name === nm), last = S.sales.filter(x => x.clientId === c.id && x.product === nm).sort((a, b) => b.date.localeCompare(a.date))[0];
    const base = (pr && pr.days) || (last && last.days) || 30, r = learnedRhythm(c.id, nm, base); return r ? { product: nm, real: r.real, base, n: r.n } : null; }).filter(Boolean);
}
function recordSale(c, p, qty, date) {
  let counted = false;
  for (const old of S.sales) {
    if (old.clientId === c.id && old.product === p.name && (old.status === "open" || old.status === "relance") && old.date <= date) {
      if (old.status === "relance") { logEvent("recommande", old, { amount: p.price * qty }); counted = true; }
      old.status = "rachete";
    }
  }
  const ns = makeSale(c.id, p, qty, date, c.example);
  applyRhythm(ns, c.id, p);
  if (S.sales.some(x => x.clientId === c.id && x.product === p.name && x.date > date)) ns.status = "rachete";
  S.sales.push(ns);
  return counted;
}
function refLine(c) {
  const by = c.referredBy ? person(c.referredBy) : null;
  const brought = S.clients.concat(S.prospects.filter(x => x.status !== "client")).filter(x => x.referredBy === c.id);
  let h = "";
  if (by || c.referredByName) h += `<div class="notice" style="margin-top:14px"><span>Recommandé par <b>${esc(by ? by.name : c.referredByName)}</b></span></div>`;
  if (brought.length) h += `<div class="notice" style="margin-top:10px"><span>A présenté ${plural(brought.length, "personne", "personnes")} : <b>${brought.map(x => esc(x.name)).join(", ")}</b></span></div>`;

}

    const score = (i, f) => body.filter(r => r[i] && f(r[i])).length / body.length;

      if (role.qty == null && score(i, v => /^\d{1,2}$/.test(v)) > .6) { role.qty = i; continue; }
      if (role.product == null && score(i, matchProduct) > .4) { role.product = i; continue; }
    }
    for (let i = 0; i < width; i++) if (role.name == null && ![role.date, role.qty, role.product].includes(i) && score(i, v => /[a-zé]{2,}/i.test(v)) > .6) role.name = i;
    if (role.product == null) for (let i = 0; i < width; i++) if (![role.date, role.qty, role.name].includes(i) && score(i, v => /[a-zé]{3,}/i.test(v)) > .5) { role.product = i; break; }

  for (const r of body) {
    let name = role.name != null ? r[role.name] || "" : "";

    const date = parseDateFR(role.date != null ? r[role.date] : "") || "";
    const prodCell = role.product != null ? r[role.product] || "" : "";
    const qty = Math.max(1, Math.min(99, parseInt(role.qty != null ? r[role.qty] : "1", 10) || 1));

    if (!prodCell) { if (name && date) out.push({ name: name || lastName, date: date || lastDate, product: "", qty }); lastName = name || lastName; lastDate = date || lastDate; continue; }

}
/* Capture d'un back-office :
   - « liste des commandes » : une ligne = un client + une date (sans produit) → relance au rythme ;
   - « détail d'une commande » : n° d'article + nom de l'article → la VDI choisit le client. */
const BO_NOISE = /^(partenaire|client|cliente|consultant|conseiller|membre|vip|commande|individuelle|accept[ée]|post[ée]|livr[ée]e?|pay[ée]e?|valid[ée]e?|en|cours|afficher|les|details?|niveau)$/i;
function parseBackoffice(text) {
  const lines = text.split(/\r?\n/).map(l => l.replace(/[|_“”"]+/g, " ").replace(/\s+/g, " ").trim()).filter(Boolean);
  const art = lines.map(l => l.match(/^\d{6,}\s+(.+?)\s+\d{1,4}([.,]\d+)?$/)).filter(Boolean);
  if (art.length >= 2 && art.length >= lines.filter(l => /^\d{6,}\s/.test(l)).length * .6) return { kind: "detail", items: [...new Set(art.map(m => m[1].trim()))] };
  const rows = [], seen = new Set();
  for (const l of lines) {
    const date = parseDateFR(l); if (!date) continue;
    let t = l; for (const re of DATE_RES) t = t.replace(re, " ");
    const words = t.replace(/\b\d{4}\/\d{1,2}\b/g, " ").split(" ").filter(w => w && !/\d/.test(w) && !BO_NOISE.test(w) && /^\p{L}[\p{L}'\-.]*$/u.test(w) && w.length > 1);
    const name = words.slice(0, 5).map(w => w === w.toUpperCase() && w.length > 2 ? w[0] + w.slice(1).toLowerCase() : w).join(" ").trim();
    if (!name || name.split(" ").length < 2 && name.length < 3) continue;
    const k = norm(name) + "|" + date; if (seen.has(k)) continue; seen.add(k);
    rows.push({ name, date, product: "", qty: 1 });
  }
  return rows.length ? { kind: "list", rows } : null;
}

/* Du texte lu sur une capture : une ligne par commande, on y cherche une date, un produit connu et un nom */
function parseLines(text) {
  const out = []; let lastName = "", lastDate = "";
  for (const raw of text.split(/\r?\n/)) {
    let l = raw.replace(/[|_]+/g, " ").replace(/\s+/g, " ").trim();
    if (l.length < 4) continue;
    const nl = norm(l);
    if (/\b(date|produit|article|quantite|total|commande n|statut)\b/.test(nl) && !parseDateFR(l)) continue;
    const date = parseDateFR(l);
    for (const re of DATE_RES) l = l.replace(re, " ");
    let qty = 1;
    const qm = l.match(/(?:\bx\s?|×\s?|qt[ée]\s*:?\s*)(\d{1,2})\b|\b(\d{1,2})\s?(?:x|×)\b/i);
    if (qm) { qty = +(qm[1] || qm[2]); l = l.replace(qm[0], " "); }
    l = l.replace(/\d+[.,]\d{2}\s*€?|€\s*\d+([.,]\d+)?|\b\d+\s*€/g, " ").replace(/\s+/g, " ").trim();
    const words = l.split(" "), nw = words.map(norm);
    let prod = null, at = -1, len = 0;
    for (const p of S.products) {
      const pw = norm(p.name).split(" ");
      for (let i = 0; i + pw.length <= nw.length; i++) if (pw.every((w, k) => nw[i + k] === w) && pw.length > len) { prod = p; at = i; len = pw.length; }
    }
    let name, prodText;
    if (prod) {
      name = words.slice(0, at).filter(w => /^[A-ZÀ-Ý][\p{L}'\-]+$/u.test(w)).slice(-3).join(" "); prodText = prod.name;
      if (!qm) { const nxt = words.slice(at + len).find(w => /^\d{1,2}$/.test(w)); if (nxt) qty = Math.max(1, +nxt); }
    }
    else {
      const caps = []; let i = 0;
      while (i < words.length && /^[A-ZÀ-Ý][\p{L}'\-]+$/u.test(words[i]) && caps.length < 3) caps.push(words[i++]);
      name = caps.join(" "); prodText = words.slice(i).filter(w => /\p{L}{2,}/u.test(w)).join(" ");
    }
    if (!date && !prod) continue;
    name = name || lastName; const dt = date || lastDate;
    if (!prodText) continue;
    out.push({ name, date: dt, product: prodText, qty });
    lastName = name; lastDate = dt;
  }
  return out;
}

async function readSheet(file) {

    lite.classList.toggle("exp", expCards.has(k)); const w = lite.querySelector(".rwhy"); if (w) w.textContent = expCards.has(k) ? "Masquer le détail ⌃" : "Pourquoi ? ⌄";
    fitAreas(lite); return;
  }
  const tabBtn = ev.target.closest("[data-tab]");
  if (tabBtn) { tab = tabBtn.dataset.tab; closeSheet(); render(); window.scrollTo(0, 0); return; }
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const fn = actions[el.dataset.act];
  if (!fn) return;
  if (el.dataset.act === "closeBg") { fn(el, ev); return; }
  const keepDefault = fn(el, ev) === true;
  if (!keepDefault) ev.preventDefault();
});
document.addEventListener("submit", ev => {
  if (ev.target.id === "saleForm") { ev.preventDefault(); submitSale(); }
  if (ev.target.id === "accForm") { ev.preventDefault(); loginEmail = document.getElementById("accEmail").value.trim(); return sendLink(); }
  if (ev.target.id === "codeForm") { ev.preventDefault(); const c = document.getElementById("accCode").value.replace(/\D/g, ""); if (c.length !== 6) return toast("Le code a 6 chiffres."); return verifyCode(c); }
  if (ev.target.id === "promoForm") {
    ev.preventDefault();
    const text = document.getElementById("prText").value.trim(), until = document.getElementById("prUntil").value;
    if (!text || !until) return toast("Indiquez l'offre et la date.");
    const snap = snapshot(), same = activePromo();
    const products = [...document.querySelectorAll("#prProds .pchip.on")].map(b => b.dataset.n);
    S.promo = { id: same ? S.promo.id : uid(), text, until, products, createdAt: same ? S.promo.createdAt : today() };
    save(); closeSheet(); tab = "today"; render(); window.scrollTo(0, 0);
    return toast(same ? "Promo mise à jour" : `Promo prête pour ${plural(promoTargets().length, "personne", "personnes")} dans « Aujourd'hui »`, snap);
  }
  if (ev.target.id === "prospectForm") { ev.preventDefault(); submitProspect(ev.target); }
  if (ev.target.id === "chatForm") { ev.preventDefault(); sendChat(); }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "search") {
    query = t.value; const pos = t.selectionStart; render();
    const s = document.getElementById("search"); s.focus(); s.setSelectionRange(pos, pos);
    app.firstElementChild.classList.remove("enter");
  }
  if (t.classList.contains("msg")) fitAreas(t.parentNode);
  if (t.id === "fDate" || t.id === "fName") updateEnd();
  if (t.id === "npName") { const e = estimateDays(t.value), d = document.getElementById("npDays"), h = document.getElementById("npEst");
    if (!d.dataset.touched) d.value = e.days; if (h) h.textContent = t.value.trim() ? (e.why ? `Estimation Recharge (${e.why}) : ${e.days} jours. Ajustez si vous savez mieux.` : "Pas d'estimation précise : 30 jours par défaut, ajustez si besoin.") : ""; }
  if (t.id === "npDays") t.dataset.touched = "1";
  if (t.id === "endIn") endInfo();
  if (t.id === "fEnd") { t.dataset.touched = "1"; updateEnd(); }
  if (t.id === "pNext") pform.touched = true;
  if (t.id === "fName") {
    const known = S.clients.some(x => x.name.toLowerCase() === t.value.trim().toLowerCase());
    document.getElementById("fRefWrap").classList.toggle("hidden", known);
    const c = S.clients.find(x => x.name.toLowerCase() === t.value.trim().toLowerCase());
    const ph = document.getElementById("fPhone");
    if (c && c.phone && !ph.value) ph.value = c.phone;
  }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  const row = t.closest(".prodrow");
  if (row) {
    const p = S.products.find(x => x.id === row.dataset.pid); if (!p) return;
    const f = t.dataset.field;
    if (f === "name") p.name = t.value.trim() || p.name;
    if (f === "days") setProductDays(p, Math.max(1, Math.round(num(t.value)) || p.days));
    if (f === "price") p.price = Math.max(0, num(t.value));
    save(); toast("Produit mis à jour"); return;
  }
  if (t.id === "setThreshold") {
    const v = Math.max(1, Math.round(num(t.value)) || 0);
    S.settings.vipOrders = v || SET_DEFAULTS.vipOrders;
    save(); toast("Réglage enregistré"); return;
  }
  if (t.id === "setCycle") {
    S.settings.cycle = Math.max(7, Math.min(180, Math.round(num(t.value)) || 30)); const g = genericProduct();
    for (const sl of S.sales) if (sl.productId === g.id && sl.status === "open" && !sl.learned) { sl.days = g.days; sl.end = addDays(sl.date, g.days * sl.qty); }
    save(); toast(`Relance ${S.settings.cycle} jours après une commande sans produit précis`); return;
  }
  if (t.id === "setBasket") { S.settings.basket = Math.max(0, Math.round(num(t.value)) || 0); save(); const sh = sheetEl.querySelector(".bilan"); if (sh) openBilan(document.querySelector("[data-act=bilanMonth].on").dataset.m); toast("Panier moyen enregistré"); return; }
  if (t.id === "setDiscount") { S.settings.discountOn = t.checked; save(); render(); toast(t.checked ? "Remise activée : vérifiez les règles de votre marque" : "Remise désactivée"); return; }
  if (t.id === "setNetC" || t.id === "setNetP") { const v = t.value.trim() === "" ? null : Math.max(0, Math.min(99, Math.round(num(t.value)) || 0)); S.settings[t.id === "setNetC" ? "netC" : "netP"] = v; save(); render(); return; }
  if (t.id === "setNewsC" || t.id === "setNewsP") { S.settings[t.id === "setNewsC" ? "newsC" : "newsP"] = t.checked; save(); return toast("Réglage enregistré"); }
  if (t.id === "setNewsText") { S.settings.newsText = t.value.trim(); save(); return toast("Message enregistré"); }
  if (t.id === "setEmoji") { S.emoji = t.checked; save(); render(); toast(t.checked ? "Les messages ont des emojis" : "Les messages sont sans emoji"); return; }
  if (t.id === "setLeader") { S.settings.leader = t.checked; save(); toast(t.checked ? "Option dirigeant activée : « Mon équipe » est dans Résultats" : "Option dirigeant désactivée"); return; }
  if (t.id === "setShop" || t.id === "setGift" || t.id === "setShopPhone") {
    S.settings[{ setShop: "shopName", setGift: "gift", setShopPhone: "shopPhone" }[t.id]] = t.value.trim(); save(); render(); toast("Carte fidélité mise à jour"); return;
  }
  if (t.id === "setEvery") { S.settings.every = Math.max(0, Math.min(20, Math.round(num(t.value)) || 0)); save(); render(); toast("Réglage enregistré"); return; }
  if (t.id === "setVipPct" || t.id === "setMargin") {
    const v = Math.max(0, Math.min(90, Math.round(num(t.value)) || 0));
    S.settings[t.id === "setVipPct" ? "vipPct" : "margin"] = v; save(); render(); toast("Réglage enregistré"); return;
  }
  if (t.dataset.cfield) {
    const c = client(t.dataset.id); if (!c) return;
    if (t.dataset.cfield === "name" && t.value.trim()) c.name = t.value.trim();
    if (t.dataset.cfield === "phone") c.phone = t.value.trim();
    if (["email", "insta", "fb", "interest", "note", "where"].includes(t.dataset.cfield)) c[t.dataset.cfield] = t.value.trim();
    if (t.dataset.cfield === "city") c.city = resolveCity(t.value);
    if (t.dataset.cfield === "news") c.noNews = !t.checked;
    if (t.dataset.cfield === "nocontact") c.noContact = t.checked;
    save(); render(); toast("Fiche mise à jour");
  }
});
document.addEventListener("change", async ev => {
  if (ev.target.id !== "chatFile" || !ev.target.files[0]) return;
  try { chatImg = await shrinkImage(ev.target.files[0]); render(); scrollChat(); } catch { toast("Cette image n'a pas pu être lue."); }
});
document.addEventListener("change", ev => {
  if (ev.target.id === "genWho") { gen.id = ev.target.value; gen.k = 0; openGen(); }
  if (ev.target.id === "findCity") { S.profile = { ...(S.profile || {}), city: ev.target.value.trim() }; save(); const t = document.querySelector(".sheet h3").textContent; openFind(t.includes("Hashtags") ? "tags" : t.includes("Lieux") ? "places" : "accounts"); }
  if (ev.target.id === "genProd") { gen.prod = ev.target.value.trim(); openGen(); }
});
document.addEventListener("change", ev => {
  const t = ev.target, id = t.id;
  const setProf = (k, v) => { S.profile = { ...(S.profile || {}), [k]: v }; };
  if (id === "setMyName") { setProf("name", t.value.trim()); S.settings.myName = t.value.trim(); }
  else if (id === "setBrand") setProf("brand", t.value.trim());
  else if (id === "setCity") setProf("city", t.value.trim());
  else if (id === "setAskDaily") S.settings.askDaily = t.checked;
  else if (id === "setShowFind") S.settings.showFind = t.checked;
  else if (id === "setIdeas") S.settings.ideas = t.checked;
  else if (id === "setBkReminder") S.settings.bkReminder = t.checked;
  else if (t.dataset && t.dataset.dur) { const v = Math.max(1, Math.min(60, parseInt(t.value, 10) || DUR_DEF[t.dataset.dur])); S.settings.dur = { ...(S.settings.dur || {}), [t.dataset.dur]: v }; t.value = v; }
  else return;
  save(); toast("Réglage enregistré ✅");
});
document.addEventListener("keydown", ev => { if (ev.target.id === "chatQ" && ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); sendChat(); } });
document.getElementById("importFile").addEventListener("change", async ev => {
  const file = ev.target.files[0]; ev.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.products) || !Array.isArray(data.clients) || !Array.isArray(data.sales) || !Array.isArray(data.events)) throw new Error("format");
    if (!confirm(`Restaurer cette sauvegarde (${plural(data.clients.length, "client", "clients")}${data.lastExport ? `, du ${fmt(data.lastExport)}` : ""}) ? Les données actuelles de ce téléphone seront remplacées.`)) return;
    migrate(data);
    const snap = snapshot(); S = data; save(); tab = "today"; render(); toast("Vos clients sont restaurés ✅", snap);
  } catch (e) { toast("Ce fichier n'est pas une sauvegarde Recharge valide."); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeSheet(); });
document.addEventListener("input", ev => { if (ev.target.dataset && ev.target.dataset.city) suggestCities(ev.target); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && !sheetEl.innerHTML) render(); });
const topbar = document.getElementById("topbar");
addEventListener("scroll", () => topbar.classList.toggle("scrolled", scrollY > 4), { passive: true });

/* Certains hébergeurs (ex. Netlify) ajoutent un badge en bas de l'écran : on remonte la barre d'onglets pour qu'il ne la cache pas */
function avoidHostBadge() {
  const b = document.getElementById("nl-badge-frame");
  document.documentElement.style.setProperty("--badge", b && b.offsetHeight ? "58px" : "0px");
}
new MutationObserver(avoidHostBadge).observe(document.body, { childList: true });
avoidHostBadge();

render();
if (DEMO && new URLSearchParams(location.search).get("s") === "team") setTimeout(() => {
  const h = [...document.querySelectorAll(".section h2")].find(x => x.textContent.startsWith("Mon équipe"));
  if (h) scrollTo(0, h.getBoundingClientRect().top + scrollY - 110);
}, 150);
if (teamNotice) setTimeout(() => toast(teamNotice), 300);
let obSkipFlag = false; try { obSkipFlag = localStorage.getItem("recharge.ob") === "skip"; } catch (e) {}
const loginParam = DEMO ? null : new URLSearchParams(location.search).get("login");
const paidParam = DEMO ? null : new URLSearchParams(location.search).get("paid");
if (paidParam) {
  history.replaceState(null, "", location.pathname);
  api("POST", "billing/confirm", { id: paidParam }).then(async r => { await afterLogin(r); toast("Bienvenue dans Recharge 🎉 Vos 14 jours gratuits commencent."); }).catch(e => toast(e.message));
} else if (loginParam) {
  history.replaceState(null, "", location.pathname);
  api("POST", "auth/verify", { token: loginParam, ref: readRef() }).then(afterLogin).catch(e => toast(e.message));
} else if (session) {
  /* Au démarrage : on récupère ce qu'un autre téléphone aurait sauvegardé, ou on envoie ce qui attend */
  api("GET", "me").then(async r => {
    session = { ...session, plan: r.user.plan, paid: !!r.user.paid, billing: !!r.user.billing, canSync: r.user.canSync }; writeLS(SESSION_KEY, session);
    if (r.analyse && !S.analyse) { S.analyse = r.analyse; save(); }
    const srv = r.backup ? r.backup.rev : 0;
    if (srv > sync.rev) { if (sync.dirty) return askConflict(r.backup); await pullNow(); render(); toast("Données mises à jour depuis votre autre appareil ☁️"); }
    else if (sync.dirty) pushNow();
  }).catch(() => {});
}
addEventListener("online", () => { if (sync.dirty) pushNow(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && sync.dirty) pushNow(); });
if (!DEMO && location.hash === "#abonnement") { history.replaceState(null, "", location.pathname); setTimeout(() => { if (BILLING_OK || API_OK) openUpgrade(); else setTimeout(openUpgrade, 1200); }, 400); }
if (!DEMO) {
  rcTrack("app_ouverte");
  if (FROM_ANALYSE) { rcTrack("app_depuis_analyse"); history.replaceState(null, "", location.pathname); const an = readAnalyse(); if (an && !S.analyse) { S.analyse = an; save(); } }
}
if (!DEMO && !S.profile && !obSkipFlag && !navigator.webdriver && !teamNotice && !loginParam && !paidParam && !session && location.hash !== "#abonnement") setTimeout(() => openOnboarding(0), 350);
if (!DEMO && !navigator.webdriver && S.profile && S.lastBilan !== today().slice(0, 7)) {
  const pm = prevMonth(today().slice(0, 7)), b = bilan(pm);
  S.lastBilan = today().slice(0, 7); save();
  if (b.relances || b.commandes) setTimeout(() => openBilan(pm), 500);
}
if (DEMO && new URLSearchParams(location.search).get("s") === "card") setTimeout(() => { const c = S.clients.find(x => x.status === "vip"); if (c) openFiche(c.id); }, 150);
if (DEMO && new URLSearchParams(location.search).get("s") === "fid") setTimeout(() => {
  const h = [...document.querySelectorAll(".section h2")].find(x => x.textContent.startsWith("Carte fidélité"));
  if (h) scrollTo(0, h.getBoundingClientRect().top + scrollY - 70);
}, 150);
</script>
</body>
