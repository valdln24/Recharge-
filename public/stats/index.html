<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Tunnel · Recharge</title>
<link rel="stylesheet" href="/assets/site.css?v=9">
<style>
body{background:var(--bg)}main{max-width:760px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:2rem;letter-spacing:-.04em;margin:0 0 6px}p.s{color:var(--ink-2);margin:0 0 22px}
form{display:flex;gap:8px;flex-wrap:wrap}input{flex:1 1 240px;min-height:48px;border:1px solid var(--line);border-radius:14px;padding:0 14px;font:inherit;font-size:16px}
.f{margin-top:26px;display:grid;gap:8px}.r{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.r b{font-size:1.2rem}.r small{color:var(--ink-3);font-weight:700;min-width:64px;text-align:right}.r i{display:block;height:6px;border-radius:9px;background:var(--orange);margin-top:6px}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}.k div{background:var(--navy);color:#fff;border-radius:16px;padding:14px}.k b{display:block;font-size:1.6rem}.k span{font-size:.8rem;color:#C3CCDA}
.err{color:#C2362B;font-weight:700;margin-top:12px}
</style></head><body><main>
<h1>Tunnel de Recharge</h1><p class="s"><a href="/admin/">Voir les prospects du Playbook →</a></p><p class="s">30 derniers jours. Un compteur anonyme par étape : aucun visiteur n'est identifié.</p>
<form id="f"><input id="key" type="password" placeholder="Clé de lecture (STATS_KEY)" autocomplete="current-password" required><button class="btn dark" type="submit">Afficher</button></form>
<div id="out"></div>
<script>
(function () {
  var STEPS = [["site_visite", "Visites de l'accueil"], ["analyse_cta", "Clic « Analyser mon activité »"], ["analyse_debut", "Analyse commencée"], ["analyse_resultat", "Analyse terminée"], ["analyse_email", "Email laissé"], ["analyse_essai", "Clic « Essayer avec mes clients »"], ["app_depuis_analyse", "Appli ouverte depuis l'analyse"], ["onboarding_fin", "Onboarding terminé"], ["premiers_clients", "Premiers clients ajoutés"], ["premiere_relance", "Première relance envoyée"], ["compte_cree", "Comptes créés"]];
  var out = document.getElementById("out"), key = document.getElementById("key");
  try { key.value = sessionStorage.getItem("rcStatsKey") || ""; } catch (e) {}
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault(); try { sessionStorage.setItem("rcStatsKey", key.value); } catch (x) {}
    fetch("/api/stats", { headers: { "X-Stats-Key": key.value } }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) {
      var tot = {}; d.events.forEach(function (x) { tot[x.name] = (tot[x.name] || 0) + x.n; });
      var top = tot.site_visite || 1, prev = null;
      var rows = STEPS.map(function (s) { var n = tot[s[0]] || 0, rate = prev ? (prev ? Math.round(n / prev * 100) : 0) + " %" : ""; prev = n || prev; return '<div class="r"><div>' + s[1] + '<i style="width:' + Math.min(100, Math.round(n / top * 100)) + '%"></i></div><b>' + n + "</b><small>" + rate + "</small></div>"; }).join("");
      out.innerHTML = '<div class="k"><div><b>' + (d.leads.n || 0) + '</b><span>emails laissés au total</span></div><div><b>' + (d.leads.news || 0) + '</b><span>acceptent les conseils</span></div><div><b>' + (d.users || 0) + '</b><span>comptes au total</span></div></div><div class="f">' + rows + '</div><p class="s" style="margin-top:12px">Le pourcentage compare chaque étape à la précédente.</p>';
    }).catch(function () { out.innerHTML = '<p class="err">Clé incorrecte, ou la clé STATS_KEY n\'est pas encore réglée dans Cloudflare.</p>'; });
  });
})();
</script></main></body></html>
