<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5e8467" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recharge">
<title>Recharge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235e8467'/%3E%3Cpath d='M20 34a12 12 0 1 0 4-9' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M18 18v9h9' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f8f4; --card:#ffffff; --text:#1d2a20; --muted:#667569; --line:#e1e8e0;
  --sage:#7fa286; --sage-d:#557c5e; --sage-l:#e7f0e8; --on-sage:#ffffff;
  --warn:#c98522; --warn-l:#fbf0dd; --late:#c0524a; --late-l:#f9e3e1;
  --wa:#1fa855; --shadow:0 1px 2px rgba(30,50,35,.06),0 4px 14px rgba(30,50,35,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111613; --card:#1a211c; --text:#e6eee7; --muted:#9cab9f; --line:#29332b;
    --sage:#8db494; --sage-d:#9cc4a3; --sage-l:#203026; --on-sage:#0f1f13;
    --warn:#e3a54c; --warn-l:#33291a; --late:#e57d74; --late-l:#3a2220;
    --wa:#2bc466; --shadow:none; color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  padding-bottom:calc(160px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
main{max-width:560px;margin:0 auto;padding:16px 16px 24px}
h2{font-size:1.05rem;margin:28px 0 10px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.hidden{display:none!important}

/* En-tête "Aujourd'hui" */
.hero{background:var(--sage-d);color:var(--on-sage);border-radius:22px;padding:22px 22px 20px;margin-top:4px}
.hero .date{opacity:.85;font-size:.92rem}
.hero .big{font-size:3.6rem;font-weight:800;line-height:1;margin-top:8px}
.hero .label{font-size:1.25rem;font-weight:600}
.hero.calm .big{font-size:2rem}

.banner{background:var(--warn-l);border-radius:16px;padding:12px 14px;margin-top:14px;font-size:.93rem;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner button{flex:none}

/* Cartes */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.name{background:none;border:0;padding:0;font-size:1.15rem;font-weight:700;text-align:left}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--warn-l);color:var(--warn);vertical-align:middle;margin-left:6px;text-transform:uppercase;letter-spacing:.03em}
.pill{flex:none;font-size:.82rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--sage-l);color:var(--sage-d)}
.pill.soon{background:var(--warn-l);color:var(--warn)}
.pill.late{background:var(--late-l);color:var(--late)}
.sub{color:var(--muted);font-size:.92rem;margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 4px}
.bar span{display:block;height:100%;border-radius:99px;background:var(--sage)}
.bar.soon span{background:var(--warn)} .bar.late span{background:var(--late)}
.barlbl{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
textarea.msg{width:100%;margin-top:12px;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;resize:vertical;min-height:96px;font-size:.95rem}
.msgtools{display:flex;justify-content:flex-end;margin-top:2px}
.link{background:none;border:0;color:var(--sage-d);font-weight:600;padding:8px 4px;font-size:.9rem}

/* Boutons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;border:0;font-weight:700;font-size:1.02rem;text-decoration:none;padding:0 14px}
.btn.primary{background:var(--sage-d);color:var(--on-sage)}
.btn.wa{background:var(--wa);color:#fff;margin-top:8px}
.btn.ghost{background:var(--sage-l);color:var(--sage-d)}
.btn.danger{background:var(--late-l);color:var(--late)}
.btn.small{min-height:40px;font-size:.92rem;width:auto;border-radius:12px}
.actions{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px;margin-top:8px}
.actions button{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:.9rem;padding:4px 6px;line-height:1.15}
.actions .reco{background:var(--sage-l);color:var(--sage-d);border-color:transparent}

.wait{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.wait:first-child{border-top:0}
.wait .btns{display:flex;gap:6px;flex:none}
.empty{text-align:center;color:var(--muted);padding:28px 10px}

/* Liste clients */
.search{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;margin-top:4px}
.clist .item{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:8px;text-align:left}
.clist .item b{font-size:1.02rem}

/* Résultats */
.kpi{background:var(--sage-d);color:var(--on-sage);border-radius:22px;padding:22px;margin-top:14px}
.kpi .lbl{font-size:1rem;opacity:.9;font-weight:600}
.kpi .val{font-size:3rem;font-weight:800;line-height:1.1;margin-top:4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center}
.stat .val{font-size:1.75rem;font-weight:800;line-height:1.1;white-space:nowrap}
.stat .lbl{font-size:.8rem;color:var(--muted);margin-top:4px;line-height:1.2}
.seg{display:flex;background:var(--sage-l);border-radius:14px;padding:4px;gap:4px;margin-top:4px}
.seg button{flex:1;min-height:42px;border:0;border-radius:11px;background:transparent;font-weight:700;color:var(--sage-d)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.hint{color:var(--muted);font-size:.88rem;margin-top:10px}

/* Formulaires */
label.f{display:block;font-weight:600;font-size:.92rem;margin-top:14px}
.input{display:block;width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:0 14px;margin-top:6px;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:10px 14px;font-weight:600;font-size:.93rem}
.chip.on{background:var(--sage-d);border-color:var(--sage-d);color:var(--on-sage)}
.chip.add{border-style:dashed;color:var(--sage-d)}
.stepper{display:flex;align-items:center;gap:0;margin-top:6px;border:1px solid var(--line);border-radius:14px;overflow:hidden;width:max-content;background:var(--bg)}
.stepper button{width:52px;height:50px;border:0;background:transparent;font-size:1.4rem;font-weight:700;color:var(--sage-d)}
.stepper output{min-width:44px;text-align:center;font-weight:800;font-size:1.15rem}
.two{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:end}
.endbox{background:var(--sage-l);color:var(--sage-d);border-radius:14px;padding:12px 14px;margin-top:16px;font-weight:600}
.subform{border:1px dashed var(--line);border-radius:14px;padding:4px 12px 12px;margin-top:10px}
.prodrow{display:grid;grid-template-columns:1fr 64px 76px 40px;gap:6px;align-items:center;margin-top:8px}
.prodrow .input{min-height:44px;margin:0;padding:0 10px;font-size:.93rem}
.prodhead{display:grid;grid-template-columns:1fr 64px 76px 40px;gap:6px;font-size:.75rem;color:var(--muted);margin-top:8px}
.x{width:40px;height:44px;border:0;border-radius:12px;background:var(--late-l);color:var(--late);font-weight:800}

/* Feuille (panneau du bas) */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 8px}
.sheet h3{margin:6px 0 2px;font-size:1.3rem}
.sheet .top{display:flex;justify-content:space-between;align-items:center}
.close{border:0;background:var(--sage-l);color:var(--sage-d);width:40px;height:40px;border-radius:99px;font-size:1.2rem;font-weight:700}
.hist{list-style:none;padding:0;margin:6px 0 0}
.hist li{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.hist li:first-child{border-top:0}
.hist small{color:var(--muted)}

/* Barre du bas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{position:relative;flex:1;border:0;background:none;padding:9px 2px 10px;font-size:.74rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--sage-d)}
nav.tabs .badge{position:absolute;left:calc(50% + 6px);top:4px;background:var(--late);color:#fff;font-size:.68rem;border-radius:99px;padding:0 6px;font-weight:800}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(78px + env(safe-area-inset-bottom));z-index:31;height:60px;border-radius:99px;border:0;background:var(--sage-d);color:var(--on-sage);font-weight:800;font-size:1.05rem;padding:0 22px 0 18px;box-shadow:0 6px 20px rgba(40,80,50,.35);display:flex;align-items:center;gap:8px}
.fab span{font-size:1.7rem;line-height:1;margin-top:-2px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));z-index:60;background:var(--text);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);width:max-content;font-size:.95rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:var(--sage);font-weight:800;padding:4px}
</style>
</head>
<body>
<main id="app"></main>

<button class="fab" id="fab" data-act="newSale" aria-label="Ajouter une vente"><span>+</span> Vente</button>

<nav class="tabs"><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span id="tabBadge"></span>Aujourd'hui</button>
  <button data-tab="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M17 4a4 4 0 0 1 0 8M22 21c0-3-1.5-5-4-5.7"/></svg>Clients</button>
  <button data-tab="results"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Résultats</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Réglages</button>
</div></nav>

<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>
"use strict";
/* ---------- Outils dates & texte ---------- */
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diff = (a, b) => Math.round((parse(a) - parse(b)) / 864e5); // a - b, en jours
const fmt = s => parse(s).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
const fmtLong = s => parse(s).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
const euro = n => (n || 0).toLocaleString("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: (n % 1 ? 2 : 0) });
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const firstName = n => (n || "").trim().split(/\s+/)[0] || "";
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const plural = (n, one, many) => n + " " + (n > 1 ? many : one);

/* ---------- Données (stockées uniquement dans ce téléphone) ---------- */
const KEY = "recharge.v1";
const DEFAULT_PRODUCTS = [
  { id: "p1", name: "Gel aloe vera", days: 30, price: 35 },
  { id: "p2", name: "Complément alimentaire", days: 30, price: 30 },
  { id: "p3", name: "Crème visage", days: 45, price: 28 },
  { id: "p4", name: "Shampoing", days: 60, price: 15 }
];
let S;
let storageOk = true;

function seed() {
  const t = today();
  const s = { v: 1, products: DEFAULT_PRODUCTS.map(p => ({ ...p })), clients: [], sales: [], events: [], tone: "tu", lastExport: null, seeded: true };
  const ex = [
    ["Marie Dupont", "06 00 00 00 01", "p1", 1, -32],  // fini depuis 2 jours
    ["Sophie Martin", "", "p2", 1, -30],               // se termine aujourd'hui
    ["Karim Benali", "06 00 00 00 03", "p3", 1, -43],  // dans 2 jours
    ["Julie Bernard", "06 00 00 00 04", "p1", 2, -10]  // dans 50 jours
  ];
  for (const [name, phone, pid, qty, ago] of ex) {
    const c = { id: uid(), name, phone, example: true };
    s.clients.push(c);
    const p = s.products.find(x => x.id === pid);
    s.sales.push(makeSale(c.id, p, qty, addDays(t, ago), true));
  }
  return s;
}
function makeSale(clientId, p, qty, date, example) {
  return { id: uid(), clientId, productId: p.id, product: p.name, days: p.days, price: p.price, qty, date,
    end: addDays(date, p.days * qty), status: "open", snooze: null, relancedAt: null, msg: Math.floor(Math.random() * 5), example: !!example };
}
function load() {
  try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { storageOk = false; return null; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }
  catch (e) { storageOk = false; }
}
S = load();
if (!S) { S = seed(); save(); }

const client = id => S.clients.find(c => c.id === id);
const sale = id => S.sales.find(s => s.id === id);
const logEvent = (type, s, extra) => S.events.push({ id: uid(), type, clientId: s.clientId, saleId: s.id, product: s.product, date: today(), example: s.example, ...extra });

/* ---------- Messages de relance ---------- */
function deProd(p) {
  let n = p.trim();
  if (/^[A-ZÀ-Ý][a-zà-ÿ]/.test(n)) n = n[0].toLowerCase() + n.slice(1);
  return (/^[aeiouyhàâéèêëîïôûü]/i.test(n) ? "d'" : "de ") + n;
}
const TEMPLATES = {
  tu: [
    "Coucou {p} ! 😊 Ta réserve {de} doit bientôt toucher à sa fin, non ? Je peux t'en remettre de côté si tu veux, dis-moi !",
    "Bonjour {p} ! J'espère que tu vas bien. Petit message pour savoir où tu en es de ta cure {de} : il t'en reste encore ? Si tu veux continuer, je m'occupe de tout 🌿",
    "Hello {p} ! Si mes calculs sont bons, ta cure {de} arrive au bout 😉 Tu veux que je te prépare la suite pour ne pas faire de pause ?",
    "Coucou {p} 🌿 Alors, ça te plaît, ta cure {de} ? Elle doit bientôt se terminer : je t'en réserve pour que tu ne sois pas à court ?",
    "Bonjour {p} ! Je passe ma petite commande cette semaine 😊 Tu veux que j'ajoute de quoi continuer ta cure {de} ? Dis-moi juste combien il t'en faut."
  ],
  vous: [
    "Bonjour {p} ! 😊 Votre réserve {de} doit bientôt toucher à sa fin, non ? Je peux vous en mettre de côté si vous le souhaitez, dites-moi !",
    "Bonjour {p}, j'espère que vous allez bien. Petit message pour savoir où vous en êtes de votre cure {de} : il vous en reste encore ? Si vous voulez continuer, je m'occupe de tout 🌿",
    "Bonjour {p} ! Si mes calculs sont bons, votre cure {de} arrive au bout 😉 Voulez-vous que je vous prépare la suite pour ne pas faire de pause ?",
    "Bonjour {p} 🌿 Alors, que pensez-vous de votre cure {de} ? Elle doit bientôt se terminer : je vous en réserve pour que vous ne soyez pas à court ?",
    "Bonjour {p} ! Je passe ma commande cette semaine 😊 Voulez-vous que j'ajoute de quoi continuer votre cure {de} ? Dites-moi simplement combien il vous en faut."
  ]
};
function message(s) {
  const list = TEMPLATES[S.tone] || TEMPLATES.tu;
  const c = client(s.clientId);
  return list[(s.msg || 0) % list.length].replace("{p}", firstName(c ? c.name : "")).replace("{de}", deProd(s.product));
}
function waNumber(phone) {
  let d = String(phone || "").replace(/[^\d+]/g, "");
  if (d.startsWith("+")) d = d.slice(1);
  else if (d.startsWith("00")) d = d.slice(2);
  else if (/^0\d{9}$/.test(d)) d = "33" + d.slice(1);   // numéro français 06…
  return d.replace(/\D/g, "");
}

/* ---------- Calculs ---------- */
function dueSales() {
  const t = today();
  return S.sales.filter(s => s.status === "open" && diff(s.end, t) <= 3 && (!s.snooze || s.snooze <= t))
    .sort((a, b) => a.end.localeCompare(b.end));
}
function waitingSales() {
  return S.sales.filter(s => s.status === "relance").sort((a, b) => a.relancedAt.localeCompare(b.relancedAt));
}
function timing(s) {
  const left = diff(s.end, today());
  if (left < 0) return { cls: "late", txt: left === -1 ? "Fini depuis hier" : `Fini depuis ${-left} jours` };
  if (left === 0) return { cls: "late", txt: "Se termine aujourd'hui" };
  if (left === 1) return { cls: "soon", txt: "Se termine demain" };
  if (left <= 3) return { cls: "soon", txt: `Se termine dans ${left} jours` };
  return { cls: "", txt: `Fin le ${fmt(s.end)}` };
}
function progress(s) {
  const total = Math.max(1, diff(s.end, s.date));
  return Math.max(0, Math.min(1, diff(today(), s.date) / total));
}

/* ---------- Affichage ---------- */
let tab = "today";
let period = "all";
let query = "";
const app = document.getElementById("app");

function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const n = new Set(dueSales().map(s => s.clientId)).size;
  document.getElementById("tabBadge").innerHTML = n ? `<span class="badge">${n}</span>` : "";
  app.innerHTML = ({ today: viewToday, clients: viewClients, results: viewResults, settings: viewSettings })[tab]();
  if (!storageOk) app.insertAdjacentHTML("afterbegin", `<div class="banner">⚠️ Ce navigateur bloque l'enregistrement (navigation privée ?). Vos données risquent d'être perdues.</div>`);
}

function exampleBanner() {
  return S.clients.some(c => c.example)
    ? `<div class="banner"><span>Les fiches marquées <span class="tag" style="margin:0">Exemple</span> servent à découvrir l'appli.</span><button class="btn small ghost" data-act="clearExamples">Les effacer</button></div>` : "";
}
const exTag = c => c && c.example ? `<span class="tag">Exemple</span>` : "";

function viewToday() {
  const due = dueSales();
  const n = new Set(due.map(s => s.clientId)).size;
  let h = `<section class="hero ${n ? "" : "calm"}"><div class="date">${esc(cap(fmtLong(today())))}</div>`;
  h += n ? `<div class="big">${n}</div><div class="label">${n > 1 ? "clients à relancer" : "client à relancer"}</div>`
         : `<div class="big">Personne à relancer aujourd'hui 🌿</div>`;
  h += `</section>` + exampleBanner();

  for (const s of due) {
    const c = client(s.clientId) || { name: "?" };
    const t = timing(s);
    const pct = Math.round(progress(s) * 100);
    const hasPhone = !!waNumber(c.phone);
    h += `<article class="card" data-sale="${s.id}">
      <div class="row"><div><button class="name" data-act="fiche" data-id="${c.id}">${esc(c.name)}</button>${exTag(c)}</div><span class="pill ${t.cls}">${t.txt}</span></div>
      <div class="sub">${esc(s.product)} × ${s.qty} · acheté le ${fmt(s.date)}</div>
      <div class="bar ${t.cls}"><span style="width:${pct}%"></span></div>
      <div class="barlbl"><span>Cure à ${pct} %</span><span>fin estimée le ${fmt(s.end)}</span></div>
      <textarea class="msg" id="msg-${s.id}" aria-label="Message pour ${esc(c.name)}">${esc(message(s))}</textarea>
      <div class="msgtools"><button class="link" data-act="nextMsg" data-id="${s.id}">↻ Autre message</button></div>
      ${hasPhone
        ? `<a class="btn wa" href="#" target="_blank" rel="noopener" data-act="wa" data-id="${s.id}">${waIcon} Envoyer sur WhatsApp</a>`
        : `<button class="btn wa" data-act="copy" data-id="${s.id}">📋 Copier le message</button>
           <div class="sub" style="text-align:center;margin-top:6px">Pas de numéro enregistré · <button class="link" data-act="waAny" data-id="${s.id}">ouvrir WhatsApp et choisir le contact</button></div>`}
      <div class="actions">
        <button data-act="relance" data-id="${s.id}">✓ Relancé</button>
        <button class="reco" data-act="reco" data-id="${s.id}">🛒 A recommandé</button>
        <button data-act="later" data-id="${s.id}">⏰ Plus tard<br><small style="font-weight:500">+3 jours</small></button>
      </div>
    </article>`;
  }

  const wait = waitingSales();
  if (wait.length) {
    h += `<h2>Relancés, en attente de réponse (${wait.length})</h2><div class="card">`;
    for (const s of wait) {
      const c = client(s.clientId) || { name: "?" };
      const d = diff(today(), s.relancedAt);
      h += `<div class="wait"><div><button class="name" style="font-size:1rem" data-act="fiche" data-id="${c.id}">${esc(c.name)}</button>${exTag(c)}
        <div class="sub">${esc(s.product)} · relancé ${d === 0 ? "aujourd'hui" : d === 1 ? "hier" : `il y a ${d} jours`}</div></div>
        <div class="btns"><button class="btn small ghost" data-act="reco" data-id="${s.id}">A recommandé</button><button class="btn small" style="background:var(--bg)" data-act="noFollow" data-id="${s.id}" aria-label="Sans suite">✕</button></div></div>`;
    }
    h += `</div>`;
  }

  if (!due.length) {
    const next = S.sales.filter(s => s.status === "open" && (diff(s.end, today()) > 3 || (s.snooze && s.snooze > today())))
      .sort((a, b) => a.end.localeCompare(b.end))[0];
    if (next) {
      const c = client(next.clientId);
      h += `<p class="empty">Prochaine fin de produit : <b>${esc(c ? c.name : "")}</b> (${esc(next.product)}) le ${fmt(next.end)}.</p>`;
    } else if (!S.sales.length) {
      h += `<p class="empty">Ajoutez votre première vente avec le bouton <b>+ Vente</b>.</p>`;
    }
  }
  return h;
}
const waIcon = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>`;

function viewClients() {
  const q = query.trim().toLowerCase();
  const list = S.clients.filter(c => !q || c.name.toLowerCase().includes(q) || (c.phone || "").replace(/\s/g, "").includes(q.replace(/\s/g, "")))
    .sort((a, b) => a.name.localeCompare(b.name, "fr"));
  let h = `<input class="search" id="search" type="search" placeholder="Rechercher un client…" value="${esc(query)}" autocomplete="off">`;
  h += exampleBanner();
  h += `<div class="clist">`;
  for (const c of list) {
    const next = S.sales.filter(s => s.clientId === c.id && (s.status === "open" || s.status === "relance")).sort((a, b) => a.end.localeCompare(b.end))[0];
    const t = next ? timing(next) : null;
    h += `<button class="item" data-act="fiche" data-id="${c.id}"><span><b>${esc(c.name)}</b>${exTag(c)}<div class="sub">${next ? esc(next.product) : "Aucun produit en cours"}</div></span>
      ${t ? `<span class="pill ${next.status === "relance" ? "" : t.cls}">${next.status === "relance" ? "Relancé" : t.txt}</span>` : ""}</button>`;
  }
  h += `</div>`;
  if (!S.clients.length) h += `<p class="empty">Aucun client pour l'instant.<br>Ils apparaissent ici dès votre première vente.</p>`;
  else if (!list.length) h += `<p class="empty">Aucun client ne correspond.</p>`;
  return h;
}

function stats() {
  const from = period === "month" ? today().slice(0, 8) + "01" : "0000";
  const ev = S.events.filter(e => e.date >= from);
  const relances = ev.filter(e => e.type === "relance").length;
  const recos = ev.filter(e => e.type === "recommande");
  const ca = recos.reduce((t, e) => t + (e.amount || 0), 0);
  return { relances, recos: recos.length, rate: relances ? Math.round(recos.length / relances * 100) : 0, ca, list: recos };
}
function viewResults() {
  const st = stats();
  let h = `<div class="seg"><button class="${period === "month" ? "on" : ""}" data-act="period" data-p="month">Ce mois-ci</button><button class="${period === "all" ? "on" : ""}" data-act="period" data-p="all">Depuis le début</button></div>`;
  h += `<section class="kpi"><div class="lbl">Chiffre d'affaires récupéré grâce aux relances</div><div class="val" id="kpiCA">${euro(st.ca)}</div></section>`;
  h += `<div class="grid3">
    <div class="stat"><div class="val" id="kpiRel">${st.relances}</div><div class="lbl">relances faites</div></div>
    <div class="stat"><div class="val" id="kpiReco">${st.recos}</div><div class="lbl">recommandes obtenues</div></div>
    <div class="stat"><div class="val" id="kpiRate">${st.rate} %</div><div class="lbl">taux de recommande</div></div></div>`;
  h += `<p class="hint">Le taux de recommande, c'est : sur 10 clients relancés, combien ont racheté. Les montants viennent des prix indiqués dans <b>Réglages › Mes produits</b>.</p>`;
  if (st.list.length) {
    h += `<h2>Dernières recommandes</h2><div class="card"><ul class="hist">`;
    for (const e of st.list.slice().reverse().slice(0, 15)) {
      const c = client(e.clientId);
      h += `<li><span><b>${esc(c ? c.name : "Client supprimé")}</b><br><small>${esc(e.product)} · ${fmt(e.date)}</small></span><b>${euro(e.amount)}</b></li>`;
    }
    h += `</ul></div>`;
  } else {
    h += `<p class="empty">Vos recommandes apparaîtront ici.<br>Chaque fois qu'un client rachète après une relance, appuyez sur <b>A recommandé</b>.</p>`;
  }
  return h;
}

function viewSettings() {
  let h = `<h2 style="margin-top:8px">Mes produits</h2><div class="card">
    <div class="sub">Durée = nombre de jours que dure 1 produit. Prix = prix de vente au client.</div>
    <div class="prodhead"><span>Produit</span><span>Jours</span><span>Prix €</span><span></span></div>`;
  for (const p of S.products) {
    h += `<div class="prodrow" data-pid="${p.id}">
      <input class="input" data-field="name" value="${esc(p.name)}" aria-label="Nom du produit">
      <input class="input" data-field="days" inputmode="numeric" value="${p.days}" aria-label="Durée en jours">
      <input class="input" data-field="price" inputmode="decimal" value="${String(p.price).replace(".", ",")}" aria-label="Prix">
      <button class="x" data-act="delProduct" data-id="${p.id}" aria-label="Supprimer ${esc(p.name)}">✕</button></div>`;
  }
  h += `<button class="btn ghost" style="margin-top:12px" data-act="addProductRow">+ Ajouter un produit</button></div>`;

  h += `<h2>Ton des messages</h2><div class="seg">
    <button class="${S.tone === "tu" ? "on" : ""}" data-act="tone" data-t="tu">Tutoiement</button>
    <button class="${S.tone === "vous" ? "on" : ""}" data-act="tone" data-t="vous">Vouvoiement</button></div>`;

  h += `<h2>Sauvegarde</h2><div class="card">
    <div class="sub">Vos données restent uniquement dans ce téléphone. Faites une sauvegarde de temps en temps (par exemple, envoyez-vous le fichier par e-mail) pour ne rien perdre.</div>
    <button class="btn primary" style="margin-top:12px" data-act="export">⬇️ Exporter mes données</button>
    <button class="btn ghost" style="margin-top:8px" data-act="import">⬆️ Importer une sauvegarde</button>
    <div class="hint">${S.lastExport ? "Dernière sauvegarde : " + fmt(S.lastExport) : "Aucune sauvegarde pour l'instant."}</div></div>`;

  if (S.clients.some(c => c.example)) {
    h += `<h2>Exemples</h2><button class="btn danger" data-act="clearExamples">Effacer les 4 clients d'exemple</button>`;
  }
  h += `<p class="hint" style="text-align:center;margin-top:30px">Recharge · version d'essai</p>`;
  return h;
}

/* ---------- Panneaux ---------- */
const sheetEl = document.getElementById("sheet");
function openSheet(html) {
  sheetEl.innerHTML = `<div class="sheet-bg" data-act="closeBg"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  document.body.style.overflow = "hidden";
}
function closeSheet() { sheetEl.innerHTML = ""; document.body.style.overflow = ""; }

let form = null; // état du formulaire de vente
function openNewSale(clientId) {
  const c = clientId && client(clientId);
  form = { pid: (S.products[0] || {}).id, qty: 1, adding: false };
  const names = S.clients.map(x => `<option value="${esc(x.name)}">`).join("");
  openSheet(`<div class="top"><h3>Nouvelle vente</h3><button class="close" data-act="close" aria-label="Fermer">✕</button></div>
    <form id="saleForm" autocomplete="off">
      <label class="f">Client<input class="input" id="fName" list="clientNames" required placeholder="Prénom Nom" value="${c ? esc(c.name) : ""}" enterkeyhint="next"></label>
      <datalist id="clientNames">${names}</datalist>
      <label class="f">Téléphone <span style="font-weight:400;color:var(--muted)">(facultatif)</span><input class="input" id="fPhone" type="tel" inputmode="tel" placeholder="06 12 34 56 78" value="${c ? esc(c.phone) : ""}"></label>
      <div class="f" style="font-weight:600;font-size:.92rem;margin-top:14px">Produit</div>
      <div class="chips" id="chips"></div>
      <div id="newProd" class="subform hidden">
        <label class="f">Nom du produit<input class="input" id="npName" placeholder="ex. : Dentifrice aloe vera"></label>
        <div class="two" style="grid-template-columns:1fr 1fr">
          <label class="f">Durée (jours)<input class="input" id="npDays" inputmode="numeric" value="30"></label>
          <label class="f">Prix (€)<input class="input" id="npPrice" inputmode="decimal" placeholder="0"></label>
        </div>
        <button type="button" class="btn ghost" style="margin-top:12px" data-act="saveNewProduct">Ajouter ce produit</button>
      </div>
      <div class="two">
        <div><div class="f" style="font-weight:600;font-size:.92rem;margin-top:14px">Quantité</div>
          <div class="stepper"><button type="button" data-act="qty" data-d="-1" aria-label="Moins">−</button><output id="fQty">1</output><button type="button" data-act="qty" data-d="1" aria-label="Plus">+</button></div></div>
        <label class="f">Date d'achat<input class="input" id="fDate" type="date" value="${today()}" max="${addDays(today(), 1)}"></label>
      </div>
      <div class="endbox" id="endBox"></div>
      <button class="btn primary" style="margin-top:16px" type="submit">Enregistrer la vente</button>
    </form>`);
  drawChips(); updateEnd();
  if (!c) setTimeout(() => document.getElementById("fName").focus(), 60);
}
function drawChips() {
  document.getElementById("chips").innerHTML = S.products.map(p =>
    `<button type="button" class="chip ${p.id === form.pid ? "on" : ""}" data-act="pick" data-id="${p.id}">${esc(p.name)} · ${p.days} j</button>`).join("")
    + `<button type="button" class="chip add" data-act="toggleNewProd">+ Autre produit</button>`;
}
function updateEnd() {
  const p = S.products.find(x => x.id === form.pid);
  const date = document.getElementById("fDate").value || today();
  document.getElementById("fQty").textContent = form.qty;
  const box = document.getElementById("endBox");
  if (!p) { box.textContent = "Choisissez un produit."; return; }
  const end = addDays(date, p.days * form.qty);
  const d = diff(end, today());
  box.innerHTML = `Fin estimée : <b>${fmtLong(end)}</b> (${d >= 0 ? "dans " + plural(d, "jour", "jours") : "déjà passée"})` +
    (p.price ? `<br><span style="font-weight:500">${euro(p.price * form.qty)}</span>` : "");
}
function submitSale() {
  const name = document.getElementById("fName").value.trim();
  const phone = document.getElementById("fPhone").value.trim();
  const date = document.getElementById("fDate").value || today();
  const p = S.products.find(x => x.id === form.pid);
  if (!name) { document.getElementById("fName").focus(); return toast("Indiquez le nom du client."); }
  if (!p) return toast("Choisissez un produit.");
  const snap = snapshot();
  let c = S.clients.find(x => x.name.toLowerCase() === name.toLowerCase());
  if (!c) { c = { id: uid(), name, phone, example: false }; S.clients.push(c); }
  else if (phone) c.phone = phone;
  // Une nouvelle vente du même produit remplace la précédente en cours
  let counted = false;
  for (const old of S.sales) {
    if (old.clientId === c.id && old.product === p.name && (old.status === "open" || old.status === "relance") && old.date <= date) {
      if (old.status === "relance") { logEvent("recommande", old, { amount: p.price * form.qty }); counted = true; }
      old.status = "rachete";
    }
  }
  S.sales.push(makeSale(c.id, p, form.qty, date, c.example));
  save(); closeSheet(); render();
  toast(counted ? `Vente enregistrée et comptée comme recommande 🎉` : `Vente enregistrée pour ${firstName(c.name)} ✓`, snap);
}

function openFiche(id) {
  const c = client(id); if (!c) return;
  const sales = S.sales.filter(s => s.clientId === id).sort((a, b) => b.date.localeCompare(a.date));
  const evs = S.events.filter(e => e.clientId === id && e.type !== "rachete").sort((a, b) => b.date.localeCompare(a.date));
  const STATUS = { open: "En cours", relance: "Relancé", recommande: "A recommandé", rachete: "Racheté", sanssuite: "Sans suite" };
  const EV = { relance: "💬 Relancé", recommande: "🛒 A recommandé", report: "⏰ Reporté de 3 jours", sanssuite: "✕ Sans suite" };
  openSheet(`<div class="top"><h3>${esc(c.name)}${exTag(c)}</h3><button class="close" data-act="close" aria-label="Fermer">✕</button></div>
    <label class="f">Nom<input class="input" data-cfield="name" data-id="${c.id}" value="${esc(c.name)}"></label>
    <label class="f">Téléphone<input class="input" type="tel" inputmode="tel" data-cfield="phone" data-id="${c.id}" value="${esc(c.phone)}" placeholder="Aucun numéro"></label>
    <button class="btn primary" style="margin-top:14px" data-act="newSaleFor" data-id="${c.id}">+ Nouvelle vente pour ${esc(firstName(c.name))}</button>
    <h2>Achats (${sales.length})</h2>
    <ul class="hist">${sales.map(s => `<li><span><b>${esc(s.product)} × ${s.qty}</b><br><small>Acheté le ${fmt(s.date)} · fin estimée le ${fmt(s.end)}${s.price ? " · " + euro(s.price * s.qty) : ""}</small><br><small>${STATUS[s.status] || ""}</small></span>
      <button class="x" data-act="delSale" data-id="${s.id}" aria-label="Supprimer cet achat">✕</button></li>`).join("") || `<li><small>Aucun achat.</small></li>`}</ul>
    <h2>Relances (${evs.length})</h2>
    <ul class="hist">${evs.map(e => `<li><span>${EV[e.type] || e.type}<br><small>${esc(e.product)}</small></span><small>${fmt(e.date)}${e.amount ? " · " + euro(e.amount) : ""}</small></li>`).join("") || `<li><small>Aucune relance pour l'instant.</small></li>`}</ul>
    <button class="btn danger" style="margin-top:22px" data-act="delClient" data-id="${c.id}">Supprimer ce client</button>`);
}

/* ---------- Annuler & messages ---------- */
const snapshot = () => JSON.stringify(S);
let toastTimer;
function toast(text, snap) {
  const el = document.getElementById("toast");
  el.innerHTML = `<div class="toast" role="status"><span>${esc(text)}</span>${snap ? `<button id="undo">Annuler</button>` : ""}</div>`;
  if (snap) document.getElementById("undo").onclick = () => { S = JSON.parse(snap); save(); render(); el.innerHTML = ""; };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.innerHTML = "", 4500);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (_) {}
    ta.remove(); return ok;
  }
}
const currentMsg = id => { const ta = document.getElementById("msg-" + id); return ta ? ta.value : message(sale(id)); };

/* ---------- Actions ---------- */
const actions = {
  newSale: () => openNewSale(),
  newSaleFor: el => { closeSheet(); openNewSale(el.dataset.id); },
  close: () => closeSheet(),
  closeBg: (el, ev) => { if (ev.target === el) closeSheet(); },
  fiche: el => openFiche(el.dataset.id),
  pick: el => { form.pid = el.dataset.id; drawChips(); updateEnd(); },
  qty: el => { form.qty = Math.max(1, Math.min(99, form.qty + Number(el.dataset.d))); updateEnd(); },
  toggleNewProd: () => { document.getElementById("newProd").classList.toggle("hidden"); document.getElementById("npName").focus(); },
  saveNewProduct: () => {
    const name = document.getElementById("npName").value.trim();
    if (!name) return toast("Indiquez le nom du produit.");
    const p = { id: uid(), name, days: Math.max(1, Math.round(num(document.getElementById("npDays").value)) || 30), price: num(document.getElementById("npPrice").value) };
    S.products.push(p); save(); form.pid = p.id;
    document.getElementById("newProd").classList.add("hidden"); drawChips(); updateEnd();
  },
  nextMsg: el => { const s = sale(el.dataset.id); s.msg = (s.msg || 0) + 1; save(); document.getElementById("msg-" + s.id).value = message(s); },
  wa: el => {
    const s = sale(el.dataset.id), c = client(s.clientId);
    el.href = `https://wa.me/${waNumber(c.phone)}?text=${encodeURIComponent(currentMsg(s.id))}`;
    setTimeout(() => toast("Une fois le message envoyé, appuyez sur « Relancé »."), 400);
    return true; // laisse le lien s'ouvrir
  },
  waAny: el => { window.open(`https://wa.me/?text=${encodeURIComponent(currentMsg(el.dataset.id))}`, "_blank"); },
  copy: async el => { const ok = await copyText(currentMsg(el.dataset.id)); toast(ok ? "Message copié ✓ Collez-le dans votre messagerie." : "Impossible de copier : sélectionnez le texte à la main."); },
  relance: el => {
    const s = sale(el.dataset.id), snap = snapshot();
    s.status = "relance"; s.relancedAt = today(); logEvent("relance", s);
    save(); render(); toast(`Relance de ${firstName(client(s.clientId).name)} notée ✓`, snap);
  },
  reco: el => {
    const s = sale(el.dataset.id), snap = snapshot();
    const p = S.products.find(x => x.id === s.productId) || { id: s.productId, name: s.product, days: s.days, price: s.price };
    if (s.status !== "relance") { logEvent("relance", s); s.relancedAt = today(); }
    s.status = "recommande";
    const n = makeSale(s.clientId, p, s.qty, today(), s.example);
    S.sales.push(n);
    logEvent("recommande", s, { amount: p.price * s.qty, newSaleId: n.id });
    save(); render(); toast(`Bravo ! Nouvelle vente créée pour ${firstName(client(s.clientId).name)} 🎉`, snap);
  },
  later: el => {
    const s = sale(el.dataset.id), snap = snapshot();
    s.snooze = addDays(today(), 3); logEvent("report", s);
    save(); render(); toast(`Reporté au ${fmt(s.snooze)}`, snap);
  },
  noFollow: el => {
    const s = sale(el.dataset.id), snap = snapshot();
    s.status = "sanssuite"; logEvent("sanssuite", s);
    save(); render(); toast("Classé sans suite", snap);
  },
  period: el => { period = el.dataset.p; render(); },
  tone: el => { S.tone = el.dataset.t; save(); render(); toast(S.tone === "tu" ? "Les messages tutoient vos clients." : "Les messages vouvoient vos clients."); },
  addProductRow: () => { S.products.push({ id: uid(), name: "Nouveau produit", days: 30, price: 0 }); save(); render();
    const rows = document.querySelectorAll(".prodrow"); const i = rows[rows.length - 1].querySelector("input"); i.focus(); i.select(); },
  delProduct: el => {
    const p = S.products.find(x => x.id === el.dataset.id);
    if (!confirm(`Retirer « ${p.name} » de la liste ? Les ventes déjà enregistrées sont conservées.`)) return;
    const snap = snapshot(); S.products = S.products.filter(x => x !== p); save(); render(); toast("Produit retiré", snap);
  },
  delSale: el => {
    if (!confirm("Supprimer cet achat ?")) return;
    const s = sale(el.dataset.id), snap = snapshot();
    S.sales = S.sales.filter(x => x !== s); S.events = S.events.filter(e => e.saleId !== s.id);
    save(); render(); openFiche(s.clientId); toast("Achat supprimé", snap);
  },
  delClient: el => {
    const c = client(el.dataset.id);
    if (!confirm(`Supprimer ${c.name} et tout son historique ?`)) return;
    const snap = snapshot();
    S.clients = S.clients.filter(x => x !== c); S.sales = S.sales.filter(s => s.clientId !== c.id);
    S.events = S.events.filter(e => e.clientId !== c.id);
    save(); closeSheet(); render(); toast("Client supprimé", snap);
  },
  clearExamples: () => {
    const snap = snapshot(), ids = new Set(S.clients.filter(c => c.example).map(c => c.id));
    S.clients = S.clients.filter(c => !ids.has(c.id)); S.sales = S.sales.filter(s => !ids.has(s.clientId));
    S.events = S.events.filter(e => !ids.has(e.clientId));
    save(); render(); toast("Exemples effacés", snap);
  },
  export: () => {
    S.lastExport = today(); save();
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `recharge-sauvegarde-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    render(); toast("Sauvegarde téléchargée ✓");
  },
  import: () => document.getElementById("importFile").click()
};

document.addEventListener("click", ev => {
  const tabBtn = ev.target.closest("[data-tab]");
  if (tabBtn) { tab = tabBtn.dataset.tab; closeSheet(); render(); window.scrollTo(0, 0); return; }
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const fn = actions[el.dataset.act];
  if (!fn) return;
  if (el.dataset.act === "closeBg") { fn(el, ev); return; }
  const keepDefault = fn(el, ev) === true;
  if (!keepDefault) ev.preventDefault();
});
document.addEventListener("submit", ev => { if (ev.target.id === "saleForm") { ev.preventDefault(); submitSale(); } });
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "search") { query = t.value; const pos = t.selectionStart; render(); const s = document.getElementById("search"); s.focus(); s.setSelectionRange(pos, pos); }
  if (t.id === "fDate") updateEnd();
  if (t.id === "fName") {
    const c = S.clients.find(x => x.name.toLowerCase() === t.value.trim().toLowerCase());
    const ph = document.getElementById("fPhone");
    if (c && c.phone && !ph.value) ph.value = c.phone;
  }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  const row = t.closest(".prodrow");
  if (row) {
    const p = S.products.find(x => x.id === row.dataset.pid); if (!p) return;
    const f = t.dataset.field;
    if (f === "name") p.name = t.value.trim() || p.name;
    if (f === "days") p.days = Math.max(1, Math.round(num(t.value)) || p.days);
    if (f === "price") p.price = Math.max(0, num(t.value));
    save(); toast("Produit mis à jour ✓"); return;
  }
  if (t.dataset.cfield) {
    const c = client(t.dataset.id); if (!c) return;
    if (t.dataset.cfield === "name" && t.value.trim()) c.name = t.value.trim();
    if (t.dataset.cfield === "phone") c.phone = t.value.trim();
    save(); render(); toast("Fiche mise à jour ✓"); return;
  }
  if (t.classList.contains("msg")) return;
});
document.getElementById("importFile").addEventListener("change", async ev => {
  const file = ev.target.files[0]; ev.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.products) || !Array.isArray(data.clients) || !Array.isArray(data.sales) || !Array.isArray(data.events)) throw new Error("format");
    if (!confirm(`Remplacer les données actuelles par cette sauvegarde (${plural(data.clients.length, "client", "clients")}) ?`)) return;
    const snap = snapshot(); S = data; save(); tab = "today"; render(); toast("Sauvegarde importée ✓", snap);
  } catch (e) { toast("Ce fichier n'est pas une sauvegarde Recharge valide."); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeSheet(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && !sheetEl.innerHTML) render(); });

render();
</script>
</body>
</html>
