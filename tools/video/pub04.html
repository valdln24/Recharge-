<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="font.css">
<style>
/* Pub 04 : une seule chose à la fois, tout dans un vrai téléphone (écrans réels de l'appli), logo dans son rond. 27 s.
   Rendu : PAGE=pub04.html DUR=27 FPS=60 W=540 H=960 node render.js sortie.mp4 */
:root{--ink:#22163D;--grad:linear-gradient(120deg,#F59A4A,#DB6578 52%,#7C7CF2);--mk-a:#FF782E;--mk-b:#DCDDFB;--mk-c:#1C1A22}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:540px;height:960px;overflow:hidden;background:#FCEBDD;font-family:Manrope,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#v{position:absolute;inset:0;overflow:hidden;perspective:1600px}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.7}
#b1{width:520px;height:520px;background:#F7A35C}#b2{width:480px;height:480px;background:#E7748A}#b3{width:520px;height:520px;background:#9A92F5}
#sheen{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.6),rgba(255,255,255,0) 60%)}
#stage{position:absolute;inset:0}
.glass{position:absolute;background:linear-gradient(150deg,rgba(255,255,255,.66),rgba(255,255,255,.3) 55%,rgba(255,255,255,.42));
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),0 30px 60px -24px rgba(219,101,120,.45),0 10px 24px -14px rgba(124,124,242,.3)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;background:linear-gradient(140deg,rgba(255,255,255,.95),rgba(255,255,255,.1) 40%,rgba(245,154,74,.3) 70%,rgba(124,124,242,.5));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
/* titres : zone du haut uniquement */
.tx{position:absolute;left:0;right:0;text-align:center;font-weight:800;letter-spacing:-.035em;line-height:1.04;padding:0 30px;font-size:52px}
.tx .w{display:inline-block;margin:0 .1em}
.tx .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
/* fiches clientes */
.fc{width:240px;height:76px;display:flex;align-items:center;gap:12px;padding:0 16px;border-radius:22px;left:0;top:0}
.fc i{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:15px;color:#fff;background:var(--grad)}
.fc b{display:block;font-size:16px;font-weight:800}
.fc span{display:block;font-size:12.5px;font-weight:600;color:rgba(34,22,61,.6);margin-top:2px}
.fc .ring{position:absolute;right:14px;top:50%;width:30px;height:30px;margin-top:-15px}
/* logo dans son rond */
.circle{border-radius:50%}
.mark{position:absolute;overflow:visible}
.word{position:absolute}.word svg{width:100%;height:100%;display:block}
.url{position:absolute;left:0;right:0;text-align:center}
.url span{display:inline-block;position:relative;padding:12px 26px;border-radius:999px;font-weight:800;font-size:22px}
/* téléphone */
#phone{position:absolute;left:120px;top:285px;width:300px;height:628px;border-radius:48px;padding:9px;transform-origin:150px 127px}
#scr{position:relative;width:282px;height:610px;border-radius:40px;overflow:hidden;background:#F4EFE8}
#scr img.page{position:absolute;left:0;top:0;width:282px;display:block}
#toast{position:absolute;left:12px;width:258px;top:405px;border-radius:999px;overflow:hidden}
#toast img{width:100%;display:block}
#tap{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.9)}
/* icônes maison de l'appli */
.tile{position:absolute;width:74px;height:74px;border-radius:22px;display:grid;place-items:center}
.tile svg{width:44px;height:44px;display:block}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 47%,rgba(255,255,255,.85),rgba(255,255,255,0) 50%);opacity:0}
</style></head><body>
<div id="v">
  <div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div><div id="sheen"></div>
  <div id="stage">
    <div id="fiches"></div>
    <!-- logo (scène 3 et fin) -->
    <div id="logo">
      <div class="glass circle" id="halo" style="left:145px;top:325px;width:250px;height:250px"></div>
      <svg class="mark" id="mark" viewBox="38 41 122 122" style="left:185px;top:365px;width:170px;height:170px"><defs><linearGradient id="rgM" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59A4A"/><stop offset=".5" stop-color="#DB6578"/><stop offset="1" stop-color="#7C7CF2"/></linearGradient></defs>
        <path id="mRing" d="M122.4 66.9A44 44 0 1 1 81.4 65.1" fill="none" stroke="url(#rgM)" stroke-width="17" pathLength="1" stroke-dasharray="1 1"/>
        <path id="mArrow" d="M66.5 47.5L101 52.5L80.5 80Z" fill="#7B83F6" stroke="#7B83F6" stroke-width="3" stroke-linejoin="round"/>
        <path id="mBolt" d="M109 76L84 111H99L91 136L118 99H103Z" fill="#111111" stroke="#111111" stroke-width="3" stroke-linejoin="round"/></svg>
      <div class="word" id="word" style="left:150px;top:604px;width:240px;height:59px"></div>
      <div class="url" id="url" style="top:690px"><span class="glass">getrecharge.fr</span></div>
    </div>
    <!-- téléphone avec les vrais écrans -->
    <div class="glass tile" id="t0" style="left:40px;top:400px"><svg viewBox="0 0 32 32" data-mk="list"></svg></div>
    <div class="glass tile" id="t1" style="left:40px;top:520px"><svg viewBox="0 0 32 32" data-mk="pin"></svg></div>
    <div class="glass tile" id="t2" style="left:426px;top:400px"><svg viewBox="0 0 32 32" data-mk="charge"></svg></div>
    <div class="glass tile" id="t3" style="left:426px;top:520px"><svg viewBox="0 0 32 32" data-mk="venn"></svg></div>
    <div class="glass" id="phone"><div id="scr">
      <img class="page" id="p1" src="v04/ecran-jour.jpg" alt="">
      <img class="page" id="p2" src="v04/ecran-martine.jpg" alt="">
      <div id="tap"></div>
      <div id="toast"><img src="v04/toast.png" alt=""></div>
    </div></div>
    <!-- titres -->
    <div class="tx" id="h1" style="top:105px"><span class="w">Vos</span> <span class="w">clients</span> <span class="w">vous</span> <span class="w g">échappent&nbsp;?</span></div>
    <div class="tx" id="h2" style="top:110px"><span class="w">Martine</span> <span class="w">a</span> <span class="w">fini</span> <span class="w">sa</span> <span class="w">crème…</span></div>
    <div class="tx" id="h3" style="top:110px"><span class="w">…et</span> <span class="w">commande</span> <span class="w g">ailleurs.</span></div>
    <div class="tx" id="h4" style="top:125px"><span class="w">Votre</span> <span class="w g">coach</span> <span class="w">du</span> <span class="w">jour.</span></div>
    <div class="tx" id="h5" style="top:100px"><span class="w">Fin</span> <span class="w">dans</span> <span class="w g">5&nbsp;jours.</span></div>
    <div class="tx" id="h6" style="top:100px"><span class="w">Relancez</span> <span class="w">en</span> <span class="w g">un&nbsp;clic.</span></div>
    <div class="tx" id="h7" style="top:100px;font-size:44px"><span class="w">Moins</span> <span class="w">d'oublis.</span><br><span class="w">Plus</span> <span class="w">de</span> <span class="w g">commandes.</span></div>
  </div>
  <div id="flash"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const k = (t, a, b) => cl((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3), ex = x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x), ei = x => x * x * x;
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const lerp = (a, b, x) => a + (b - a) * x;
const S = (el, o) => { const s = el.style; for (const kk in o) s[kk] = o[kk]; };
const vis = (el, on) => { el.style.visibility = on ? "visible" : "hidden"; };

/* Icônes maison de l'appli Recharge (copiées telles quelles) */
const MK = {
  list: `<rect x="6" y="4" width="20" height="24" rx="6" fill="var(--mk-b)"/><circle cx="11.5" cy="11" r="2" fill="var(--mk-a)"/><rect x="15.5" y="10" width="6.5" height="2" rx="1" fill="var(--mk-c)"/><circle cx="11.5" cy="16.5" r="2" fill="var(--mk-a)"/><rect x="15.5" y="15.5" width="6.5" height="2" rx="1" fill="var(--mk-c)"/><circle cx="11.5" cy="22" r="2" fill="var(--mk-a)" opacity=".4"/><rect x="15.5" y="21" width="4.5" height="2" rx="1" fill="var(--mk-c)" opacity=".4"/>`,
  pin: `<path d="M16 29.5s-9.5-8.4-9.5-15.6a9.5 9.5 0 0 1 19 0c0 7.2-9.5 15.6-9.5 15.6z" fill="var(--mk-b)"/><circle cx="16" cy="14" r="4.4" fill="var(--mk-a)"/><circle cx="16" cy="14" r="1.6" fill="var(--mk-c)"/>`,
  venn: `<circle cx="12" cy="16" r="8.5" fill="var(--mk-b)"/><circle cx="20" cy="16" r="8.5" fill="var(--mk-a)" opacity=".92"/><path d="M16 8.6a8.5 8.5 0 0 1 0 14.8 8.5 8.5 0 0 1 0-14.8z" fill="var(--mk-c)"/>`,
  charge: `<circle cx="16" cy="16" r="11.5" fill="none" stroke="var(--mk-b)" stroke-width="3.4"/><path d="M16 4.5A11.5 11.5 0 1 1 4.5 16" fill="none" stroke="var(--mk-a)" stroke-width="3.4" stroke-linecap="round"/><path d="M17.2 10.5l-4.4 6.2h3.6l-1.6 5 4.6-6.4h-3.6z" fill="var(--mk-c)"/>`,
};
document.querySelectorAll("svg[data-mk]").forEach(e => { e.innerHTML = MK[e.dataset.mk]; });

/* Titres : mot par mot, du flou au net */
const H = {}; document.querySelectorAll(".tx").forEach(e => { H[e.id] = [...e.querySelectorAll(".w")]; });
function title(id, t, tin, tout, step = .08) {
  const on = t > tin - .05 && t < tout + .3; vis($(id), on); if (!on) return;
  H[id].forEach((w, i) => {
    const a = k(t, tin + i * step, tin + i * step + .3), o = k(t, tout, tout + .22);
    S(w, { opacity: a * (1 - o), filter: `blur(${(1 - eo(a)) * 12 + o * 10}px)`, transform: `translateY(${(1 - back(a, 1.3)) * 20 - o * 14}px)` });
  });
}

/* Fiches clientes (prénoms de la démo) */
const FC = [["MD", "Marie Dupont", "Thé détox"], ["SM", "Sophie Martin", "Complément"], ["KB", "Karim Benali", "Crème visage"], ["JB", "Julie Bernard", "Thé détox"],
  ["PM", "Paul Mercier", "Crème visage"], ["IL", "Inès Laurent", "Thé détox"], ["ML", "Martine Leroy", "Crème visage"]];
$("fiches").innerHTML = `<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="rgd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59A4A"/><stop offset=".5" stop-color="#DB6578"/><stop offset="1" stop-color="#7C7CF2"/></linearGradient></defs></svg>` +
  FC.map(([i, n, p], j) => `<div class="glass fc" id="fc${j}"><i>${i}</i><div><b>${n}</b><span>${p}</span></div><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" fill="none" stroke="rgba(34,22,61,.1)" stroke-width="5"/><circle class="rg" cx="18" cy="18" r="14" fill="none" stroke="url(#rgd)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(.3 + (j * .13) % .55) * 88} 88" transform="rotate(-90 18 18)"/></svg></div>`).join("");
const fcs = FC.map((_, j) => $("fc" + j));
const HOME = [[-125, -170], [125, -100], [-130, -15], [125, 70], [-120, 155], [125, 240], [0, 330]];
const SCAT = [[-560, -380], [580, -260], [-620, -20], [600, 140], [-560, 380], [560, 520], [0, 0]];

/* Écran du téléphone : 390 px d'appli = 282 px ici */
const PX = 282 / 390;

function render(t) {
  S($("b1"), { transform: `translate(${-160 + Math.sin(t * .35) * 70}px,${-140 + Math.cos(t * .27) * 60}px)` });
  S($("b2"), { transform: `translate(${260 + Math.cos(t * .31) * 80}px,${300 + Math.sin(t * .23) * 90}px)` });
  S($("b3"), { transform: `translate(${-120 + Math.sin(t * .21 + 2) * 90}px,${620 + Math.cos(t * .33) * 70}px)` });

  /* 1-2 : les fiches s'éparpillent, Martine reste puis s'éteint ; 3 : aspirées dans le rond */
  const onF = t < 8.3; vis($("fiches"), onF);
  if (onF) fcs.forEach((el, j) => {
    const fl = Math.sin(t * 1.3 + j * 1.7) * 4, a = back(k(t, .05 + j * .08, .55 + j * .08), 1.5);
    let x = HOME[j][0] * a, y = HOME[j][1] * a, s = lerp(.5, 1, eo(k(t, .05 + j * .08, .5 + j * .08))), o = k(t, .05 + j * .08, .3 + j * .08), b = 0, gray = 0, rot = (1 - a) * 14;
    const sc = ei(k(t, 2.3, 3.0));
    if (j < 6) { x = lerp(x, SCAT[j][0], sc); y = lerp(y, SCAT[j][1], sc); b = sc * 14; rot += sc * (j % 2 ? 20 : -20); }
    else {
      const m = eio(k(t, 2.35, 3.4)); x = lerp(x, 0, m); y = lerp(y, 60, m); s = lerp(s, 1.5, m);
      gray = eo(k(t, 5.0, 6.4)); o *= lerp(1, .5, gray); y += eo(k(t, 5.0, 7.0)) * 20;
      el.querySelector(".rg").setAttribute("stroke-dasharray", `${lerp(.62, .04, eio(k(t, 3.6, 6.2))) * 88} 88`);
    }
    if (j < 6 && t > 6.9) { const r = eo(k(t, 6.9, 7.45)); x = lerp(SCAT[j][0], HOME[j][0] * .6, r); y = lerp(SCAT[j][1], HOME[j][1] * .6, r); b = lerp(14, 2, r); o = r * .9; s = .85; }
    if (t > 7.4) { const q = ei(k(t, 7.4 + j * .04, 8.05 + j * .04)); x = lerp(x, 0, q); y = lerp(y, -30, q); s = lerp(s, .1, q); rot += q * 80 * (j % 2 ? 1 : -1); o *= 1 - q; b += q * 6; if (j === 6) gray = lerp(gray, 0, k(t, 7.3, 7.7)); }
    S(el, { transform: `translate(${270 - 120 + x}px,${480 - 38 + y + fl}px) rotate(${rot}deg) scale(${s})`, opacity: o, filter: `blur(${b}px) grayscale(${gray})` });
  });
  title("h1", t, .3, 2.35);
  title("h2", t, 3.15, 4.85, .09);
  title("h3", t, 5.0, 6.85, .1);

  /* 3 et 8 : le logo se remplit dans son rond */
  const L1 = t > 7.4 && t < 11.2, L2 = t > 25.2; vis($("logo"), L1 || L2);
  if (L1 || L2) {
    const t0 = L1 ? 7.5 : 25.25, out = L1 ? ei(k(t, 10.7, 11.05)) : 0, fl = Math.sin(t * 1.3) * 4;
    const h = back(k(t, t0, t0 + .6), 1.4);
    S($("halo"), { transform: `translateY(${fl}px) scale(${lerp(.3, 1, h) * (1 - out * .2)})`, opacity: k(t, t0, t0 + .25) * (1 - out) });
    const r0 = L1 ? 8.05 : 25.45;
    $("mRing").style.strokeDashoffset = 1 - eio(k(t, r0, r0 + (L1 ? .9 : .6)));
    const a0 = L1 ? 8.8 : 25.95, ar = back(k(t, a0, a0 + .32), 2.4), bo = back(k(t, a0 + .2, a0 + .52), 2.6);
    S($("mArrow"), { opacity: k(t, a0, a0 + .08), transformOrigin: "84px 62px", transform: `rotate(${(1 - ar) * -60}deg) scale(${ar})` });
    S($("mBolt"), { opacity: k(t, a0 + .2, a0 + .28), transformOrigin: "101px 106px", transform: `scale(${bo})` });
    S($("mark"), { opacity: k(t, r0 - .05, r0 + .05) * (1 - out), transform: `translateY(${fl}px) scale(${1 - out * .2})` });
    const w0 = L1 ? 9.45 : 26.0, wd = eo(k(t, w0, w0 + .45));
    S($("word"), { opacity: wd * (1 - out), transform: `translateY(${(1 - wd) * 14}px)`, filter: `blur(${(1 - wd) * 8}px)` });
    const u = back(k(t, 26.25, 26.65), 1.6);
    S($("url"), { opacity: L2 ? k(t, 26.25, 26.4) : 0, transform: `translateY(${(1 - u) * 18}px)` });
  }
  S($("flash"), { opacity: Math.max(0, 1 - Math.abs(t - 9.05) / .28) * .55 });

  /* 4 à 7 : le téléphone et les vrais écrans */
  const onP = t > 10.9 && t < 25.6; vis($("phone"), onP);
  if (onP) {
    const enter = back(k(t, 11.0, 11.8), 1.2);
    // défilement de l'appli (en px de l'appli)
    let sy = lerp(0, 470, eio(k(t, 12.9, 13.6)));
    sy = lerp(sy, 925, eio(k(t, 14.0, 14.7)));
    sy = lerp(sy, 1049, eio(k(t, 17.6, 18.5)));
    sy = lerp(sy, 0, eio(k(t, 23.0, 23.6)));
    // zoom sur Martine puis retour
    const zin = ex(k(t, 15.0, 15.5)), zout = eio(k(t, 22.95, 23.6));
    let sc = lerp(1, 1.5, zin); sc = lerp(sc, .8, zout);
    const fall = ei(k(t, 25.05, 25.45));
    S($("phone"), { transform: `translateY(${(1 - enter) * 700 + Math.sin(t * 1.2) * 4 + zout * -40 + fall * 140}px) rotateX(${(1 - enter) * 18}deg) scale(${sc})`, opacity: 1 - fall, transformOrigin: zout > 0 ? `150px ${lerp(127, 0, zout)}px` : "150px 127px" });
    // bascule vers la carte dépliée, puis retour à l'écran du jour
    const sw = k(t, 16.9, 17.25) * (1 - k(t, 22.95, 23.2));
    S($("p1"), { transform: `translateY(${-sy * PX}px)` });
    S($("p2"), { transform: `translateY(${-sy * PX}px)`, opacity: sw });
    // appui sur « Envoyer sur WhatsApp »
    const tp = k(t, 20.85, 21.35);
    S($("tap"), { left: (195 * PX) + "px", top: ((1477 - sy) * PX) + "px", opacity: tp > 0 && tp < 1 ? (1 - tp) : 0, transform: `scale(${lerp(.3, 1.6, eo(tp))})` });
    const to = back(k(t, 21.3, 21.7), 1.6);
    S($("toast"), { opacity: k(t, 21.3, 21.45) * (1 - k(t, 22.9, 23.1)), transform: `translateY(${(1 - to) * 30}px)` });
  }
  // icônes maison autour du téléphone (scènes 4 et 7)
  ["t0", "t1", "t2", "t3"].forEach((id, j) => {
    const a = back(k(t, 11.9 + j * .12, 12.4 + j * .12), 2), out1 = k(t, 14.7, 14.95);
    const b = back(k(t, 23.55 + j * .1, 24.05 + j * .1), 2), out2 = k(t, 25.0, 25.3);
    const o = Math.max(k(t, 11.9 + j * .12, 12.05 + j * .12) * (1 - out1), k(t, 23.55 + j * .1, 23.7 + j * .1) * (1 - out2));
    const s = t < 20 ? a * (1 - out1 * .4) : b * (1 - out2 * .4);
    vis($(id), o > 0.001);
    S($(id), { opacity: o, transform: `translateY(${Math.sin(t * 1.6 + j * 1.8) * 6}px) rotate(${Math.sin(t + j) * 4}deg) scale(${s})` });
  });
  title("h4", t, 11.5, 14.75);
  title("h5", t, 15.45, 18.75);
  title("h6", t, 19.2, 22.75);
  title("h7", t, 23.35, 25.0, .1);
}
window.render = render; window.warp = t => t;
fetch("logo-clair.svg").then(r => r.text()).then(s => {
  $("word").innerHTML = s.replace(/width="\d+" height="\d+"/, "").replace(/style="[^"]*"/, 'style="width:100%;height:100%"').replace('viewBox="10 40 620 125"', 'viewBox="205 55 425 105"').replace(/rglogo/g, "rgW");
  return Promise.all([...document.images].map(i => i.decode().catch(() => {})));
}).then(() => document.fonts.ready).then(() => { render(0); window.__ready = true; });
</script>
</body></html>
