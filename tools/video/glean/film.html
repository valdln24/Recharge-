<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../font.css">
<!-- Film de lancement Recharge (60 s), construit sur le modèle du film Glean.
     Rendu : PAGE=glean/film.html DUR=60 W=960 H=540 node render.js sortie.mp4 -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:960px;height:540px;overflow:hidden;background:#F4EFE8;font-family:Manrope,sans-serif;color:#1C1A22;-webkit-font-smoothing:antialiased}
.sc{position:absolute;left:0;top:0;width:960px;height:540px;overflow:hidden;display:none}
.cam{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:480px 270px}
.bk{position:absolute;left:0;top:0;width:960px;height:540px;overflow:hidden}
.fr{position:absolute;left:0;top:0;width:960px;height:540px}
.ab{position:absolute;left:0;top:0}
.H{font-weight:500;letter-spacing:-.045em;line-height:1.02;white-space:nowrap}
.gt{background:linear-gradient(100deg,#F59A4A,#DB6578 50%,#7C7CF2);-webkit-background-clip:text;background-clip:text;color:transparent}
.w{display:inline-block;will-change:transform}
.w.gt{padding:0 .02em .16em;margin:0 -.02em -.16em}   /* garde le bas des lettres (g, p) dans le dégradé */
.ck{display:flex!important;align-items:center;justify-content:center}.ck>div{width:100%;height:100%}.ck svg,.stp svg{display:block;width:100%;height:100%}
/* verre liquide */
.gl{position:absolute;left:0;top:0;overflow:hidden;transform-origin:50% 50%;isolation:isolate}
.gl .gi{position:absolute;left:0;top:0;width:100%;height:100%}
.gl .gb{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0}
.gl .gt2{position:absolute;inset:0;border-radius:inherit}
.gl .rim{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 .7px rgba(255,255,255,.75),inset 1.5px 2px 1.5px -1px rgba(255,255,255,.95),inset -1.5px -2px 2px -1px rgba(255,255,255,.55),inset 0 -10px 18px -14px rgba(255,255,255,.7)}
.gl .spec{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
.gl .ct{position:absolute;inset:0;border-radius:inherit}
.shd{position:absolute;left:0;top:0;border-radius:999px;filter:blur(9px);background:rgba(40,30,60,.22)}
/* cartes */
.card{position:absolute;left:0;top:0;background:#FCFBF9;border-radius:12px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 10px 26px -12px rgba(40,30,60,.28),0 0 0 .5px rgba(28,26,34,.06)}
.tile{display:flex;align-items:center;justify-content:center;border-radius:10px;background:linear-gradient(135deg,#FDE8EA,#E8E9FD)}
.tile svg{width:60%;height:60%}
.av{display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:800;font-size:10px;letter-spacing:-.02em;box-shadow:0 0 0 2px #fff,0 4px 10px -4px rgba(40,30,60,.4)}
.lbl{font-size:7.5px;font-weight:700;color:#8A8390;letter-spacing:.02em}
.cur{position:absolute;left:0;top:0;width:22px;height:22px;filter:drop-shadow(0 3px 4px rgba(28,26,34,.3));z-index:50}
.dot{position:absolute;left:0;top:0;width:5px;height:5px;border-radius:50%;margin:-2.5px 0 0 -2.5px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs id="defs">
  <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59A4A"/><stop offset=".5" stop-color="#DB6578"/><stop offset="1" stop-color="#7C7CF2"/></linearGradient>
</defs></svg>
<div id="root"></div>
<script>
const $ = s => document.querySelector(s), R = document.getElementById("root");
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), k = (t, a, b) => cl((t - a) / (b - a)), L = (a, b, x) => a + (b - a) * x;
const eo = x => 1 - Math.pow(1 - cl(x), 3), eo5 = x => 1 - Math.pow(1 - cl(x), 5), ei = x => Math.pow(cl(x), 3), eio = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const sm = x => { x = cl(x); return x * x * (3 - 2 * x); };
const spr = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-6 * x) * Math.cos(10 * x);
const punch = (lt, a = .22) => lt < 0 ? 1 : 1 + a * Math.exp(-lt * 9) * Math.cos(lt * 15);
const rnd = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const h = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; };
const tf = (el, x, y, s = 1, r = 0, o = 1, extra = "") => { el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s}) ${extra}`; el.style.opacity = o; };
const typed = (str, x) => str.slice(0, Math.round(str.length * cl(x)));

/* icônes maison (trait 2 px) */
const IC = {
  reassort: '<path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v3.5H16"/><path d="M9.5 14.5v-2M12 14.5v-4M14.5 14.5V12"/>',
  suivi: '<path d="M4.5 5.5h15v10h-9l-5 4v-4h-1z"/><path d="M9 10.5l2 2 4-4"/>',
  prospect: '<circle cx="10" cy="8.5" r="3.2"/><path d="M4.5 19.5c.8-3.4 3-5.2 5.5-5.2s4.7 1.8 5.5 5.2"/><path d="M18.5 4.5l.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6z"/>',
  reseau: '<circle cx="12" cy="5.5" r="2.3"/><circle cx="5.5" cy="17.5" r="2.3"/><circle cx="18.5" cy="17.5" r="2.3"/><path d="M10.8 7.5l-4.2 8M13.2 7.5l4.2 8M7.8 17.5h8.4"/>',
  fidelite: '<rect x="3.5" y="6" width="17" height="12" rx="3"/><circle cx="15.5" cy="12" r="2.6"/><path d="M6.5 10h4M6.5 13.5h3"/>',
  coach: '<path d="M4.5 5.5h15v10h-9l-5 4v-4h-1z"/><path d="M12.8 7.5l-2.6 3.6h2.6l-1.2 2.6"/>',
  reporter: '<circle cx="11" cy="12" r="7"/><path d="M11 8.5V12l2.5 1.5"/><path d="M19.5 5.5l1 2.5-2.5.8"/>',
  ignorer: '<path d="M3.5 12s3-5.5 8.5-5.5S20.5 12 20.5 12s-3 5.5-8.5 5.5S3.5 12 3.5 12z"/><circle cx="12" cy="12" r="2.4"/><path d="M5 19L19 5"/>',
  fiche: '<rect x="4" y="4.5" width="16" height="15" rx="3"/><circle cx="12" cy="10" r="2.5"/><path d="M8 16.5c.8-1.8 2.2-2.6 4-2.6s3.2.8 4 2.6"/>',
  sat: '<circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10" r=".7"/><circle cx="15" cy="10" r=".7"/><path d="M8.5 14c1 1.4 2.2 2 3.5 2s2.5-.6 3.5-2"/>',
  mit: '<circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10" r=".7"/><circle cx="15" cy="10" r=".7"/><path d="M8.8 15h6.4"/>',
  pas: '<circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10" r=".7"/><circle cx="15" cy="10" r=".7"/><path d="M8.5 16c1-1.4 2.2-2 3.5-2s2.5.6 3.5 2"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  thermo: '<path d="M10 14.5V5a2 2 0 1 1 4 0v9.5a3.5 3.5 0 1 1-4 0z"/><path d="M12 16.5V9"/>',
  import: '<rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M12 7.5v7M8.8 11.5L12 14.7l3.2-3.2"/>',
  euro: '<path d="M17 6.5a6.5 6.5 0 1 0 0 11"/><path d="M5 10.5h8M5 13.5h8"/>',
  wa: '<path d="M4.5 19.5l1.2-3.8A7.8 7.8 0 1 1 8.6 18.5z"/><path d="M9.3 9.2c.3 2.3 2.3 4.4 4.8 5"/>',
  arrow: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  home: '<path d="M4.5 11L12 4.5l7.5 6.5v8.5h-5v-5h-5v5h-5z"/>',
  play: '<path d="M8 5.5l11 6.5-11 6.5z"/>',
  cal: '<rect x="4" y="5.5" width="16" height="14" rx="3"/><path d="M8 3.5v4M16 3.5v4M4 10h16"/>'
};
const ico = (k, col = "currentColor", sw = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const MK = {
  list: `<rect x="6" y="4" width="20" height="24" rx="6" fill="#DCDDFB"/><circle cx="11.5" cy="11" r="2" fill="#FF782E"/><rect x="15.5" y="10" width="6.5" height="2" rx="1" fill="#1C1A22"/><circle cx="11.5" cy="16.5" r="2" fill="#FF782E"/><rect x="15.5" y="15.5" width="6.5" height="2" rx="1" fill="#1C1A22"/><circle cx="11.5" cy="22" r="2" fill="#FF782E" opacity=".4"/><rect x="15.5" y="21" width="4.5" height="2" rx="1" fill="#1C1A22" opacity=".4"/>`,
  hash: `<rect x="4" y="4" width="24" height="24" rx="7" fill="#DCDDFB"/><path d="M13 9l-2 14M21 9l-2 14M9.5 13.5h14M8.5 18.5h14" stroke="#1C1A22" stroke-width="2.2" stroke-linecap="round"/><circle cx="23" cy="9" r="3" fill="#FF782E"/>`,
  pin: `<path d="M16 29.5s-9.5-8.4-9.5-15.6a9.5 9.5 0 0 1 19 0c0 7.2-9.5 15.6-9.5 15.6z" fill="#DCDDFB"/><circle cx="16" cy="14" r="4.4" fill="#FF782E"/><circle cx="16" cy="14" r="1.6" fill="#1C1A22"/>`,
  venn: `<circle cx="12" cy="16" r="8.5" fill="#DCDDFB"/><circle cx="20" cy="16" r="8.5" fill="#FF782E" opacity=".92"/><path d="M16 8.6a8.5 8.5 0 0 1 0 14.8 8.5 8.5 0 0 1 0-14.8z" fill="#1C1A22"/>`
};
const MARK = (bolt = "#111", ring = "url(#gA)", arrow = "#7B83F6") => `<svg viewBox="38 41 122 122" style="width:100%;height:100%;display:block;overflow:visible"><path d="M122.4 66.9A44 44 0 1 1 81.4 65.1" fill="none" stroke="${ring}" stroke-width="17"/><path d="M66.5 47.5L101 52.5L80.5 80Z" fill="${arrow}" stroke="${arrow}" stroke-width="3" stroke-linejoin="round"/><path d="M109 76L84 111H99L91 136L118 99H103Z" fill="${bolt}" stroke="${bolt}" stroke-width="3" stroke-linejoin="round"/></svg>`;
const CUR = `<svg viewBox="0 0 24 24"><path d="M4 2.5l15.5 8.6-7 1.7-3.6 6.7z" fill="#1C1A22" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const AVC = { MD: "#E58A6B", SM: "#B98AE0", KB: "#6FA8DC", JB: "#E0789A", LM: "#8FB873", IN: "#E8A94D", CL: "#7B83F6", AR: "#D9776A", NP: "#5FB5A8", EB: "#C98BB9" };
const av = (ini, s = 22) => `<div class="av" style="width:${s}px;height:${s}px;font-size:${s * .4}px;background:linear-gradient(140deg,${AVC[ini] || "#7B83F6"},${AVC[ini] || "#7B83F6"}cc)">${ini}</div>`;

/* ---------- verre liquide : carte de réfraction générée, puis feDisplacementMap ---------- */
let FID = 0;
function glassFilter(w, h, r, band, scale) {
  const S = 2, W = Math.round(w * S), H = Math.round(h * S), c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d"), d = x.createImageData(W, H), hw = w / 2, hh = h / 2;
  const sdf = (px, py) => { const qx = Math.abs(px - hw) - (hw - r), qy = Math.abs(py - hh) - (hh - r); return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r; };
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const px = (i + .5) / S, py = (j + .5) / S, e = -sdf(px, py), p = (j * W + i) * 4;
    let R = 128, G = 128;
    if (e > -2 && e < band) {
      let gx = sdf(px + .5, py) - sdf(px - .5, py), gy = sdf(px, py + .5) - sdf(px, py - .5); const n = Math.hypot(gx, gy) || 1; gx /= n; gy /= n;
      const u = cl(1 - e / band), s = u * u * (3 - 2 * u);
      R = 128 + gx * s * 127; G = 128 + gy * s * 127;
    }
    d.data[p] = R; d.data[p + 1] = G; d.data[p + 2] = 128; d.data[p + 3] = 255;
  }
  x.putImageData(d, 0, 0);
  const id = "lg" + (FID++);
  const f = document.createElementNS("http://www.w3.org/2000/svg", "filter");
  f.setAttribute("id", id);
  f.innerHTML = `<feImage href="${c.toDataURL()}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none" result="m"/><feDisplacementMap in="SourceGraphic" in2="m" scale="${scale}" xChannelSelector="R" yChannelSelector="G"/>`;
  for (const [a, v] of [["x", -60], ["y", -60], ["width", w + 120], ["height", h + 120], ["filterUnits", "userSpaceOnUse"], ["primitiveUnits", "userSpaceOnUse"], ["color-interpolation-filters", "sRGB"]]) f.setAttribute(a, v);
  document.getElementById("defs").appendChild(f);
  return id;
}
/* Un objet en verre : il contient une copie du fond de sa scène, réfractée sur les bords. */
function Glass(sc, o) {
  const w = o.w, hh = o.h, r = o.r ?? Math.min(w, hh) / 2;
  const id = glassFilter(w, hh, r, o.band ?? Math.min(26, Math.min(w, hh) * .32), o.scale ?? 34);
  const el = h(`<div class="gl" style="width:${w}px;height:${hh}px;border-radius:${r}px;box-shadow:0 ${o.sh ?? 14}px ${(o.sh ?? 14) * 2.4}px -${(o.sh ?? 14) * .9}px rgba(40,30,60,${o.so ?? .28})"></div>`);
  const gi = h(`<div class="gi" style="filter:url(#${id}) blur(${o.blur ?? .35}px) saturate(${o.sat ?? 1.45}) brightness(${o.br ?? 1.05})"></div>`);
  el.appendChild(gi);
  const gb = sc.bk.cloneNode(true); gb.className = "gb"; gi.appendChild(gb); sc.roots.push(gb);
  el.appendChild(h(`<div class="gt2" style="background:${o.tint || "linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.06))"}"></div>`));
  el.appendChild(h(`<div class="spec" style="left:${w * .08}px;top:${-hh * .25}px;width:${w * .7}px;height:${hh * .6}px;opacity:${o.spec ?? .55}"></div>`));
  el.appendChild(h(`<div class="rim"></div>`));
  const ct = h(`<div class="ct">${o.html || ""}</div>`); el.appendChild(ct);
  (o.parent || sc.fr).appendChild(el);
  const g = { el, gb, ct, w, h: hh, set(cx, cy, s = 1, rot = 0, op = 1) {
    el.style.transform = `translate(${cx - w / 2}px,${cy - hh / 2}px) rotate(${rot}deg) scale(${s})`; el.style.opacity = op;
    el.style.visibility = op <= .001 || s <= .001 ? "hidden" : "visible";
    gb.style.transform = `translate(${w / 2}px,${hh / 2}px) rotate(${-rot}deg) scale(${1 / Math.max(s, .001)}) translate(${-cx}px,${-cy}px)`;
  } };
  return g;
}

/* ---------- scènes ---------- */
const SC = [];
function Scene(a, b, bg, back, init, upd, bku) {
  const el = h(`<div class="sc" style="background:${bg}"><div class="cam"><div class="bk" style="background:${bg}">${back || ""}</div><div class="fr"></div></div></div>`);
  R.appendChild(el);
  const sc = { a, b, el, cam: el.firstChild, bk: el.querySelector(".bk"), fr: el.querySelector(".fr"), roots: [], upd, bku };
  sc.roots.push(sc.bk); init && init(sc); SC.push(sc); return sc;
}
const Q = (sc, sel) => sc.roots.map(r => r.querySelector(sel));         // un même élément du fond, dans le fond et dans chaque copie
const QA = (sc, sel) => sc.roots.flatMap(r => [...r.querySelectorAll(sel)]);
const camSet = (sc, s, x = 0, y = 0, r = 0, extra = "") => sc.cam.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s}) ${extra}`;
const words = (str, cls = "") => str.split(" ").map(w => `<span class="w ${cls}">${w}</span>`).join(" ");
const wordsIn = (els, t, t0, step = .07, dur = .45, dy = 16) => els.forEach((e, i) => { const x = eo5(k(t, t0 + i * step, t0 + i * step + dur)); e.style.transform = `translateY(${(1 - x) * dy}px)`; e.style.opacity = x; e.style.filter = `blur(${(1 - x) * 6}px)`; });
const fade = (el, o) => { el.style.opacity = o; el.style.visibility = o > .001 ? "visible" : "hidden"; };

/* ===== 1 · 0–3 s : formes en verre en orbite + titre ===== */
const s1 = Scene(0, 3.05, "#F4EFE8",
  `<div class="ab band" style="left:390px;top:-60px;width:180px;height:660px;background:linear-gradient(180deg,#F59A4A,#DB6578 50%,#7C7CF2);opacity:.9"></div>
   <div class="ab ttl H" style="left:0;top:180px;width:960px;text-align:center;font-size:66px">${words("Fini les relances")}<br>${words("au hasard.")}</div>`,
  sc => {
    sc.shapes = [
      { w: 92, h: 92, tint: "radial-gradient(circle at 35% 30%,rgba(160,165,255,.55),rgba(124,124,242,.85) 70%)", a: 0, rx: 330, ry: 150, z: 1.0, sp: .55 },
      { w: 64, h: 64, tint: "radial-gradient(circle at 35% 30%,rgba(255,200,160,.5),rgba(245,154,74,.85) 70%)", a: 1.1, rx: 360, ry: 170, z: .8, sp: .55 },
      { w: 110, h: 110, r: 26, tint: "linear-gradient(140deg,rgba(255,190,200,.55),rgba(219,101,120,.7))", a: 2.2, rx: 300, ry: 140, z: 1.15, sp: .55, rot: 1 },
      { w: 74, h: 74, tint: "radial-gradient(circle at 35% 30%,rgba(255,255,255,.3),rgba(123,131,246,.6) 75%)", a: 3.3, rx: 340, ry: 160, z: .7, sp: .55 },
      { w: 84, h: 84, r: 20, tint: "linear-gradient(140deg,rgba(255,214,170,.6),rgba(245,154,74,.65))", a: 4.3, rx: 320, ry: 150, z: .9, sp: .55, rot: 1 },
      { w: 130, h: 130, tint: "radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),rgba(255,255,255,.04) 70%)", a: 5.3, rx: 250, ry: 120, z: 1.3, sp: .55 },
    ].map(o => Object.assign(Glass(sc, { ...o, scale: 40, spec: .7 }), o));
    sc.navy = h(`<div class="ab" style="left:380px;top:170px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#22336A,#08152E 70%);z-index:9;opacity:0"></div>`); sc.el.appendChild(sc.navy);
  },
  (sc, t) => {
    const rv = eio(k(t, 0, 1.5));                       // suspense : on part de très près, flou, puis on recule
    camSet(sc, L(2.4, 1, rv) * (1 + t * .03) * (1 + ei(k(t, 2.5, 3.05)) * .25));
    sc.cam.style.filter = `blur(${(1 - eo(k(t, 0, 1.3))) * 14}px)`;
    const nv = ei(k(t, 2.35, 3.05)); sc.navy.style.transform = `scale(${nv * 9})`; sc.navy.style.opacity = nv > 0 ? 1 : 0;
    sc.shapes.forEach((g, i) => {
      const a = g.a + t * g.sp, z = Math.sin(a), d = .78 + z * .3 * g.z;
      const x = 480 + Math.cos(a) * g.rx, y = 270 + z * g.ry * .55 + Math.sin(t * 1.3 + i) * 8;
      const sIn = spr(k(t, .05 + i * .07, .9 + i * .07));
      g.set(x, y, d * sIn, g.rot ? t * 22 + i * 30 : 0, 1);
      g.el.style.zIndex = z > 0 ? 5 : 1;
    });
  },
  (sc, t) => {
    QA(sc, ".band").forEach(b => b.style.transform = `translateX(${Math.sin(t * .9) * 30}px) skewX(${-8 + t * 2}deg) scaleY(${eo(k(t, 0, .7))})`);
    for (const r of sc.roots) wordsIn([...r.querySelectorAll(".w")], t, .75, .16, .6, 22);
  });

/* ===== 2 · 3–4,6 s : on traverse l'orbe → disque du logo ===== */
const s2 = Scene(3.05, 4.6, "#F4EFE8", "",
  sc => {
    sc.disc = h(`<div class="ab" style="width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#22336A,#08152E 70%);box-shadow:0 30px 60px -25px rgba(8,21,46,.6)"></div>`); sc.fr.appendChild(sc.disc);
    sc.logo = h(`<div class="ab" style="width:120px;height:120px">${MARK("#FFFFFF")}</div>`); sc.fr.appendChild(sc.logo);
    sc.bits = [0, 1, 2, 3].map(i => Glass(sc, { w: 60 + i * 14, h: 60 + i * 14, r: i % 2 ? 16 : undefined, tint: ["rgba(245,154,74,.6)", "rgba(219,101,120,.55)", "rgba(124,124,242,.6)", "rgba(255,255,255,.2)"][i], scale: 30 }));
  },
  (sc, t) => {
    const g = eo5(k(t, 0, .55)), s = L(9, 1, g) * (1 + .05 * Math.sin(t * 3));

      e.style.transform = `translateY(${(1 - inn) * 90 - out * 90}px)`; e.style.opacity = t < a ? 0 : 1 - out;
      e.style.filter = `blur(${((1 - inn) + out) * 6}px)`;
    });
    // le dernier mot reste : léger rebond
    const lst = sc.mots[MOTS.length - 1], la = T0 + (MOTS.length - 1) * D;
    if (t > la + .16) lst.style.transform = `scale(${1 + .05 * Math.exp(-(t - la - .16) * 6) * Math.sin((t - la) * 18)})`;
    lst.style.transformOrigin = "50% 50%";
  },
  (sc, t) => { for (const r of sc.roots) { const e = r.querySelector(".tag"), x = eo5(k(t, 3.0, 3.5)); e.style.opacity = x; e.style.transform = `translateY(${(1 - x) * 12}px)`; } });

/* ---------- rendu ---------- */
/* Transitions « fouettées » entre les scènes : on accélère en sortie, on freine en entrée (rythme Glean) */
const WHIP = { 9.0: [-1, 0], 16.5: [1, 0], 20.4: [0, -1], 23.0: [0, 1], 24.6: [-1, 0], 30.0: [1, 0], 35.0: [0, -1], 39.0: [-1, 0], 42.5: [1, 0], 45.5: [0, 1], 49.0: [-1, 0], 52.5: [0, 0] };
const PAN = p => { const x = cl(p); return x < .5 ? 8 * x ** 4 : 1 - 8 * (1 - x) ** 4; };   // départ et arrivée très rapides
function whip(sc, t) {
  let x = 0, y = 0, s = 1, b = 0, o = 1;
  const kb = +sc.b.toFixed(1), ka = +sc.a.toFixed(1), out = WHIP[kb], inn = WHIP[ka];
  if (out && t >= kb - .14) { const p = PAN(k(t, kb - .14, kb + .26)); if (out[0] || out[1]) { x = -out[0] * 960 * p; y = -out[1] * 540 * p; } else { s = 1 + p * 1.2; o = 1 - p; } b = Math.sin(p * Math.PI) * 9; }
  if (inn && t < ka + .26) { const p = PAN(k(t, ka - .14, ka + .26)); if (inn[0] || inn[1]) { x = inn[0] * 960 * (1 - p); y = inn[1] * 540 * (1 - p); } else { s = L(.85, 1, p); } b = Math.sin(p * Math.PI) * 9; }
  sc.el.style.transform = `translate(${x}px,${y}px) scale(${s})`; sc.el.style.opacity = o;
  sc.el.style.filter = b > .3 ? `blur(${b}px)` : "none";
}
function render(t) {
  for (const sc of SC) {
    const on = t >= sc.a && t < sc.b + (WHIP[+sc.b.toFixed(1)] ? .26 : 0);
    sc.el.style.display = on ? "block" : "none";
    if (!on) continue;
    const lt = t - sc.a;
    sc.bku && sc.bku(sc, lt);
    sc.upd && sc.upd(sc, lt);
    whip(sc, t);
  }
}
window.render = render; window.warp = t => t;
fetch("../logo.svg").then(r => r.text()).then(s => {
  const w = s.replace(/<g class="rmark">[\s\S]*?<\/g>/, "").replace(/class="logo-svg" viewBox="10 40 620 125" style="[^"]*"/, 'viewBox="205 55 425 105" style="width:100%;height:100%"').replace(/fill="#111111"/g, 'fill="#1C1A22"');
  /* le logo-mot n'est plus utilisé dans la fin */
}).then(() => document.fonts.ready).then(() => new Promise(r => setTimeout(r, 400))).then(() => { render(0); window.__ready = true; });
