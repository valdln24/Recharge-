<!doctype html>

<style>
/* Film de lancement Recharge, environ 60 s. Tout est en HTML/SVG/CSS : chaque carte, bulle, icône et texte est un élément séparé.

   Format vertical 1080×1920 : PAGE="film-recharge.html?v=1" DUR=60 FPS=30 W=540 H=960 node render.js film-9x16.mp4
   Les textes, prénoms, couleurs et durées se changent dans CFG et T, en haut du script. */
:root{--o:#F59A4A;--p:#DB6578;--v:#7C7CF2;--acc:#7B83F6;--n1:#08152E;--n2:#0B0A10;--peach:#F4EFE8;--rose:#FDE8EA;--card:#FCFBF9;--ink:#1C1A22;--ink2:#57515C;

*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:var(--n2);font-family:Manrope,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#st{position:absolute;left:0;top:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,var(--n1),var(--n2) 70%)}
#c{position:absolute;left:50%;top:50%;width:0;height:0;perspective:1400px}
.ab{position:absolute;left:0;top:0;visibility:hidden;will-change:transform,opacity}
#grain{position:absolute;inset:-50%;background-size:180px 180px;opacity:.12;mix-blend-mode:screen;pointer-events:none}

.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* verre liquide */
.glass{background:linear-gradient(155deg,rgba(255,255,255,.22),rgba(255,255,255,.06) 50%,rgba(255,255,255,.12));

.bub{position:absolute;border-radius:50%;width:20px;height:20px;margin:-10px 0 0 -10px}

.card{position:absolute;width:330px;height:76px;margin:-38px 0 0 -165px;border-radius:22px;background:var(--card);color:var(--ink);display:flex;align-items:center;gap:12px;padding:0 14px;

.box{position:absolute;width:420px;margin-left:-210px;border-radius:24px;padding:16px 18px;color:#fff}

/* ======================= RENDU ======================= */
function render(t) {
  document.querySelectorAll(".glass").forEach(g => g.style.setProperty("--sx", (20 + ((t * 18) % 80)) + "%"));
  // grain de l'acte 1, qui disparaît quand l'appli s'allume
  const g = 1 - k(t, 15.0, 15.8);
  S($("grain"), { opacity: .13 * g, transform: `translate(${(rnd(Math.floor(t * 30)) * 180) | 0}px,${(rnd(Math.floor(t * 30) + 7) * 180) | 0}px)` });

  /* ---- 0–2,5 s et 58,5–60 s : l'arc ---- */
  const arcOn = t < T.coupes || t > 58.4; vis($("arc"), arcOn);
  if (arcOn) {
    const a = t < T.coupes ? eo(k(t, .3, 2.2)) : eo(k(t, 58.5, 59.6));
    const y = t < T.coupes ? lerp(120, 0, eo(k(t, 0, 2.5))) : 0;
    const scl = V ? .62 : 1;
    S($("arc"), { opacity: a * (t < T.coupes ? 1 - k(t, 2.3, 2.5) : 1), transform: `translateY(${y + (V ? -80 : 0)}px) scale(${scl})` });
    $("dawn").setAttribute("opacity", a * (.7 + .3 * Math.sin(t * 2)));
  }

  /* ---- 2,5–8 s : coupes rapides, un élément par plan ---- */
  const CUT = [2.5, 3.35, 4.2, 5.0, 5.9, 6.95, 8.0];
  for (let i = 0; i < 6; i++) {
    const a = CUT[i], b = CUT[i + 1], on = t >= a && t < b, el = $("sh" + (i + 1)); vis(el, on);
    if (!on) continue; const u = k(t, a, b);
    el.style.transform = `scale(${lerp(1, 1.08, u)})`;
    if (i === 0) { S($("hand"), { transform: `translate(${lerp(30, -10, u)}px,${lerp(20, 0, u)}px) rotate(${lerp(4, -2, u)}deg) scale(${V ? 1.05 : .95})` }); S($("sh1bg"), { transform: `translate(${lerp(80, 40, u)}px,-40px) scale(${lerp(.9, 1.1, u)})` }); }
    if (i === 1) {
      const yy = lerp(-200, 60, eo(u)), str = 1 + Math.sin(u * 9) * .18 * (1 - u), pts = [];
      for (let j = 0; j <= 48; j++) { const th = j / 48 * Math.PI * 2, r = 110 + Math.sin(th * 3 + u * 8) * 9 * (1 - u * .5) + Math.sin(th * 5 - u * 11) * 5; pts.push([Math.cos(th) * r / str, Math.sin(th) * r * str - (Math.sin(th) < 0 ? 26 * Math.pow(-Math.sin(th), 6) : 0)]); }
      const d = "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L") + "Z";
      $("drop").setAttribute("d", d); $("dropRim").setAttribute("d", d);
      $("dropG").setAttribute("transform", `translate(0 ${yy}) rotate(${u * 25})`); $("dropHi").setAttribute("cx", -38); $("dropHi").setAttribute("cy", -52);
    }
    if (i === 2) { const dr = eo(k(t, a, a + .5)), off = k(t, b - .18, b - .05); ["bolt3", "bolt3g"].forEach(id => S($(id), { strokeDasharray: `${dr} 1`, opacity: (1 - off) * (.75 + .25 * Math.sin(t * 90)) })); }
    if (i === 3) { $("gauge4").setAttribute("stroke-dasharray", `${lerp(.18, .72, eio(u))} 1`); el.style.filter = `blur(${lerp(14, 4, u)}px)`; }
    if (i === 4) CFG.fragments.forEach((f, j) => S($("fr" + j), { transform: `translate(${[-560, -300, -120][j] + u * [700, -380, 520][j] * (j === 1 ? -1 : 1)}px,${[-160, 40, 170][j]}px)`, filter: `blur(${[9, 2.5, 6][j]}px)`, opacity: [.5, .95, .7][j] }));
    if (i === 5) {
      const inf = eo(k(t, a, a + .75)), pop = k(t, a + .75, b);
      S($("gbub"), { transform: `scale(${lerp(.2, 1.15, inf) * (1 + Math.sin(t * 30) * .01)})`, opacity: pop > 0 ? 0 : 1 });
      for (let j = 0; j < 16; j++) { const ang = j / 16 * Math.PI * 2 + rnd(j) * .4, d = eo(pop) * (170 + rnd(j + 3) * 260); S($("dr" + j), { transform: `translate(${Math.cos(ang) * d}px,${Math.sin(ang) * d + pop * pop * 120}px)`, opacity: pop > 0 ? 1 - pop * .7 : 0 }); }
    }
  }

  /* ---- 8–12 s : les grands mots ---- */
  [["w1", 8.0, 9.85], ["w2", 9.85, 11.85]].forEach(([id, a, b], j) => {
    const on = t >= a - .02 && t < b + .1, e = $(id); vis(e, on); if (!on) return;
    const ap = eo(k(t, a, a + .5)), out = k(t, b - .15, b + .1), fill = eio(k(t, a + .1, b - .3));
    S(e, { opacity: ap * (1 - out), filter: `blur(${(1 - ap) * 24}px)`, transform: `translate(-50%,-50%) scale(${lerp(1.12, 1, ap) + out * .15}) scaleX(${lerp(1.25, 1, ap)})` });
    const m = `linear-gradient(100deg,#000 ${fill * 120 - 20}%,rgba(0,0,0,0) ${fill * 120}%)`;
    S(e.querySelector(".fl"), { webkitMaskImage: m, maskImage: m, backgroundPosition: `${t * 40}% 0`, backgroundSize: "200% 100%" });
  });
  // une lettre se brise en bulles, puis les bulles dessinent le téléphone
  const bOn = t > 11.2 && t < 13.6; vis($("bubs"), bOn);
  const PH = L.phone, phW = 232 * L.phS, phH = 476 * L.phS;
  for (let i = 0; i < 28; i++) {
    const e = $("bb" + i); vis(e, bOn); if (!bOn) continue;
    const sx = (V ? 150 : 330) + rnd(i) * 40 - 20, sy = (V ? 0 : 20) + rnd(i + 9) * 30;
    const rise = eo(k(t, 11.2 + rnd(i) * .3, 12.3)), rx = sx + (rnd(i + 4) - .5) * 260 * rise, ry = sy - rise * (120 + rnd(i + 2) * 160);
    const per = i / 28, side = per * 2 * (phW + phH);   // point sur le contour du téléphone
    let px, py; const s1 = side;
    if (s1 < phW) { px = -phW / 2 + s1; py = -phH / 2; } else if (s1 < phW + phH) { px = phW / 2; py = -phH / 2 + (s1 - phW); } else if (s1 < 2 * phW + phH) { px = phW / 2 - (s1 - phW - phH); py = phH / 2; } else { px = -phW / 2; py = phH / 2 - (s1 - 2 * phW - phH); }
    const cv = eio(k(t, 12.0 + rnd(i + 1) * .3, 13.0 + rnd(i + 1) * .2));
    S(e, { transform: `translate(${lerp(rx, PH[0] + px, cv)}px,${lerp(ry, PH[1] + py, cv)}px) scale(${1 - k(t, 13.0, 13.5) * .8})`, opacity: k(t, 11.2, 11.35) * (1 - k(t, 13.1, 13.55)) });
  }

  /* ---- le téléphone ---- */
  const phOn = (t > 12.6 && t < 30.2) || (t > 38 && t < 42.2) || (t > 48.1 && t < 50.1) || (t > 50 && t < 54.9);
  vis($("ph"), phOn);
  if (phOn) {
    let x = PH[0], y = PH[1], s = L.phS, ry = -25, rx = 0, o = 1;
    const draw = eio(k(t, 12.6, 14.6));
    if (t < 15.2) { ry = -25; }
    else ry = lerp(-25, 0, spr(k(t, 15.0, 16.4)));
    if (!V) x = lerp(x, -140, eio(k(t, 15.7, 16.3)));
    // passage sur le côté pendant le tri (paysage) ; en retrait (vertical)
    const side = eio(k(t, 18.9, 19.6)) * (1 - eio(k(t, 24.3, 24.9)));
    x = lerp(x, L.phoneSide[0], side); y = lerp(y, L.phoneSide[1], side); if (V) s = lerp(s, .8, side);
    if (t > 24.9 && t < 30.3) { const z = ex(k(t, 25.0, 25.5)); o = 1 - k(t, 25.15, 25.5); s *= lerp(1, 1.6, z); }
    if (t > 38) { const a = spr(k(t, 38.0, 38.9)); y = lerp(PH[1] + 500, PH[1], a); ry = lerp(25, 0, a); o = 1 - k(t, 41.8, 42.2); if (!V) x = -170; }
    if (t > 48 && t < 50.1) { const a = spr(k(t, 48.1, 48.7)); s = L.phS * .78 * a; x = V ? 0 : 200; y = V ? 230 : 40; ry = -14; o = 1 - k(t, 49.75, 50.05); }
    if (t > 50) { const a = spr(k(t, 50.0, 50.8)); x = L.resPhone[0]; y = lerp(L.resPhone[1] + 500, L.resPhone[1], a) + Math.sin(t * 1.4) * 5; s = L.phS * (V ? .82 : .9); ry = 14; o = 1 - k(t, 54.2, 54.8); }
    S($("ph"), { transform: `translate(${x}px,${y}px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${s})`, opacity: o });
    const lit = k(t, 15.0, 15.25);
    S($("phOn"), { opacity: t < 15 ? 0 : lit, filter: `brightness(${1 + (1 - k(t, 15.1, 15.8)) * .5})` });
    S($("ph").querySelector(".rim"), { opacity: t < 15 ? draw : .9 });
    S($("ph").querySelector(".rim"), { webkitMaskImage: t < 15 ? `linear-gradient(#000 0 0) content-box,conic-gradient(#000 ${draw * 360}deg,transparent 0)` : "" });
    S($("phGlow"), { opacity: t < 15 ? 0 : lit * .9 });
    $("ph").style.background = t < 14.6 ? `rgba(14,13,18,${k(t, 13.6, 14.6)})` : "";
    // écran d'accueil ↔ conversation de suivi
    vis($("pHome"), !(t > 38 && t < 42.2)); vis($("pChat"), t > 38 && t < 42.2);
    // plan : 30 min → 1 h
    const ch = k(t, 17.5, 18.1), hv = ch < .5 ? CFG.heroAvant : CFG.heroApres;
    $("hTxt").textContent = hv.txt; $("hLbl").textContent = hv.lbl; $("hNum").textContent = Math.round(lerp(CFG.heroAvant.n, CFG.heroApres.n, ch)); $("planN").textContent = $("hNum").textContent;
    $("hRing").setAttribute("stroke-dasharray", `${lerp(.3, .62, eo(ch))} 1`); $("hBar").style.width = lerp(30, 64, eo(k(t, 17.6, 18.4))) + "%";
    document.querySelectorAll("#inPills span").forEach((p, i) => p.className = (ch > .1 ? i === CFG.choix : i === 1) ? "on" : "");
    S($("chBub"), { opacity: k(t, 38.6, 38.9), transform: `translateY(${(1 - spr(k(t, 38.6, 39.2))) * 20}px)` });
  }

  /* ---- 15–19 s : choix du temps ---- */
  for (let i = 0; i < 5; i++) {
    const e = $("pl" + i), on = t > 15.9 && t < 19.1; vis(e, on); if (!on) continue;
    const a = spr(k(t, 15.95 + i * .07, 16.6 + i * .07)), out = ei(k(t, 18.5, 18.95));
    const gap = V ? 98 : 112, xx = (i - 2) * gap, yy = (V ? 300 : 175) + (V && i > 2 ? 0 : 0);
    const xr = V ? (i < 3 ? (i - 1) * 110 : (i - 3.5) * 110) : 190, yr = V ? (i < 3 ? 330 : 400) : -120 + i * 62;
    const pick = i === CFG.choix ? k(t, 17.32, 17.55) : 0;
    S(e, { transform: `translate(${lerp(V ? 0 : -60, xr, a)}px,${lerp(L.phone[1], yr, a) - out * 40}px) translateZ(${a * 120}px) rotateX(${(1 - a) * 50}deg) scale(${(i === CFG.choix ? 1 + Math.sin(pick * Math.PI) * -.08 : 1) * (1 - out * .3)})`, opacity: k(t, 15.95 + i * .07, 16.15 + i * .07) * (1 - out) });

  vis($("cur"), cOn);
  let rOn = false;
  CUR.forEach(([a, tap, b, [tx, ty]]) => { const r = k(t, tap, tap + .55); if (r > 0 && r < 1) { rOn = true; S($("rip"), { transform: `translate(${tx}px,${ty}px) scale(${lerp(.4, 3.2, eo(r))})`, opacity: 1 - r }); } });

  /* ---- 19–25 s : les cartes jaillissent et se trient ---- */
  const SH = [3, 0, 4, 1, 2];  // ordre mélangé au départ
  for (let i = 0; i < 5; i++) {

    const out = spr(k(t, 19.25 + i * .08, 20.1 + i * .08)), sort = spr(k(t, 20.9 + i * .1, 22.0 + i * .1)), back = eio(k(t, 24.25, 24.9));
