  --shadow:0 1px 2px rgba(16,19,18,.04),0 12px 32px -16px rgba(16,19,18,.16);
  --badge:0px; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:15.5px/1.45 "Manrope",ui-sans-serif,system-ui,-apple-system,sans-serif;font-weight:500;
  -webkit-font-smoothing:antialiased;min-height:100vh;font-variant-numeric:tabular-nums;
  background:radial-gradient(90% 45% at 12% -8%,var(--glow),transparent 65%) no-repeat,radial-gradient(90% 45% at 92% -4%,var(--glowB),transparent 65%) no-repeat,var(--bg);
  padding-bottom:calc(124px + var(--badge) + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--b1);outline-offset:2px}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.small{font-size:.78rem;color:var(--ink-3);font-weight:600}

/* ---------- Barre du haut ---------- */
.topbar{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3)}
.demo .topbar{padding-top:44px}
.topbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:1.12rem;letter-spacing:-.03em}
.brand svg{width:32px;height:32px;display:block;filter:drop-shadow(0 4px 10px rgba(255,94,31,.35))}
.pill{font-size:.8rem;font-weight:650;padding:7px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
main{max-width:560px;margin:0 auto;padding:6px 16px 24px}
.title{font-size:1.9rem;font-weight:750;letter-spacing:-.045em;margin:12px 0 2px;line-height:1.1}
.lede{color:var(--ink-2);margin:4px 0 6px;font-size:.95rem}
.section{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 10px}
.section h2{margin:0;font-size:1.02rem;font-weight:700;letter-spacing:-.02em}
.section .pill{padding:5px 10px;font-size:.74rem}

/* ---------- Jauge en segments (signature) ---------- */
.dial{position:relative;max-width:300px;margin:0 auto}
.dial svg{display:block;width:100%;height:auto}
.dial .c{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.dial .big{font-size:3.6rem;font-weight:650;letter-spacing:-.06em;line-height:1}
.dial .big sup{font-size:1.2rem;font-weight:600;vertical-align:1.6rem;margin-left:2px;letter-spacing:0}
.dial .lbl{font-size:.92rem;font-weight:650;margin-top:4px;color:var(--ink-2)}

/* ---------- Accueil ---------- */
.hero{--seg-off:rgba(255,255,255,.09);--line:rgba(255,255,255,.1);--ink-2:#c4c8c6;--ink-3:#8d9290;color:#fff;
  background:radial-gradient(70% 60% at 0% 0%,rgba(255,106,42,.38),transparent 70%),radial-gradient(70% 60% at 100% 0%,rgba(95,123,255,.34),transparent 70%),#101312;
  border-radius:28px;box-shadow:0 20px 44px -22px rgba(16,19,18,.65);padding:22px 18px 0;margin-top:8px;text-align:center;overflow:hidden}
.hero .sub{font-size:.82rem;color:var(--ink-3);font-weight:600;margin-top:6px}
.hero .calm{font-size:1.5rem;font-weight:700;letter-spacing:-.035em;line-height:1.15;padding:6px 10px 0}
.duo{display:grid;grid-template-columns:1fr 1fr;margin:18px -18px 0;border-top:1px solid var(--line)}
.duo div{padding:13px 18px 15px;text-align:left}
.duo div+div{border-left:1px solid var(--line)}
.duo b{display:block;font-size:1.25rem;font-weight:700;letter-spacing:-.035em;margin-top:2px}
.notice{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:12px;padding:10px 10px 10px 14px;
  border-radius:18px;background:var(--b-soft);font-size:.86rem;color:var(--ink-2)}
.notice.warn{background:var(--late-soft);color:var(--late)}

/* ---------- Cartes client ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);margin-top:12px}
.rcard{padding:16px}
.rhead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{position:relative;width:60px;height:60px;flex:none}
.ring svg{width:60px;height:60px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .v b{font-size:1.15rem;font-weight:700;letter-spacing:-.04em}
.ring .v small{font-size:.56rem;font-weight:700;color:var(--ink-3);margin-top:2px}
.who{min-width:0}
.name{background:none;border:0;padding:0;font-size:1.1rem;font-weight:750;letter-spacing:-.025em;text-align:left;color:var(--ink)}
.status{font-size:.84rem;font-weight:700;margin-top:1px}
.status.late{color:var(--late)} .status.soon{color:var(--o-text)} .status.ok{color:var(--b-text)}
.meta2{font-size:.84rem;color:var(--ink-3);font-weight:550;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:.62rem;font-weight:750;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--ink-3);vertical-align:2px;margin-left:6px;letter-spacing:.02em}
.track{display:flex;justify-content:space-between;font-size:.74rem;color:var(--ink-3);font-weight:600;margin-top:14px}
.line{height:6px;border-radius:9px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.line span{display:block;height:100%;border-radius:9px;background:var(--grad)}
.line.late span{background:linear-gradient(90deg,#ff8a6b,var(--late))}

.bubble{margin-top:14px;background:var(--surface-2);border-radius:20px 20px 20px 6px;padding:11px 14px 4px}
.bubble .top{display:flex;justify-content:space-between;align-items:center}
.bubble textarea{display:block;width:100%;border:0;background:transparent;resize:none;overflow:hidden;padding:6px 0 10px;min-height:60px;font-size:.94rem;line-height:1.5;color:var(--ink);font-weight:500}
.bubble textarea:focus{outline:none}
.vary{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 10px;color:var(--b-text);font-weight:700;font-size:.74rem;display:flex;gap:5px;align-items:center}
.vary svg{width:13px;height:13px}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border-radius:99px;border:0;
  font-weight:700;font-size:1rem;letter-spacing:-.015em;text-decoration:none;padding:0 20px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn.orange{background:var(--grad);color:#fff;box-shadow:0 10px 24px -10px rgba(255,94,31,.7)}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn.outline{background:transparent;border:1px solid var(--line-2);color:var(--ink)}
.btn.danger{background:var(--late-soft);color:var(--late)}
.btn.sm{min-height:38px;font-size:.84rem;width:auto;padding:0 14px;white-space:nowrap}
.send{margin-top:12px}
.alt{text-align:center;font-size:.8rem;color:var(--ink-3);margin-top:8px;font-weight:550}
.alt button{background:none;border:0;padding:2px;color:var(--b-text);font-weight:700;font-size:.8rem}

.acts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px}
.acts button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:.78rem;font-weight:700;color:var(--ink);padding:2px}
.acts .ic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:var(--btn-ink);transition:transform .1s}
.acts button:active .ic{transform:scale(.92)}
.acts .ic svg{width:21px;height:21px}
.acts .reco .ic{background:var(--grad);color:#fff;box-shadow:0 8px 20px -8px rgba(255,94,31,.75)}
.acts .later .ic{background:var(--gradB);color:#fff;box-shadow:0 8px 20px -8px rgba(79,108,247,.7)}

.list .row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px}
.list .row+.row{border-top:1px solid var(--line)}
.row .btns{display:flex;gap:6px;flex:none}
.x{width:38px;height:38px;border:0;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;flex:none}
.x svg{width:14px;height:14px}
.empty{text-align:center;color:var(--ink-3);padding:26px 16px;font-size:.92rem;font-weight:550}
.empty b{color:var(--ink)}

/* ---------- Clients ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:0 18px;margin-top:14px;box-shadow:var(--shadow)}
.search svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.search input{flex:1;min-height:52px;border:0;background:transparent;font-size:1rem;font-weight:550}
.search input:focus{outline:none}
.crow{display:flex;width:100%;align-items:center;gap:12px;background:none;border:0;padding:12px 16px;text-align:left}
.crow+.crow{border-top:1px solid var(--line)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--o-soft);color:var(--o-text);display:grid;place-items:center;font-weight:750;font-size:.9rem;flex:none}
.crow .grow{flex:1;min-width:0}
.crow b{font-weight:700;letter-spacing:-.015em}
.chip{flex:none;font-size:.74rem;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.chip.late{background:var(--late-soft);color:var(--late)} .chip.soon{background:var(--o-soft);color:var(--o-text)}
.chip.done{background:var(--b-soft);color:var(--b-text)}
.chip.ok{background:var(--b-soft);color:var(--b-text)}
.avatar.blue{background:var(--b-soft);color:var(--b-text)}

/* ---------- Résultats ---------- */
.seg{display:flex;background:var(--surface-2);border-radius:99px;padding:4px;gap:4px;margin-top:14px}
.seg button{flex:1;min-height:40px;border:0;border-radius:99px;background:transparent;font-weight:700;font-size:.88rem;color:var(--ink-2)}
.seg button.on{background:var(--btn);color:var(--btn-ink)}
.kpi{position:relative;overflow:hidden;border-radius:28px;padding:22px;margin-top:12px;color:#fff;background:var(--grad);box-shadow:0 18px 40px -20px rgba(255,94,31,.8)}
.kpi::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.22) 1px,transparent 1.3px);background-size:11px 11px;
  -webkit-mask-image:linear-gradient(110deg,transparent 35%,#000 100%);mask-image:linear-gradient(110deg,transparent 35%,#000 100%)}
.kpi>*{position:relative}
.kpi .lbl{font-size:.88rem;font-weight:700;opacity:.92}
.kpi .val{font-size:3.3rem;font-weight:700;line-height:1.05;margin-top:8px;letter-spacing:-.055em}
.kpi .sub{font-size:.86rem;opacity:.9;margin-top:6px;font-weight:600}
.rate{padding:20px 18px 18px;text-align:center}
.bars{padding:6px 16px 14px}
.bars .b{padding:12px 0}
.bars .b+.b{border-top:1px solid var(--line)}
.bars .t{display:flex;justify-content:space-between;align-items:baseline;font-weight:650;font-size:.92rem}
.bars .t b{font-size:1.2rem;font-weight:700}
.bars .line{margin-top:9px}
.bars .line.blue span{background:var(--gradB)}
.hint{color:var(--ink-3);font-size:.82rem;margin:12px 4px 0;line-height:1.55;font-weight:550}
.hist{list-style:none;padding:0;margin:0}
.hist li{padding:12px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.hist li+li{border-top:1px solid var(--line)}
.hist small{color:var(--ink-3);font-size:.8rem;font-weight:550}

/* ---------- Réglages ---------- */
.pad{padding:16px}
.prodhead,.prodrow{display:grid;grid-template-columns:1fr 58px 72px 38px;gap:6px;align-items:center}
.prodhead{font-size:.72rem;font-weight:700;color:var(--ink-3);margin-bottom:6px}
.prodrow+.prodrow{margin-top:6px}
.prodrow .input{min-height:42px;margin:0;padding:0 10px;font-size:.9rem;border-radius:12px}

/* ---------- Formulaires ---------- */
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:.8rem;font-weight:700;color:var(--ink-2);margin-bottom:7px}
.field>span i{font-style:normal;font-weight:550;color:var(--ink-3)}
.input{display:block;width:100%;min-height:52px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface);padding:0 16px;font-size:1rem;font-weight:550;transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--b1);box-shadow:0 0 0 4px var(--b-soft)}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:10px 14px;font-weight:700;font-size:.88rem;display:flex;gap:6px;align-items:baseline}
.pchip small{color:var(--ink-3);font-weight:650;font-size:.76rem}
.pchip.on{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.pchip.on small{color:inherit;opacity:.65}
.pchip.add{border-style:dashed;color:var(--o-text)}
.stepper{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:99px;overflow:hidden;background:var(--surface);width:max-content}
.stepper button{width:48px;height:50px;border:0;background:transparent;font-size:1.3rem;font-weight:600;color:var(--ink)}
.stepper output{min-width:34px;text-align:center;font-weight:750;font-size:1.1rem}
.two{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:end}
.summary{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--o-soft);border-radius:20px;padding:13px 16px;margin-top:16px}
.summary .small{color:var(--o-text)}
.summary b{display:block;font-size:1.02rem;font-weight:750;letter-spacing:-.02em}
.summary .price{font-weight:750;font-size:1.2rem;letter-spacing:-.03em}
.subform{border:1px dashed var(--line-2);border-radius:20px;padding:2px 14px 14px;margin-top:10px}

/* ---------- Panneau ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,11,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(32px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line-2);margin:4px auto 12px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.shead h3{margin:0;font-size:1.4rem;font-weight:750;letter-spacing:-.04em}
.close{border:0;background:var(--surface-2);color:var(--ink);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.close svg{width:15px;height:15px}

/* ---------- Navigation ---------- */
nav.tabs{position:fixed;left:14px;right:14px;bottom:calc(12px + var(--badge) + env(safe-area-inset-bottom));z-index:30;display:flex;justify-content:center;pointer-events:none}
nav.tabs .in{pointer-events:auto;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;width:100%;max-width:532px;
  background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
  border:1px solid var(--line);border-radius:99px;box-shadow:0 14px 34px -14px rgba(16,19,18,.3);padding:6px 8px}
nav.tabs .tab{position:relative;border:0;background:none;padding:6px 2px;font-size:.66rem;font-weight:700;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs .tab svg{width:22px;height:22px}
nav.tabs .tab.on{color:var(--ink)}
.dot{position:absolute;top:1px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--o1);color:#fff;font-size:.62rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface)}
.plus{justify-self:center;width:58px;height:58px;margin:-14px 0;border-radius:50%;border:3px solid var(--surface);background:var(--grad);color:#fff;display:grid;place-items:center;
  box-shadow:0 10px 26px -6px rgba(255,94,31,.75),inset 0 1px 0 rgba(255,255,255,.35)}
.plus svg{width:24px;height:24px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + var(--badge) + env(safe-area-inset-bottom));z-index:60;background:var(--btn);color:var(--btn-ink);
  border-radius:99px;padding:11px 18px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);width:max-content;font-size:.88rem;font-weight:650;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:up .2s}
.toast button{background:none;border:0;color:var(--o2);font-weight:800;padding:4px}

.enter>*{animation:rise .34s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.03s}.enter>*:nth-child(3){animation-delay:.06s}.enter>*:nth-child(4){animation-delay:.09s}.enter>*:nth-child(5){animation-delay:.12s}.enter>*:nth-child(n+6){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gO" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb070"/><stop offset="1" stop-color="#ff5e1f"/></linearGradient>

</defs></svg>
<header class="topbar" id="topbar"><div class="in">

  <button class="tab" data-tab="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M21.5 20c-.4-2.6-1.8-4.3-3.8-5.1"/></svg>Clients</button>
  <button class="plus" id="fab" data-act="newSale" aria-label="Ajouter une vente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

  <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>Réglages</button>

<script>
"use strict";
/* ---------- Outils dates & texte ---------- */
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diff = (a, b) => Math.round((parse(a) - parse(b)) / 864e5); // a - b, en jours
const fmt = s => parse(s).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
const fmtLong = s => parse(s).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
const euro = n => (n || 0).toLocaleString("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: (n % 1 ? 2 : 0) });
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const firstName = n => (n || "").trim().split(/\s+/)[0] || "";
const initials = n => (n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const plural = (n, one, many) => n + " " + (n > 1 ? many : one);

function seed() {
  const t = today();
  const s = { v: 1, products: DEFAULT_PRODUCTS.map(p => ({ ...p })), clients: [], sales: [], events: [], tone: "tu", lastExport: null, seeded: true };
  const ex = [
    ["Marie Dupont", "06 00 00 00 01", "p1", 1, -32],  // fini depuis 2 jours
    ["Sophie Martin", "", "p2", 1, -30],               // se termine aujourd'hui
    ["Karim Benali", "06 00 00 00 03", "p3", 1, -43],  // dans 2 jours
    ["Julie Bernard", "06 00 00 00 04", "p1", 2, -10]  // dans 50 jours
  ];
  for (const [name, phone, pid, qty, ago] of ex) {
    const c = { id: uid(), name, phone, example: true };
    s.clients.push(c);
    const p = s.products.find(x => x.id === pid);
    s.sales.push(makeSale(c.id, p, qty, addDays(t, ago), true));

function makeSale(clientId, p, qty, date, example) {
  return { id: uid(), clientId, productId: p.id, product: p.name, days: p.days, price: p.price, qty, date,
    end: addDays(date, p.days * qty), status: "open", snooze: null, relancedAt: null, msg: Math.floor(Math.random() * 5), example: !!example };
}
function load() {
  try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { storageOk = false; return null; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }
  catch (e) { storageOk = false; }
}

/* ---------- Messages de relance ---------- */
function deProd(p) {
  let n = p.trim();
  if (/^[A-ZÀ-Ý][a-zà-ÿ]/.test(n)) n = n[0].toLowerCase() + n.slice(1);
  return (/^[aeiouyhàâéèêëîïôûü]/i.test(n) ? "d'" : "de ") + n;
}
const TEMPLATES = {
  tu: [
    "Coucou {p} ! 😊 Ta réserve {de} doit bientôt toucher à sa fin, non ? Je peux t'en remettre de côté si tu veux, dis-moi !",

    "Hello {p} ! Si mes calculs sont bons, ta cure {de} arrive au bout 😉 Tu veux que je te prépare la suite pour ne pas faire de pause ?",
    "Coucou {p} 🌿 Alors, ça te plaît, ta cure {de} ? Elle doit bientôt se terminer : je t'en réserve pour que tu ne sois pas à court ?",
    "Bonjour {p} ! Je passe ma petite commande cette semaine 😊 Tu veux que j'ajoute de quoi continuer ta cure {de} ? Dis-moi juste combien il t'en faut."
  ],
  vous: [

    "Bonjour {p}, j'espère que vous allez bien. Petit message pour savoir où vous en êtes de votre cure {de} : il vous en reste encore ? Si vous voulez continuer, je m'occupe de tout 🌿",
    "Bonjour {p} ! Si mes calculs sont bons, votre cure {de} arrive au bout 😉 Voulez-vous que je vous prépare la suite pour ne pas faire de pause ?",
    "Bonjour {p} 🌿 Alors, que pensez-vous de votre cure {de} ? Elle doit bientôt se terminer : je vous en réserve pour que vous ne soyez pas à court ?",
    "Bonjour {p} ! Je passe ma commande cette semaine 😊 Voulez-vous que j'ajoute de quoi continuer votre cure {de} ? Dites-moi simplement combien il vous en faut."
  ]
};
function message(s) {
  const list = TEMPLATES[S.tone] || TEMPLATES.tu;
  const c = client(s.clientId);
  return list[(s.msg || 0) % list.length].replace("{p}", firstName(c ? c.name : "")).replace("{de}", deProd(s.product));
}
function waNumber(phone) {
  let d = String(phone || "").replace(/[^\d+]/g, "");
  if (d.startsWith("+")) d = d.slice(1);
  else if (d.startsWith("00")) d = d.slice(2);
  else if (/^0\d{9}$/.test(d)) d = "33" + d.slice(1);   // numéro français 06…
  return d.replace(/\D/g, "");
}

/* ---------- Calculs ---------- */
function dueSales() {
  const t = today();
  return S.sales.filter(s => s.status === "open" && diff(s.end, t) <= 3 && (!s.snooze || s.snooze <= t))
    .sort((a, b) => a.end.localeCompare(b.end));
}
function waitingSales() {
  return S.sales.filter(s => s.status === "relance").sort((a, b) => a.relancedAt.localeCompare(b.relancedAt));
}
function timing(s) {
  const left = diff(s.end, today());
  if (left < 0) return { cls: "late", txt: left === -1 ? "Terminé depuis hier" : `Terminé depuis ${-left} jours` };
  if (left === 0) return { cls: "late", txt: "Se termine aujourd'hui" };
  if (left === 1) return { cls: "soon", txt: "Se termine demain" };
  if (left <= 3) return { cls: "soon", txt: `Se termine dans ${left} jours` };
  return { cls: "ok", txt: `Fin le ${fmt(s.end)}` };
}
function shortTiming(s) {
  const left = diff(s.end, today());
  return left < 0 ? `Retard ${-left} j` : left === 0 ? "Aujourd'hui" : left <= 3 ? `Dans ${left} j` : `Fin ${fmt(s.end)}`;
}
function progress(s) {
  const total = Math.max(1, diff(s.end, s.date));
  return Math.max(0, Math.min(1, diff(today(), s.date) / total));
}
function stats(p) {
  const from = p === "month" ? today().slice(0, 8) + "01" : "0000";
  const ev = S.events.filter(e => e.date >= from);
  const relances = ev.filter(e => e.type === "relance").length;
  const recos = ev.filter(e => e.type === "recommande");
  const ca = recos.reduce((t, e) => t + (e.amount || 0), 0);
  return { relances, recos: recos.length, rate: relances ? Math.round(recos.length / relances * 100) : 0, ca, list: recos };
}

/* Jauge en segments : l'élément signature de Recharge */
function lerpColor(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const [x, y] = [p(a), p(b)];
  return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join("");
}
function dial(frac, center, n = 17) {
  const cx = 130, cy = 134, R = 104, lit = Math.round(Math.max(0, Math.min(1, frac)) * n);
  let h = "";
  for (let i = 0; i < n; i++) {
    const th = 192 + i * (156 / (n - 1)), rad = th * Math.PI / 180;
    const x = (cx + R * Math.cos(rad)).toFixed(1), y = (cy + R * Math.sin(rad)).toFixed(1);
    const t = i / (n - 1);
    const fill = i < lit ? (t < .5 ? lerpColor("#6f86ff", "#ffb48c", t * 2) : lerpColor("#ffb48c", "#ff4f1a", (t - .5) * 2)) : "var(--seg-off)";
    h += `<rect x="${(x - 6.5).toFixed(1)}" y="${(y - 17).toFixed(1)}" width="13" height="34" rx="6.5" fill="${fill}" transform="rotate(${(th - 90).toFixed(1)} ${x} ${y})"/>`;
  }
  return `<div class="dial"><svg viewBox="0 0 260 150" aria-hidden="true">${h}</svg><div class="c">${center}</div></div>`;
}
/* Anneau par client : jours restants ou de retard */
function saleGauge(s) {
  const left = diff(s.end, today()), late = left <= 0;
  const r = 25, c = 2 * Math.PI * r, pct = progress(s);
  const big = left < 0 ? -left : left;
  const small = left < 0 ? "retard" : left === 0 ? "auj." : left === 1 ? "jour" : "jours";
  return `<div class="ring"><svg viewBox="0 0 60 60" aria-hidden="true">
    <circle cx="30" cy="30" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="6"/>
    <circle cx="30" cy="30" r="${r}" fill="none" stroke="url(#${late ? "gR" : "gO"})" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(c * pct).toFixed(1)} ${c.toFixed(1)}" ${pct > 0 ? "" : 'opacity="0"'}/></svg>
    <div class="v"><b class="num">${big}</b><small>${small}</small></div></div>`;
}

let tab = "today";
let period = "month";
let query = "";
const app = document.getElementById("app");

function render() {
  document.querySelectorAll("nav.tabs .tab").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const n = new Set(dueSales().map(s => s.clientId)).size;
  document.getElementById("tabDot").innerHTML = n ? `<span class="dot num">${n}</span>` : "";

  app.innerHTML = `<div class="enter">${({ today: viewToday, clients: viewClients, results: viewResults, settings: viewSettings })[tab]()}</div>`;

}
function fitAreas(root = document) {
  root.querySelectorAll(".bubble textarea").forEach(ta => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; });
}
function exampleNotice() {
  return S.clients.some(c => c.example)
    ? `<div class="notice"><span>Les fiches <span class="tag" style="margin:0">Exemple</span> servent à découvrir l'appli.</span><button class="btn sm primary" data-act="clearExamples">Les effacer</button></div>` : "";
}
const exTag = c => c && c.example ? `<span class="tag">Exemple</span>` : "";
const section = (title, count) => `<div class="section"><h2>${title}</h2>${count != null ? `<span class="pill num">${count}</span>` : ""}</div>`;

function viewToday() {
  const due = dueSales();
  const n = new Set(due.map(s => s.clientId)).size;
  const t = today();
  const doneToday = new Set(S.events.filter(e => e.date === t && e.type !== "recommande").map(e => e.saleId)).size;
  const total = due.length + doneToday;
  const st = stats("month");
  let h = `<section class="hero">`;
  h += n ? dial(total ? doneToday / total : 0, `<div class="big num">${n}</div><div class="lbl">${n > 1 ? "clients à relancer" : "client à relancer"}</div>`)
           + `<div class="sub">${doneToday ? `${doneToday} sur ${total} traités aujourd'hui` : "Commencez par le plus urgent"}</div>`
         : dial(doneToday ? 1 : 0, `<div class="calm">Personne à relancer<br>aujourd'hui</div>`)
           + `<div class="sub">${doneToday ? "Tout est traité, bravo." : "Recharge vous préviendra au bon moment."}</div>`;
  h += `<div class="duo"><div><span class="small">Récupéré ce mois</span><b class="num">${euro(st.ca)}</b></div>
        <div><span class="small">Taux de recommande</span><b class="num">${st.rate} %</b></div></div></section>`;
  h += exampleNotice();

  if (due.length) h += section("À relancer", due.length);
  for (const s of due) {
    const c = client(s.clientId) || { name: "?" };
    const tm = timing(s);
    const pct = Math.round(progress(s) * 100);
    const hasPhone = !!waNumber(c.phone);
    h += `<article class="card rcard" data-sale="${s.id}">
      <div class="rhead">${saleGauge(s)}
        <div class="who"><button class="name" data-act="fiche" data-id="${c.id}">${esc(c.name)}</button>${exTag(c)}
          <div class="status ${tm.cls}">${tm.txt}</div>
          <div class="meta2">${esc(s.product)} × ${s.qty}</div></div></div>
      <div class="track"><span>Acheté le ${fmt(s.date)}</span><span class="num">Cure ${pct} %</span><span>Fin ${fmt(s.end)}</span></div>
      <div class="line ${tm.cls}"><span style="width:${pct}%"></span></div>
      <div class="bubble"><div class="top"><span class="small">Message proposé</span><button class="vary" data-act="nextMsg" data-id="${s.id}">${I.redo} Autre</button></div>
        <textarea class="msg" id="msg-${s.id}" rows="4" aria-label="Message pour ${esc(c.name)}">${esc(message(s))}</textarea></div>
      ${hasPhone
        ? `<a class="btn primary send" href="#" target="_blank" rel="noopener" data-act="wa" data-id="${s.id}">${I.wa} Envoyer sur WhatsApp</a>`
        : `<button class="btn primary send" data-act="copy" data-id="${s.id}">${I.copy} Copier le message</button>
           <div class="alt">Pas de numéro enregistré · <button data-act="waAny" data-id="${s.id}">ouvrir WhatsApp et choisir le contact</button></div>`}
      <div class="acts">
        <button data-act="relance" data-id="${s.id}"><span class="ic">${I.check}</span>Relancé</button>
        <button class="reco" data-act="reco" data-id="${s.id}"><span class="ic">${I.bag}</span>A recommandé</button>
        <button class="later" data-act="later" data-id="${s.id}"><span class="ic">${I.clock}</span>Plus tard · 3 j</button>
      </div>
    </article>`;
  }

  const wait = waitingSales();
  if (wait.length) {
    h += section("En attente de réponse", wait.length) + `<div class="card list">`;
    for (const s of wait) {
      const c = client(s.clientId) || { name: "?" };
      const d = diff(today(), s.relancedAt);
      h += `<div class="row"><div style="min-width:0"><button class="name" style="font-size:1rem" data-act="fiche" data-id="${c.id}">${esc(c.name)}</button>${exTag(c)}
        <div class="meta2">${esc(s.product)} · relancé ${d === 0 ? "aujourd'hui" : d === 1 ? "hier" : `il y a ${d} jours`}</div></div>
        <div class="btns"><button class="btn sm orange" data-act="reco" data-id="${s.id}">A recommandé</button><button class="x" data-act="noFollow" data-id="${s.id}" aria-label="Sans suite">${I.x}</button></div></div>`;
    }
    h += `</div>`;
  }

  if (!due.length) {
    const next = S.sales.filter(s => s.status === "open" && (diff(s.end, today()) > 3 || (s.snooze && s.snooze > today())))
      .sort((a, b) => a.end.localeCompare(b.end))[0];
    if (next) {
      const c = client(next.clientId);
      h += `<p class="empty">Prochaine fin de produit : <b>${esc(c ? c.name : "")}</b> · ${esc(next.product)} · ${fmt(next.end)}</p>`;
    } else if (!S.sales.length) {
      h += `<p class="empty">Ajoutez votre première vente avec le bouton <b>+</b> en bas de l'écran.</p>`;
    }

  return h;
}

function viewClients() {
  const q = query.trim().toLowerCase();
  const list = S.clients.filter(c => !q || c.name.toLowerCase().includes(q) || (c.phone || "").replace(/\s/g, "").includes(q.replace(/\s/g, "")))
    .sort((a, b) => a.name.localeCompare(b.name, "fr"));
  let h = `<h1 class="title">Clients</h1><p class="lede">${plural(S.clients.length, "client", "clients")} · ${plural(S.sales.length, "vente enregistrée", "ventes enregistrées")}</p>`;
  h += `<label class="search">${I.search}<input id="search" type="search" placeholder="Rechercher un nom ou un numéro" value="${esc(query)}" autocomplete="off"></label>`;
  h += exampleNotice();
  if (list.length) {
    h += `<div class="card">`;
    for (const c of list) {
      const next = S.sales.filter(s => s.clientId === c.id && (s.status === "open" || s.status === "relance")).sort((a, b) => a.end.localeCompare(b.end))[0];
      const t = next ? timing(next) : null;
      const chip = !next ? "" : next.status === "relance" ? `<span class="chip done">Relancé</span>` : `<span class="chip ${t.cls} num">${shortTiming(next)}</span>`;
      h += `<button class="crow" data-act="fiche" data-id="${c.id}"><span class="avatar ${next && next.status === "open" && diff(next.end, today()) <= 3 ? "" : "blue"}">${esc(initials(c.name))}</span>
        <span class="grow"><b>${esc(c.name)}</b>${exTag(c)}<div class="meta2">${next ? esc(next.product) : "Aucun produit en cours"}</div></span>${chip}</button>`;
    }
    h += `</div>`;
  }
  if (!S.clients.length) h += `<p class="empty">Aucun client pour l'instant.<br>Ils apparaissent ici dès votre première vente.</p>`;
  else if (!list.length) h += `<p class="empty">Aucun client ne correspond.</p>`;
  return h;
}

  const maxv = Math.max(1, st.relances);
  h += `<div class="card bars">
    <div class="b"><div class="t"><span>Relances faites</span><b class="num" id="kpiRel">${st.relances}</b></div><div class="line blue"><span style="width:${st.relances ? 100 : 0}%"></span></div></div>
    <div class="b"><div class="t"><span>Recommandes obtenues</span><b class="num" id="kpiReco">${st.recos}</b></div><div class="line"><span style="width:${Math.round(st.recos / maxv * 100)}%"></span></div></div></div>`;
  h += `<p class="hint">Taux de recommande : sur 10 clients relancés, combien ont racheté. Les montants viennent des prix indiqués dans Réglages › Mes produits.</p>`;
  if (st.list.length) {
    h += section("Dernières recommandes", st.list.length) + `<div class="card"><ul class="hist">`;
    for (const e of st.list.slice().reverse().slice(0, 15)) {
      const c = client(e.clientId);
      h += `<li><span><b>${esc(c ? c.name : "Client supprimé")}</b><br><small>${esc(e.product)} · ${fmt(e.date)}</small></span><b class="num">${euro(e.amount)}</b></li>`;
    }
    h += `</ul></div>`;
  } else {
    h += `<p class="empty">Vos recommandes apparaîtront ici.<br>Quand un client rachète après une relance, appuyez sur <b>A recommandé</b>.</p>`;
  }
  return h;
}

function viewSettings() {
  let h = `<h1 class="title">Réglages</h1><p class="lede">Vos produits, vos messages, vos sauvegardes.</p>`;
  h += section("Mes produits", S.products.length) + `<div class="card pad">
    <div class="prodhead"><span>Produit</span><span>Jours</span><span>Prix €</span><span></span></div>`;
  for (const p of S.products) {
    h += `<div class="prodrow" data-pid="${p.id}">
      <input class="input" data-field="name" value="${esc(p.name)}" aria-label="Nom du produit">
      <input class="input num" data-field="days" inputmode="numeric" value="${p.days}" aria-label="Durée en jours">
      <input class="input num" data-field="price" inputmode="decimal" value="${String(p.price).replace(".", ",")}" aria-label="Prix">
      <button class="x" data-act="delProduct" data-id="${p.id}" aria-label="Supprimer ${esc(p.name)}">${I.x}</button></div>`;
  }
  h += `<p class="hint" style="margin:10px 0 0">Jours = durée d'un produit. Prix = prix de vente au client.</p>
    <button class="btn soft" style="margin-top:12px" data-act="addProductRow">Ajouter un produit</button></div>`;

  h += section("Ton des messages") + `<div class="seg" style="margin-top:0">
    <button class="${S.tone === "tu" ? "on" : ""}" data-act="tone" data-t="tu">Tutoiement</button>
    <button class="${S.tone === "vous" ? "on" : ""}" data-act="tone" data-t="vous">Vouvoiement</button></div>`;

  h += section("Sauvegarde", S.lastExport ? "Dernière : " + fmt(S.lastExport) : "Jamais faite") + `<div class="card pad">
    <div style="font-size:.9rem;color:var(--ink-2)">Vos données restent uniquement dans ce téléphone. Exportez-les régulièrement (par exemple en vous envoyant le fichier par e-mail) pour ne rien perdre.</div>
    <button class="btn primary" style="margin-top:14px" data-act="export">${I.down} Exporter mes données</button>
    <button class="btn outline" style="margin-top:8px" data-act="import">${I.up} Importer une sauvegarde</button></div>`;

  if (S.clients.some(c => c.example)) {
    h += section("Exemples") + `<button class="btn danger" data-act="clearExamples">Effacer les clients d'exemple</button>`;
  }
  h += `<p class="hint" style="text-align:center;margin-top:30px">Recharge · version d'essai · données 100 % locales</p>`;
  return h;
}

/* ---------- Panneaux ---------- */
const sheetEl = document.getElementById("sheet");
function openSheet(html) {
  sheetEl.innerHTML = `<div class="sheet-bg" data-act="closeBg"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  document.body.style.overflow = "hidden";
}
function closeSheet() { sheetEl.innerHTML = ""; document.body.style.overflow = ""; }
const closeBtn = `<button class="close" data-act="close" aria-label="Fermer">${I.x}</button>`;

let form = null; // état du formulaire de vente
function openNewSale(clientId) {
  const c = clientId && client(clientId);
  form = { pid: (S.products[0] || {}).id, qty: 1 };
  const names = S.clients.map(x => `<option value="${esc(x.name)}">`).join("");
  openSheet(`<div class="shead"><h3>Nouvelle vente</h3>${closeBtn}</div>
    <form id="saleForm" autocomplete="off">
      <label class="field"><span>Client</span><input class="input" id="fName" list="clientNames" required placeholder="Prénom Nom" value="${c ? esc(c.name) : ""}" enterkeyhint="next"></label>
      <datalist id="clientNames">${names}</datalist>
      <label class="field"><span>Téléphone <i>· facultatif</i></span><input class="input" id="fPhone" type="tel" inputmode="tel" placeholder="06 12 34 56 78" value="${c ? esc(c.phone) : ""}"></label>
      <div class="field"><span>Produit</span><div class="pchips" id="chips"></div></div>
      <div id="newProd" class="subform hidden">
        <label class="field"><span>Nom du produit</span><input class="input" id="npName" placeholder="ex. : Dentifrice aloe vera"></label>
        <div class="two" style="grid-template-columns:1fr 1fr">
          <label class="field"><span>Durée (jours)</span><input class="input" id="npDays" inputmode="numeric" value="30"></label>
          <label class="field"><span>Prix (€)</span><input class="input" id="npPrice" inputmode="decimal" placeholder="0"></label>
        </div>
        <button type="button" class="btn soft" style="margin-top:12px" data-act="saveNewProduct">Ajouter ce produit</button>
      </div>
      <div class="two">
        <div class="field"><span>Quantité</span>
          <div class="stepper"><button type="button" data-act="qty" data-d="-1" aria-label="Moins">−</button><output id="fQty" class="num">1</output><button type="button" data-act="qty" data-d="1" aria-label="Plus">+</button></div></div>
        <label class="field"><span>Date d'achat</span><input class="input" id="fDate" type="date" value="${today()}" max="${addDays(today(), 1)}"></label>
      </div>
      <div class="summary" id="endBox"></div>
      <button class="btn primary" style="margin-top:14px" type="submit">Enregistrer la vente</button>
    </form>`);
  drawChips(); updateEnd();
  if (!c) setTimeout(() => document.getElementById("fName").focus(), 60);
}
function drawChips() {
  document.getElementById("chips").innerHTML = S.products.map(p =>
    `<button type="button" class="pchip ${p.id === form.pid ? "on" : ""}" data-act="pick" data-id="${p.id}">${esc(p.name)}<small class="num">${p.days} j</small></button>`).join("")
    + `<button type="button" class="pchip add" data-act="toggleNewProd">+ Autre produit</button>`;
}
function updateEnd() {
  const p = S.products.find(x => x.id === form.pid);
  const date = document.getElementById("fDate").value || today();
  document.getElementById("fQty").textContent = form.qty;
  const box = document.getElementById("endBox");
  if (!p) { box.innerHTML = `<span>Choisissez un produit.</span>`; return; }
  const end = addDays(date, p.days * form.qty);
  const d = diff(end, today());
  box.innerHTML = `<div><span class="small">Fin estimée</span><b>${cap(fmtLong(end))}</b>
    <span style="font-size:.82rem;color:var(--ink-2)">${d >= 0 ? "dans " + plural(d, "jour", "jours") : "déjà passée"}</span></div>` +
    (p.price ? `<span class="price num">${euro(p.price * form.qty)}</span>` : "");
}
function submitSale() {
  const name = document.getElementById("fName").value.trim();
  const phone = document.getElementById("fPhone").value.trim();
  const date = document.getElementById("fDate").value || today();
  const p = S.products.find(x => x.id === form.pid);
  if (!name) { document.getElementById("fName").focus(); return toast("Indiquez le nom du client."); }
  if (!p) return toast("Choisissez un produit.");
  const snap = snapshot();
  let c = S.clients.find(x => x.name.toLowerCase() === name.toLowerCase());
  if (!c) { c = { id: uid(), name, phone, example: false }; S.clients.push(c); }
  else if (phone) c.phone = phone;
  // Une nouvelle vente du même produit remplace la précédente en cours
  let counted = false;
  for (const old of S.sales) {
    if (old.clientId === c.id && old.product === p.name && (old.status === "open" || old.status === "relance") && old.date <= date) {
      if (old.status === "relance") { logEvent("recommande", old, { amount: p.price * form.qty }); counted = true; }
      old.status = "rachete";
    }
  }
  S.sales.push(makeSale(c.id, p, form.qty, date, c.example));
  save(); closeSheet(); render();
  toast(counted ? `Vente enregistrée et comptée comme recommande` : `Vente enregistrée pour ${firstName(c.name)}`, snap);
}

function openFiche(id) {
  const c = client(id); if (!c) return;
  const sales = S.sales.filter(s => s.clientId === id).sort((a, b) => b.date.localeCompare(a.date));
  const evs = S.events.filter(e => e.clientId === id).sort((a, b) => b.date.localeCompare(a.date));
  const STATUS = { open: ["En cours", ""], relance: ["Relancé", "done"], recommande: ["A recommandé", "done"], rachete: ["Racheté", "done"], sanssuite: ["Sans suite", ""] };
  const EV = { relance: "Relancé", recommande: "A recommandé", report: "Reporté de 3 jours", sanssuite: "Classé sans suite" };
  const total = sales.reduce((t, s) => t + (s.price || 0) * s.qty, 0);
  openSheet(`<div class="shead"><div style="display:flex;gap:12px;align-items:center;min-width:0"><span class="avatar">${esc(initials(c.name))}</span>
      <div style="min-width:0"><h3>${esc(c.name)}${exTag(c)}</h3><div class="meta2">${plural(sales.length, "achat", "achats")} · ${euro(total)}</div></div></div>${closeBtn}</div>
    <label class="field"><span>Nom</span><input class="input" data-cfield="name" data-id="${c.id}" value="${esc(c.name)}"></label>
    <label class="field"><span>Téléphone</span><input class="input" type="tel" inputmode="tel" data-cfield="phone" data-id="${c.id}" value="${esc(c.phone)}" placeholder="Aucun numéro"></label>
    <button class="btn primary" style="margin-top:14px" data-act="newSaleFor" data-id="${c.id}">Nouvelle vente pour ${esc(firstName(c.name))}</button>
    <div class="section"><h2>Achats</h2><span class="pill num">${sales.length}</span></div>
    <div class="card"><ul class="hist">${sales.map(s => `<li><span style="min-width:0"><b>${esc(s.product)} × ${s.qty}</b><br><small>Acheté le ${fmt(s.date)} · fin ${fmt(s.end)}${s.price ? " · " + euro(s.price * s.qty) : ""}</small></span>
      <span style="display:flex;gap:8px;align-items:center"><span class="chip ${STATUS[s.status]?.[1] || ""}">${STATUS[s.status]?.[0] || ""}</span><button class="x" data-act="delSale" data-id="${s.id}" aria-label="Supprimer cet achat">${I.x}</button></span></li>`).join("") || `<li><small>Aucun achat.</small></li>`}</ul></div>
    <div class="section"><h2>Relances</h2><span class="pill num">${evs.length}</span></div>
    <div class="card"><ul class="hist">${evs.map(e => `<li><span><b style="font-weight:620">${EV[e.type] || e.type}</b><br><small>${esc(e.product)}</small></span><small class="num">${fmt(e.date)}${e.amount ? " · " + euro(e.amount) : ""}</small></li>`).join("") || `<li><small>Aucune relance pour l'instant.</small></li>`}</ul></div>
    <button class="btn danger" style="margin-top:22px" data-act="delClient" data-id="${c.id}">Supprimer ce client</button>`);
}

/* ---------- Annuler & messages ---------- */
const snapshot = () => JSON.stringify(S);
let toastTimer;
function toast(text, snap) {
  const el = document.getElementById("toast");
  el.innerHTML = `<div class="toast" role="status"><span>${esc(text)}</span>${snap ? `<button id="undo">Annuler</button>` : ""}</div>`;
  if (snap) document.getElementById("undo").onclick = () => { S = JSON.parse(snap); save(); render(); el.innerHTML = ""; };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.innerHTML = "", 4500);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (_) {}
    ta.remove(); return ok;
  }
}
const currentMsg = id => { const ta = document.getElementById("msg-" + id); return ta ? ta.value : message(sale(id)); };

/* ---------- Actions ---------- */
const actions = {
  newSale: () => openNewSale(),
  newSaleFor: el => { closeSheet(); openNewSale(el.dataset.id); },
  close: () => closeSheet(),
  closeBg: (el, ev) => { if (ev.target === el) closeSheet(); },
  fiche: el => openFiche(el.dataset.id),
  pick: el => { form.pid = el.dataset.id; drawChips(); updateEnd(); },
  qty: el => { form.qty = Math.max(1, Math.min(99, form.qty + Number(el.dataset.d))); updateEnd(); },
  toggleNewProd: () => { document.getElementById("newProd").classList.toggle("hidden"); document.getElementById("npName").focus(); },
  saveNewProduct: () => {
    const name = document.getElementById("npName").value.trim();
    if (!name) return toast("Indiquez le nom du produit.");
    const p = { id: uid(), name, days: Math.max(1, Math.round(num(document.getElementById("npDays").value)) || 30), price: num(document.getElementById("npPrice").value) };
    S.products.push(p); save(); form.pid = p.id;
    document.getElementById("newProd").classList.add("hidden"); drawChips(); updateEnd();
  },
  nextMsg: el => { const s = sale(el.dataset.id); s.msg = (s.msg || 0) + 1; save(); const ta = document.getElementById("msg-" + s.id); ta.value = message(s); fitAreas(ta.parentNode); },
  wa: el => {
    const s = sale(el.dataset.id), c = client(s.clientId);
    el.href = `https://wa.me/${waNumber(c.phone)}?text=${encodeURIComponent(currentMsg(s.id))}`;
    setTimeout(() => toast("Une fois le message envoyé, appuyez sur « Relancé »."), 400);
    return true; // laisse le lien s'ouvrir
  },
  waAny: el => { window.open(`https://wa.me/?text=${encodeURIComponent(currentMsg(el.dataset.id))}`, "_blank"); },
  copy: async el => { const ok = await copyText(currentMsg(el.dataset.id)); toast(ok ? "Message copié. Collez-le dans votre messagerie." : "Impossible de copier : sélectionnez le texte à la main."); },
  relance: el => {
    const s = sale(el.dataset.id), snap = snapshot();
    s.status = "relance"; s.relancedAt = today(); logEvent("relance", s);
    save(); render(); toast(`Relance de ${firstName(client(s.clientId).name)} notée`, snap);
  },
  reco: el => {
    const s = sale(el.dataset.id), snap = snapshot();
    const p = S.products.find(x => x.id === s.productId) || { id: s.productId, name: s.product, days: s.days, price: s.price };
    if (s.status !== "relance") { logEvent("relance", s); s.relancedAt = today(); }
    s.status = "recommande";
    const n = makeSale(s.clientId, p, s.qty, today(), s.example);
    S.sales.push(n);
    logEvent("recommande", s, { amount: p.price * s.qty, newSaleId: n.id });
    save(); render(); toast(`Bravo ! Nouvelle vente créée pour ${firstName(client(s.clientId).name)}`, snap);
  },
  later: el => {
    const s = sale(el.dataset.id), snap = snapshot();
    s.snooze = addDays(today(), 3); logEvent("report", s);
    save(); render(); toast(`Reporté au ${fmt(s.snooze)}`, snap);
  },
  noFollow: el => {
    const s = sale(el.dataset.id), snap = snapshot();
    s.status = "sanssuite"; logEvent("sanssuite", s);
    save(); render(); toast("Classé sans suite", snap);
  },
  period: el => { period = el.dataset.p; render(); },
  tone: el => { S.tone = el.dataset.t; save(); render(); toast(S.tone === "tu" ? "Les messages tutoient vos clients." : "Les messages vouvoient vos clients."); },
  addProductRow: () => { S.products.push({ id: uid(), name: "Nouveau produit", days: 30, price: 0 }); save(); render();
    const rows = document.querySelectorAll(".prodrow"); const i = rows[rows.length - 1].querySelector("input"); i.focus(); i.select(); },
  delProduct: el => {
    const p = S.products.find(x => x.id === el.dataset.id);
    if (!confirm(`Retirer « ${p.name} » de la liste ? Les ventes déjà enregistrées sont conservées.`)) return;
    const snap = snapshot(); S.products = S.products.filter(x => x !== p); save(); render(); toast("Produit retiré", snap);
  },
  delSale: el => {
    if (!confirm("Supprimer cet achat ?")) return;
    const s = sale(el.dataset.id), snap = snapshot();
    S.sales = S.sales.filter(x => x !== s); S.events = S.events.filter(e => e.saleId !== s.id);
    save(); render(); openFiche(s.clientId); toast("Achat supprimé", snap);
  },
  delClient: el => {
    const c = client(el.dataset.id);
    if (!confirm(`Supprimer ${c.name} et tout son historique ?`)) return;
    const snap = snapshot();
    S.clients = S.clients.filter(x => x !== c); S.sales = S.sales.filter(s => s.clientId !== c.id);
    S.events = S.events.filter(e => e.clientId !== c.id);
    save(); closeSheet(); render(); toast("Client supprimé", snap);
  },
  clearExamples: () => {
    const snap = snapshot(), ids = new Set(S.clients.filter(c => c.example).map(c => c.id));
    S.clients = S.clients.filter(c => !ids.has(c.id)); S.sales = S.sales.filter(s => !ids.has(s.clientId));
    S.events = S.events.filter(e => !ids.has(e.clientId));
    save(); render(); toast("Exemples effacés", snap);
  },
  export: () => {
    S.lastExport = today(); save();
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `recharge-sauvegarde-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    render(); toast("Sauvegarde téléchargée");
  },
  import: () => document.getElementById("importFile").click()
};

document.addEventListener("click", ev => {
  const tabBtn = ev.target.closest("[data-tab]");
  if (tabBtn) { tab = tabBtn.dataset.tab; closeSheet(); render(); window.scrollTo(0, 0); return; }
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const fn = actions[el.dataset.act];
  if (!fn) return;
  if (el.dataset.act === "closeBg") { fn(el, ev); return; }
  const keepDefault = fn(el, ev) === true;
  if (!keepDefault) ev.preventDefault();
});
document.addEventListener("submit", ev => { if (ev.target.id === "saleForm") { ev.preventDefault(); submitSale(); } });
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "search") {
    query = t.value; const pos = t.selectionStart; render();
    const s = document.getElementById("search"); s.focus(); s.setSelectionRange(pos, pos);
    app.firstElementChild.classList.remove("enter");
  }
  if (t.classList.contains("msg")) fitAreas(t.parentNode);
  if (t.id === "fDate") updateEnd();
  if (t.id === "fName") {
    const c = S.clients.find(x => x.name.toLowerCase() === t.value.trim().toLowerCase());
    const ph = document.getElementById("fPhone");
    if (c && c.phone && !ph.value) ph.value = c.phone;
  }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  const row = t.closest(".prodrow");
  if (row) {
    const p = S.products.find(x => x.id === row.dataset.pid); if (!p) return;
    const f = t.dataset.field;
    if (f === "name") p.name = t.value.trim() || p.name;
    if (f === "days") p.days = Math.max(1, Math.round(num(t.value)) || p.days);
    if (f === "price") p.price = Math.max(0, num(t.value));
    save(); toast("Produit mis à jour"); return;
  }
  if (t.dataset.cfield) {
    const c = client(t.dataset.id); if (!c) return;
    if (t.dataset.cfield === "name" && t.value.trim()) c.name = t.value.trim();
    if (t.dataset.cfield === "phone") c.phone = t.value.trim();
    save(); render(); toast("Fiche mise à jour");
  }
});
document.getElementById("importFile").addEventListener("change", async ev => {
  const file = ev.target.files[0]; ev.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.products) || !Array.isArray(data.clients) || !Array.isArray(data.sales) || !Array.isArray(data.events)) throw new Error("format");
    if (!confirm(`Remplacer les données actuelles par cette sauvegarde (${plural(data.clients.length, "client", "clients")}) ?`)) return;
    const snap = snapshot(); S = data; save(); tab = "today"; render(); toast("Sauvegarde importée", snap);
  } catch (e) { toast("Ce fichier n'est pas une sauvegarde Recharge valide."); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeSheet(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && !sheetEl.innerHTML) render(); });
const topbar = document.getElementById("topbar");
addEventListener("scroll", () => topbar.classList.toggle("scrolled", scrollY > 4), { passive: true });

/* Certains hébergeurs (ex. Netlify) ajoutent un badge en bas de l'écran : on remonte la barre d'onglets pour qu'il ne la cache pas */
function avoidHostBadge() {
  const b = document.getElementById("nl-badge-frame");
  document.documentElement.style.setProperty("--badge", b && b.offsetHeight ? "58px" : "0px");
}
new MutationObserver(avoidHostBadge).observe(document.body, { childList: true });
avoidHostBadge();

render();
</script>
</body>
</html>
