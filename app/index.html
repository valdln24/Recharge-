}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.lc-stamps{display:flex;gap:8px;margin-top:14px}.lc-stamps i{flex:1;max-width:38px;aspect-ratio:1;border-radius:50%;border:2px dashed rgba(255,255,255,.35);display:grid;place-items:center;font-style:normal;font-size:.9rem}.lc-stamps i.on{border:0;background:linear-gradient(135deg,#FF8A4C,#FF5A1F)}

.linkbtn{display:block;margin:12px auto 0;background:none;border:0;color:var(--ink-3);font:inherit;font-size:.84rem;text-decoration:underline;cursor:pointer}
.tsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.tsum div{background:var(--surface-2);border-radius:14px;padding:10px 6px;text-align:center}.tsum b{display:block;font-size:1.05rem}.tsum span{font-size:.7rem;color:var(--ink-3);font-weight:600}

.obtone b{font-size:1rem}.obtone small{color:var(--ink-3);font-weight:600;font-size:.84rem;margin-top:2px}.obtone.on{border-color:var(--o1);background:var(--o-soft)}

.tbtns{display:flex;gap:6px}

@media (max-width:360px){.mods{grid-template-columns:repeat(3,1fr)}}
.bilan{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.bilan div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.bilan div.hl{grid-column:1/-1;background:var(--o-soft);border-color:transparent}.bilan b{display:block;font-size:1.7rem;letter-spacing:-.04em}.bilan .hl b{color:var(--o-text)}.bilan span{font-size:.82rem;color:var(--ink-2);font-weight:600}
.lc-perk.lc-gift{font-size:1.45rem;line-height:1.2;margin-top:2px}
.obrow{display:grid;grid-template-columns:26px 1fr;gap:8px;margin-top:12px}.obrow>b{width:26px;height:26px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:.8rem;margin-top:12px}

.obor{display:flex;align-items:center;gap:10px;margin:16px 0 10px;color:var(--ink-3);font-size:.85rem;font-weight:650}.obor::before,.obor::after{content:"";flex:1;height:1px;background:var(--line)}
.pot-viz{position:relative;aspect-ratio:1;max-width:330px;width:100%;margin:0 auto}
.pot-viz svg{width:100%;height:100%;display:block;overflow:visible}
.pot-viz .ln{stroke:#ffd2bd;stroke-width:1}.pot-viz .ln.b{stroke:#cfd8ff}
.pot-viz .cl{fill:url(#gO)}.pot-viz .pr{fill:url(#gB)}
.pot-viz .ct{fill:#ffb08a;opacity:.75}.pot-viz .ctb{fill:#9fb1ff;opacity:.75}.pot-viz .ct2{fill:#ffd9c6;opacity:.8}
.pot-viz .pot-in{transition:transform .6s cubic-bezier(.3,1.3,.5,1)}.pot-viz .pot-in.small{transform:scale(.68)}
.pot-viz .pop{transform-box:fill-box;transform-origin:center;animation:potPop .5s cubic-bezier(.3,1.6,.5,1) both}

.devnet{margin:6px 0 0;padding:12px 14px;border-radius:16px;background:var(--o-soft);font-weight:650;font-size:.92rem}.devnet b{color:var(--o-text);font-size:1.15rem}
.opp{margin-top:10px}.opph{display:block;margin-bottom:4px}

.acts .ic svg{width:21px;height:21px}
.acts .reco .ic{background:var(--grad);color:#fff;box-shadow:0 8px 20px -8px rgba(255,94,31,.75)}
.acts .later .ic{background:var(--gradB);color:#fff;box-shadow:0 8px 20px -8px rgba(79,108,247,.7)}

.list .row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px}
.list .row+.row{border-top:1px solid var(--line)}
.row .btns{display:flex;gap:6px;flex:none}
.x{width:38px;height:38px;border:0;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;flex:none}
.x svg{width:14px;height:14px}
.empty{text-align:center;color:var(--ink-3);padding:26px 16px;font-size:.92rem;font-weight:550}
.empty b{color:var(--ink)}

/* ---------- Clients ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:0 18px;margin-top:14px;box-shadow:var(--shadow)}
.search svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.search input{flex:1;min-height:52px;border:0;background:transparent;font-size:1rem;font-weight:550}
.search input:focus{outline:none}
.crow{display:flex;width:100%;align-items:center;gap:12px;background:none;border:0;padding:12px 16px;text-align:left}
.crow+.crow{border-top:1px solid var(--line)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--o-soft);color:var(--o-text);display:grid;place-items:center;font-weight:750;font-size:.9rem;flex:none}
.crow .grow{flex:1;min-width:0}
.crow b{font-weight:700;letter-spacing:-.015em}
.chip{flex:none;font-size:.74rem;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.chip.late{background:var(--late-soft);color:var(--late)} .chip.soon{background:var(--o-soft);color:var(--o-text)}
.chip.done{background:var(--b-soft);color:var(--b-text)}
.chip.ok{background:var(--b-soft);color:var(--b-text)}
.avatar.blue{background:var(--b-soft);color:var(--b-text)}

/* ---------- Résultats ---------- */
.seg{display:flex;background:var(--surface-2);border-radius:99px;padding:4px;gap:4px;margin-top:14px}
.seg button{flex:1;min-height:40px;border:0;border-radius:99px;background:transparent;font-weight:700;font-size:.88rem;color:var(--ink-2)}
.seg button.on{background:var(--btn);color:var(--btn-ink)}
.kpi{position:relative;overflow:hidden;border-radius:28px;padding:22px;margin-top:12px;color:#fff;background:var(--grad);box-shadow:0 18px 40px -20px rgba(255,94,31,.8)}
.kpi::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.22) 1px,transparent 1.3px);background-size:11px 11px;
  -webkit-mask-image:linear-gradient(110deg,transparent 35%,#000 100%);mask-image:linear-gradient(110deg,transparent 35%,#000 100%)}
.kpi>*{position:relative}
.kpi .lbl{font-size:.88rem;font-weight:700;opacity:.92}
.kpi .val{font-size:3.3rem;font-weight:700;line-height:1.05;margin-top:8px;letter-spacing:-.055em}
.kpi .split{display:grid;grid-template-columns:repeat(3,1fr);margin:16px -22px -22px;border-top:1px solid rgba(255,255,255,.25)}
.kpi .split div{padding:12px 8px 14px 22px;min-width:0}
.kpi .split div+div{border-left:1px solid rgba(255,255,255,.25);padding-left:12px}
.kpi .split span{display:block;font-size:.68rem;font-weight:700;opacity:.88;white-space:nowrap;letter-spacing:-.01em}
.kpi .split b{font-size:1.1rem;font-weight:750;letter-spacing:-.03em}
.kpi .sub{font-size:.86rem;opacity:.9;margin-top:6px;font-weight:600}
.rate{padding:20px 18px 18px;text-align:center}
.bars{padding:6px 16px 14px}
.bars .b{padding:12px 0}
.bars .b+.b{border-top:1px solid var(--line)}
.bars .t{display:flex;justify-content:space-between;align-items:baseline;font-weight:650;font-size:.92rem}
.bars .t b{font-size:1.2rem;font-weight:700}
.bars .line{margin-top:9px}
.bars .line.blue span{background:var(--gradB)}
.hint{color:var(--ink-3);font-size:.82rem;margin:12px 4px 0;line-height:1.55;font-weight:550}
.hist{list-style:none;padding:0;margin:0}
.hist li{padding:12px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.hist li+li{border-top:1px solid var(--line)}
.hist small{color:var(--ink-3);font-size:.8rem;font-weight:550}

/* ---------- Réglages ---------- */
.pad{padding:16px}
.prodhead,.prodrow{display:grid;grid-template-columns:1fr 58px 72px 38px;gap:6px;align-items:center}
.prodhead{font-size:.72rem;font-weight:700;color:var(--ink-3);margin-bottom:6px}
.prodrow+.prodrow{margin-top:6px}
.prodrow .input{min-height:42px;margin:0;padding:0 10px;font-size:.9rem;border-radius:12px}

/* ---------- Formulaires ---------- */
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:.8rem;font-weight:700;color:var(--ink-2);margin-bottom:7px}
.field>span i{font-style:normal;font-weight:550;color:var(--ink-3)}
.input{display:block;width:100%;min-height:52px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface);padding:0 16px;font-size:1rem;font-weight:550;transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--b1);box-shadow:0 0 0 4px var(--b-soft)}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:10px 14px;font-weight:700;font-size:.88rem;display:flex;gap:6px;align-items:baseline}
.pchip small{color:var(--ink-3);font-weight:650;font-size:.76rem}
.pchip.on{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.pchip.on small{color:inherit;opacity:.65}
.pchip.add{border-style:dashed;color:var(--o-text)}
.stepper{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:99px;overflow:hidden;background:var(--surface);width:max-content}
.stepper button{width:48px;height:50px;border:0;background:transparent;font-size:1.3rem;font-weight:600;color:var(--ink)}
.stepper output{min-width:34px;text-align:center;font-weight:750;font-size:1.1rem}
.two{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:end}
.summary{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--o-soft);border-radius:20px;padding:13px 16px;margin-top:16px}
.summary .small{color:var(--o-text)}
.summary b{display:block;font-size:1.02rem;font-weight:750;letter-spacing:-.02em}
.summary .price{font-weight:750;font-size:1.2rem;letter-spacing:-.03em}
.subform{border:1px dashed var(--line-2);border-radius:20px;padding:2px 14px 14px;margin-top:10px}

/* ---------- Panneau ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,11,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(32px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line-2);margin:4px auto 12px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.shead h3{margin:0;font-size:1.4rem;font-weight:750;letter-spacing:-.04em}
.close{border:0;background:var(--surface-2);color:var(--ink);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.close svg{width:15px;height:15px}

/* ---------- Navigation ---------- */
nav.tabs{position:fixed;left:14px;right:14px;bottom:calc(12px + var(--badge) + env(safe-area-inset-bottom));z-index:30;display:flex;justify-content:center;pointer-events:none}
nav.tabs .in{pointer-events:auto;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;width:100%;max-width:532px;
  background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
  border:1px solid var(--line);border-radius:99px;box-shadow:0 14px 34px -14px rgba(16,19,18,.3);padding:6px 8px}
nav.tabs .tab{position:relative;border:0;background:none;padding:6px 2px;font-size:.66rem;font-weight:700;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs .tab svg{width:22px;height:22px}
nav.tabs .tab.on{color:var(--ink)}
.dot{position:absolute;top:1px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--o1);color:#fff;font-size:.62rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface)}
.plus{justify-self:center;width:58px;height:58px;margin:-14px 0;border-radius:50%;border:3px solid var(--surface);background:var(--grad);color:#fff;display:grid;place-items:center;
  box-shadow:0 10px 26px -6px rgba(255,94,31,.75),inset 0 1px 0 rgba(255,255,255,.35)}
.plus svg{width:24px;height:24px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + var(--badge) + env(safe-area-inset-bottom));z-index:60;background:var(--btn);color:var(--btn-ink);
  border-radius:99px;padding:11px 18px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);width:max-content;font-size:.88rem;font-weight:650;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:up .2s}
.sheet-open .toast{bottom:auto;top:calc(14px + env(safe-area-inset-top))}
.toast button{background:none;border:0;color:var(--o2);font-weight:800;padding:4px}

.enter>*{animation:rise .34s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.03s}.enter>*:nth-child(3){animation-delay:.06s}.enter>*:nth-child(4){animation-delay:.09s}.enter>*:nth-child(5){animation-delay:.12s}.enter>*:nth-child(n+6){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
"use strict";
/* ---------- Outils dates & texte ---------- */
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diff = (a, b) => Math.round((parse(a) - parse(b)) / 864e5); // a - b, en jours
const fmt = s => parse(s).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
const fmtLong = s => parse(s).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
const euro = n => (n || 0).toLocaleString("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: (n % 1 ? 2 : 0) });
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const firstName = n => (n || "").trim().split(/\s+/)[0] || "";
const initials = n => (n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const plural = (n, one, many) => n + " " + (n > 1 ? many : one);

/* ---------- Icônes ---------- */

  people.forEach(([name, pid, qty], i) => {
    const c = { id: uid(), name, phone: "06 00 00 01 0" + i, example: true, createdAt: addDays(first, -60) };
    s.clients.push(c);
    const p = s.products.find(x => x.id === pid);
    const old = makeSale(c.id, p, qty, addDays(first, -p.days * qty + 2), true); old.status = "recommande";
    const d = day((i + 1) / 6);
    s.sales.push(old, makeSale(c.id, p, qty, d, true));

  });
  // relances sans réponse pour l'instant (dont 2 aujourd'hui) : taux de recommande réaliste
  for (let i = 0; i < 7; i++) {

    s.events.push({ id: uid(), type: "relance", clientId: c.id, saleId: "demo" + i, product: "", date: i < 2 ? t : day(i / 8), example: true });
  }
  // bouche-à-oreille : qui a présenté qui
  const by = name => s.clients.find(c => c.name === name);
  by("Céline Garnier").referredBy = s.clients[0].id; by("Hugo Petit").referredBy = by("Nathalie Roux").id;
  by("Paul Mercier").referredBy = by("Nathalie Roux").id; by("Inès Laurent").referredBy = s.clients[0].id;
  [by("Céline Garnier"), by("Hugo Petit"), by("Paul Mercier"), by("Inès Laurent")].forEach(c => c.createdAt = day(.3));
  for (let i = 0; i < 6; i++) s.events.push({ id: uid(), type: "bouche", clientId: s.clients[i % 4].id, saleId: "demo-b" + i, product: "", date: day((i + 1) / 7), example: true });
  // un prospect devenu client et un nouveau client par bouche-à-oreille
  const p1 = s.products[0];

                { id: uid(), type: "bnew", clientId: s.clients[5].id, product: s.products[2].name, amount: s.products[2].price, date: day(.7), example: true });
  // option dirigeant : les résultats envoyés par 3 filleuls
  const m = t.slice(0, 7);
  s.settings = { ...(s.settings || {}), leader: true };
  s.team = [["Camille", 412, 18, 9, 3, 6], ["Nora", 268, 14, 6, 2, 4], ["Léo", 95, 7, 2, 1, 1]].map(([n, ca, rel, recos, pWon, cards], i) =>
    ({ id: "demo-f" + i, n, m, ca, rel, recos, rate: Math.round(recos / rel * 100), pWon, cards, clients: 12 + i * 3, d: addDays(t, -i) }));

function migrate(d) {
  if (!Array.isArray(d.prospects)) d.prospects = [];
  d.settings = { ...SET_DEFAULTS, ...(d.settings || {}) };
  d.clients.forEach(c => {
    if (!CSTATUS[c.status]) c.status = c.status === "partenaire" || c.status === "business" ? "vip" : "direct";
    if (!Array.isArray(c.statusLog)) c.statusLog = [{ s: c.status, date: c.createdAt || today() }];
    c.statusLog.forEach(x => { if (!CSTATUS[x.s]) x.s = x.s === "partenaire" || x.s === "business" ? "vip" : "direct"; });
    delete c.businessSince; delete c.lastNudge; delete c.nudgeSnooze; delete c.bmsg;
  });
  delete d.settings.inactiveDays; delete d.settings.partnerThreshold; delete d.settings.vipPerk;
  d.clients.forEach(c => { if (c.status === "vip" && !c.cardNo) { d.cardSeq = (d.cardSeq || 0) + 1; c.cardNo = String(d.cardSeq).padStart(4, "0"); } });

}

function viewProspects(q) {

function drawChips() {
  document.getElementById("chips").innerHTML = realProducts().map(p =>
    `<button type="button" class="pchip ${p.id === form.pid ? "on" : ""}" data-act="pick" data-id="${p.id}">${esc(p.name)}<small class="num">${p.days} j</small></button>`).join("")
    + `<button type="button" class="pchip add" data-act="toggleNewProd">+ Autre produit</button>`;
}
function updateEnd() {
  const p = S.products.find(x => x.id === form.pid);
  const date = document.getElementById("fDate").value || today();
  document.getElementById("fQty").textContent = form.qty;
  const box = document.getElementById("endBox");
  if (!p) { box.innerHTML = `<span>Choisissez un produit.</span>`; return; }
  const end = addDays(date, p.days * form.qty);
  const d = diff(end, today());
  box.innerHTML = `<div><span class="small">Fin estimée</span><b>${cap(fmtLong(end))}</b>
    <span style="font-size:.82rem;color:var(--ink-2)">${d >= 0 ? "dans " + plural(d, "jour", "jours") : "déjà passée"}</span></div>` +
    (p.price ? `<span class="price num">${euro(p.price * form.qty)}</span>` : "");
}
function submitSale() {
  const name = document.getElementById("fName").value.trim();
  const phone = document.getElementById("fPhone").value.trim();
  const date = document.getElementById("fDate").value || today();
  const p = S.products.find(x => x.id === form.pid);
  if (!name) { document.getElementById("fName").focus(); return toast("Indiquez le nom du client."); }
  if (!p) return toast("Choisissez un produit.");
  const snap = snapshot();
  let c = S.clients.find(x => x.name.toLowerCase() === name.toLowerCase());
  const refName = (document.getElementById("fRef") || {}).value?.trim() || "";
  let isNew = false;
  if (!c) { c = { id: uid(), name, phone, example: false, createdAt: today(), status: "direct", statusLog: [{ s: "direct", date: today() }] }; S.clients.push(c); isNew = true; }
  else if (phone) c.phone = phone;
  if (isNew && refName) {
    let r = findPerson(refName); if (r === c) r = null;
    if (r) c.referredBy = r.id; else c.referredByName = refName;
  }
  const counted = recordSale(c, p, form.qty, date);
  const pr = form.prospectId ? prospect(form.prospectId) : null;
  if (pr) {
    pr.status = "client"; pr.clientId = c.id; pr.convertedAt = today();
    if (pr.example) c.example = true;
    S.events.push({ id: uid(), type: "pclient", prospectId: pr.id, clientId: c.id, product: p.name, amount: p.price * form.qty, date: today(), example: !!pr.example });
    save(); closeSheet(); render();
    return toast(`Première vente pour ${firstName(c.name)}, bravo !`, snap);
  }
  if (isNew && (c.referredBy || c.referredByName))
    S.events.push({ id: uid(), type: "bnew", clientId: c.id, product: p.name, amount: p.price * form.qty, date: today(), example: !!c.example });
  save(); closeSheet(); render();
  toast(counted ? `Vente enregistrée et comptée comme recommande`
    : isNew && (c.referredBy || c.referredByName) ? `Nouveau client grâce au bouche-à-oreille !` : `Vente enregistrée pour ${firstName(c.name)}`, snap);
}

/* Une nouvelle vente du même produit remplace la précédente en cours */
function recordSale(c, p, qty, date) {
  let counted = false;
  for (const old of S.sales) {
    if (old.clientId === c.id && old.product === p.name && (old.status === "open" || old.status === "relance") && old.date <= date) {
      if (old.status === "relance") { logEvent("recommande", old, { amount: p.price * qty }); counted = true; }
      old.status = "rachete";
    }
  }
  const ns = makeSale(c.id, p, qty, date, c.example);
  if (S.sales.some(x => x.clientId === c.id && x.product === p.name && x.date > date)) ns.status = "rachete";
  S.sales.push(ns);
  return counted;
}
function refLine(c) {
  const by = c.referredBy ? person(c.referredBy) : null;
  const brought = S.clients.concat(S.prospects.filter(x => x.status !== "client")).filter(x => x.referredBy === c.id);
  let h = "";
  if (by || c.referredByName) h += `<div class="notice" style="margin-top:14px"><span>Recommandé par <b>${esc(by ? by.name : c.referredByName)}</b></span></div>`;
  if (brought.length) h += `<div class="notice" style="margin-top:10px"><span>A présenté ${plural(brought.length, "personne", "personnes")} : <b>${brought.map(x => esc(x.name)).join(", ")}</b></span></div>`;
  return h;
}

/* Un tableau collé ou un fichier : on reconnaît les colonnes (nom, date, produit, quantité) */
function parseTable(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  let d = null, best = 0;
  for (const x of ["\t", ";", ","]) { const c = lines.slice(0, 12).filter(l => l.includes(x)).length; if (c > best) { best = c; d = x; } }
  if (!d || best < Math.min(2, lines.length)) return parseLines(text);
  const rows = lines.map(l => splitLine(l, d));
  const width = Math.max(...rows.map(r => r.length));
  const head = rows[0].map(norm), role = {};
  const KW = { first: /prenom/, name: /^nom$|^nom |nom du client|nom client|^client$|^contact|^name|beneficiaire|^filleul/, date: /date|jour|commande le/, product: /produit|article|designation|libelle|product|item|reference|ref/, qty: /qte|quantite|qty|nombre|nb/ };
  head.forEach((h, i) => { for (const [k, re] of Object.entries(KW)) if (role[k] == null && re.test(h)) { role[k] = i; break; } });
  let body = rows;
  if (role.date != null || role.product != null || role.name != null) body = rows.slice(1);
  else {
    const score = (i, f) => body.filter(r => r[i] && f(r[i])).length / body.length;
    for (let i = 0; i < width; i++) {
      if (role.date == null && score(i, parseDateFR) > .6) { role.date = i; continue; }
      if (role.qty == null && score(i, v => /^\d{1,2}$/.test(v)) > .6) { role.qty = i; continue; }
      if (role.product == null && score(i, matchProduct) > .4) { role.product = i; continue; }
    }
    for (let i = 0; i < width; i++) if (role.name == null && ![role.date, role.qty, role.product].includes(i) && score(i, v => /[a-zé]{2,}/i.test(v)) > .6) role.name = i;
    if (role.product == null) for (let i = 0; i < width; i++) if (![role.date, role.qty, role.name].includes(i) && score(i, v => /[a-zé]{3,}/i.test(v)) > .5) { role.product = i; break; }
  }
  const out = []; let lastName = "", lastDate = "";
  for (const r of body) {
    let name = role.name != null ? r[role.name] || "" : "";
    if (role.first != null && r[role.first]) name = (r[role.first] + " " + name).trim();
    const date = parseDateFR(role.date != null ? r[role.date] : "") || "";
    const prodCell = role.product != null ? r[role.product] || "" : "";
    const qty = Math.max(1, Math.min(99, parseInt(role.qty != null ? r[role.qty] : "1", 10) || 1));
    if (!name && !prodCell) continue;
    if (!prodCell) { if (name && date) out.push({ name: name || lastName, date: date || lastDate, product: "", qty }); lastName = name || lastName; lastDate = date || lastDate; continue; }
    name = name || lastName; const dt = date || lastDate;
    for (const prod of prodCell.split(/\s\+\s|\s\/\s/).map(x => x.trim()).filter(Boolean)) out.push({ name, date: dt, product: prod, qty });
    lastName = name; lastDate = dt;
  }
  return out;
}
/* Capture d'un back-office :
   - « liste des commandes » : une ligne = un client + une date (sans produit) → relance au rythme ;
   - « détail d'une commande » : n° d'article + nom de l'article → la VDI choisit le client. */
const BO_NOISE = /^(partenaire|client|cliente|consultant|conseiller|membre|vip|commande|individuelle|accept[ée]|post[ée]|livr[ée]e?|pay[ée]e?|valid[ée]e?|en|cours|afficher|les|details?|niveau)$/i;
function parseBackoffice(text) {
  const lines = text.split(/\r?\n/).map(l => l.replace(/[|_“”"]+/g, " ").replace(/\s+/g, " ").trim()).filter(Boolean);
  const art = lines.map(l => l.match(/^\d{6,}\s+(.+?)\s+\d{1,4}([.,]\d+)?$/)).filter(Boolean);
  if (art.length >= 2 && art.length >= lines.filter(l => /^\d{6,}\s/.test(l)).length * .6) return { kind: "detail", items: [...new Set(art.map(m => m[1].trim()))] };
  const rows = [], seen = new Set();
  for (const l of lines) {
    const date = parseDateFR(l); if (!date) continue;
    let t = l; for (const re of DATE_RES) t = t.replace(re, " ");
    const words = t.replace(/\b\d{4}\/\d{1,2}\b/g, " ").split(" ").filter(w => w && !/\d/.test(w) && !BO_NOISE.test(w) && /^\p{L}[\p{L}'\-.]*$/u.test(w) && w.length > 1);
    const name = words.slice(0, 5).map(w => w === w.toUpperCase() && w.length > 2 ? w[0] + w.slice(1).toLowerCase() : w).join(" ").trim();
    if (!name || name.split(" ").length < 2 && name.length < 3) continue;
    const k = norm(name) + "|" + date; if (seen.has(k)) continue; seen.add(k);
    rows.push({ name, date, product: "", qty: 1 });
  }
  return rows.length ? { kind: "list", rows } : null;
}

/* Du texte lu sur une capture : une ligne par commande, on y cherche une date, un produit connu et un nom */
function parseLines(text) {
  const out = []; let lastName = "", lastDate = "";
  for (const raw of text.split(/\r?\n/)) {
    let l = raw.replace(/[|_]+/g, " ").replace(/\s+/g, " ").trim();
    if (l.length < 4) continue;
    const nl = norm(l);
    if (/\b(date|produit|article|quantite|total|commande n|statut)\b/.test(nl) && !parseDateFR(l)) continue;
    const date = parseDateFR(l);
    for (const re of DATE_RES) l = l.replace(re, " ");
    let qty = 1;
    const qm = l.match(/(?:\bx\s?|×\s?|qt[ée]\s*:?\s*)(\d{1,2})\b|\b(\d{1,2})\s?(?:x|×)\b/i);
    if (qm) { qty = +(qm[1] || qm[2]); l = l.replace(qm[0], " "); }
    l = l.replace(/\d+[.,]\d{2}\s*€?|€\s*\d+([.,]\d+)?|\b\d+\s*€/g, " ").replace(/\s+/g, " ").trim();
    const words = l.split(" "), nw = words.map(norm);
    let prod = null, at = -1, len = 0;
    for (const p of S.products) {
      const pw = norm(p.name).split(" ");
      for (let i = 0; i + pw.length <= nw.length; i++) if (pw.every((w, k) => nw[i + k] === w) && pw.length > len) { prod = p; at = i; len = pw.length; }
    }
    let name, prodText;
    if (prod) {
      name = words.slice(0, at).filter(w => /^[A-ZÀ-Ý][\p{L}'\-]+$/u.test(w)).slice(-3).join(" "); prodText = prod.name;
      if (!qm) { const nxt = words.slice(at + len).find(w => /^\d{1,2}$/.test(w)); if (nxt) qty = Math.max(1, +nxt); }
    }
    else {
      const caps = []; let i = 0;
      while (i < words.length && /^[A-ZÀ-Ý][\p{L}'\-]+$/u.test(words[i]) && caps.length < 3) caps.push(words[i++]);
      name = caps.join(" "); prodText = words.slice(i).filter(w => /\p{L}{2,}/u.test(w)).join(" ");
    }
    if (!date && !prod) continue;
    name = name || lastName; const dt = date || lastDate;
    if (!prodText) continue;
    out.push({ name, date: dt, product: prodText, qty });
    lastName = name; lastDate = dt;
  }
  return out;
}
function loadScript(src) {
  return new Promise((ok, ko) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = () => ko(new Error("chargement")); document.head.appendChild(el); });
}
const VENDOR = new URL("../vendor/", location.href).href;
async function readImage(file, progress) {
  await loadScript(VENDOR + "tesseract/tesseract.min.js");
  const worker = await Tesseract.createWorker("fra", 1, { workerPath: VENDOR + "tesseract/worker.min.js", corePath: VENDOR + "tesseract/core/", langPath: VENDOR + "tesseract/lang", gzip: true,
    logger: m => { if (m.status === "recognizing text") progress(m.progress); } });
  try { const { data } = await worker.recognize(file); return data.text; } finally { worker.terminate(); }
}
async function readSheet(file) {
  if (/\.(csv|txt|tsv)$/i.test(file.name)) return file.text();
  await loadScript(VENDOR + "xlsx/xlsx.full.min.js");
  const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: "" });
  const cell = v => v instanceof Date ? `${pad(v.getDate())}/${pad(v.getMonth() + 1)}/${v.getFullYear()}` : String(v).replace(/[\t\n]/g, " ");
  return rows.map(r => r.map(cell).join("\t")).join("\n");
}

function applyImport() {

document.addEventListener("change", async ev => {
  const t = ev.target;
  if (t.id !== "impImg" && t.id !== "impFile") return;
  const f = t.files[0]; if (!f) return;
  try {
    if (t.id === "impImg") {
      showImportStatus("Lecture de la capture… <b>0 %</b> (la première fois, quelques secondes de préparation)");
      const text = await readImage(f, k => showImportStatus(`Lecture de la capture… <b>${Math.round(k * 100)} %</b>`));
      const bo = parseBackoffice(text);
      if (bo && bo.kind === "detail") return openDetailReview(bo.items);
      const rows = bo ? bo.rows : parseLines(text);
      if (!rows.length && /n.?\s?commande|pw\/pv|statut/i.test(text)) return showImportStatus("On ne voit pas les noms sur cette capture. Faites glisser le tableau vers la gauche pour afficher <b>Prénom, Nom et Date de commande</b>, puis refaites la capture.");
      openImportReview(rows);
    } else {
      showImportStatus("Lecture du fichier…");
      openImportReview(parseTable(await readSheet(f)));
    }
  } catch (e) { showImportStatus("Impossible de lire ce fichier. Vérifiez votre connexion la première fois, ou utilisez le copier-coller."); }
});

function toast(text, snap) {
  const el = document.getElementById("toast");
  el.innerHTML = `<div class="toast" role="status"><span>${esc(text)}</span>${snap ? `<button id="undo">Annuler</button>` : ""}</div>`;

}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (_) {}
    ta.remove(); return ok;
  }
}

document.addEventListener("click", ev => {
  const tabBtn = ev.target.closest("[data-tab]");
  if (tabBtn) { tab = tabBtn.dataset.tab; closeSheet(); render(); window.scrollTo(0, 0); return; }
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const fn = actions[el.dataset.act];
  if (!fn) return;
  if (el.dataset.act === "closeBg") { fn(el, ev); return; }
  const keepDefault = fn(el, ev) === true;
  if (!keepDefault) ev.preventDefault();
});
document.addEventListener("submit", ev => {
  if (ev.target.id === "saleForm") { ev.preventDefault(); submitSale(); }
  if (ev.target.id === "promoForm") {
    ev.preventDefault();
    const text = document.getElementById("prText").value.trim(), until = document.getElementById("prUntil").value;
    if (!text || !until) return toast("Indiquez l'offre et la date.");
    const snap = snapshot(), same = activePromo();
    S.promo = { id: same ? S.promo.id : uid(), text, until, createdAt: same ? S.promo.createdAt : today() };
    save(); closeSheet(); tab = "today"; render(); window.scrollTo(0, 0);
    return toast(same ? "Promo mise à jour" : `Promo prête pour ${plural(promoTargets().length, "personne", "personnes")} dans « Aujourd'hui »`, snap);
  }
  if (ev.target.id === "prospectForm") { ev.preventDefault(); submitProspect(ev.target); }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "search") {
    query = t.value; const pos = t.selectionStart; render();
    const s = document.getElementById("search"); s.focus(); s.setSelectionRange(pos, pos);
    app.firstElementChild.classList.remove("enter");
  }
  if (t.classList.contains("msg")) fitAreas(t.parentNode);
  if (t.id === "fDate") updateEnd();
  if (t.id === "pNext") pform.touched = true;
  if (t.id === "fName") {
    const known = S.clients.some(x => x.name.toLowerCase() === t.value.trim().toLowerCase());
    document.getElementById("fRefWrap").classList.toggle("hidden", known);
    const c = S.clients.find(x => x.name.toLowerCase() === t.value.trim().toLowerCase());
    const ph = document.getElementById("fPhone");
    if (c && c.phone && !ph.value) ph.value = c.phone;
  }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  const row = t.closest(".prodrow");
  if (row) {
    const p = S.products.find(x => x.id === row.dataset.pid); if (!p) return;
    const f = t.dataset.field;
    if (f === "name") p.name = t.value.trim() || p.name;
    if (f === "days") p.days = Math.max(1, Math.round(num(t.value)) || p.days);
    if (f === "price") p.price = Math.max(0, num(t.value));
    save(); toast("Produit mis à jour"); return;
  }
  if (t.id === "setThreshold") {
    const v = Math.max(1, Math.round(num(t.value)) || 0);
    S.settings.vipOrders = v || SET_DEFAULTS.vipOrders;
    save(); toast("Réglage enregistré"); return;
  }
  if (t.id === "setCycle") {
    S.settings.cycle = Math.max(7, Math.min(180, Math.round(num(t.value)) || 30)); const g = genericProduct();
    for (const sl of S.sales) if (sl.productId === g.id && sl.status === "open") { sl.days = g.days; sl.end = addDays(sl.date, g.days * sl.qty); }
    save(); toast(`Relance ${S.settings.cycle} jours après une commande sans produit précis`); return;
  }
  if (t.id === "setBasket") { S.settings.basket = Math.max(0, Math.round(num(t.value)) || 0); save(); const sh = sheetEl.querySelector(".bilan"); if (sh) openBilan(document.querySelector("[data-act=bilanMonth].on").dataset.m); toast("Panier moyen enregistré"); return; }
  if (t.id === "setDiscount") { S.settings.discountOn = t.checked; save(); render(); toast(t.checked ? "Remise activée : vérifiez les règles de votre marque" : "Remise désactivée"); return; }
  if (t.id === "setNetC" || t.id === "setNetP") { const v = t.value.trim() === "" ? null : Math.max(0, Math.min(99, Math.round(num(t.value)) || 0)); S.settings[t.id === "setNetC" ? "netC" : "netP"] = v; save(); render(); return; }
  if (t.id === "setEmoji") { S.emoji = t.checked; save(); render(); toast(t.checked ? "Les messages ont des emojis" : "Les messages sont sans emoji"); return; }
  if (t.id === "setLeader") { S.settings.leader = t.checked; save(); toast(t.checked ? "Option dirigeant activée : « Mon équipe » est dans Résultats" : "Option dirigeant désactivée"); return; }
  if (t.id === "setShop" || t.id === "setGift" || t.id === "setShopPhone") {
    S.settings[{ setShop: "shopName", setGift: "gift", setShopPhone: "shopPhone" }[t.id]] = t.value.trim(); save(); render(); toast("Carte fidélité mise à jour"); return;
  }
  if (t.id === "setEvery") { S.settings.every = Math.max(0, Math.min(20, Math.round(num(t.value)) || 0)); save(); render(); toast("Réglage enregistré"); return; }
  if (t.id === "setVipPct" || t.id === "setMargin") {
    const v = Math.max(0, Math.min(90, Math.round(num(t.value)) || 0));
    S.settings[t.id === "setVipPct" ? "vipPct" : "margin"] = v; save(); render(); toast("Réglage enregistré"); return;
  }
  if (t.dataset.cfield) {
    const c = client(t.dataset.id); if (!c) return;
    if (t.dataset.cfield === "name" && t.value.trim()) c.name = t.value.trim();
    if (t.dataset.cfield === "phone") c.phone = t.value.trim();
    save(); render(); toast("Fiche mise à jour");
  }
});
document.getElementById("importFile").addEventListener("change", async ev => {
  const file = ev.target.files[0]; ev.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.products) || !Array.isArray(data.clients) || !Array.isArray(data.sales) || !Array.isArray(data.events)) throw new Error("format");
    if (!confirm(`Remplacer les données actuelles par cette sauvegarde (${plural(data.clients.length, "client", "clients")}) ?`)) return;
    migrate(data);
    const snap = snapshot(); S = data; save(); tab = "today"; render(); toast("Sauvegarde importée", snap);
  } catch (e) { toast("Ce fichier n'est pas une sauvegarde Recharge valide."); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeSheet(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && !sheetEl.innerHTML) render(); });
const topbar = document.getElementById("topbar");
addEventListener("scroll", () => topbar.classList.toggle("scrolled", scrollY > 4), { passive: true });

/* Certains hébergeurs (ex. Netlify) ajoutent un badge en bas de l'écran : on remonte la barre d'onglets pour qu'il ne la cache pas */
function avoidHostBadge() {
  const b = document.getElementById("nl-badge-frame");
  document.documentElement.style.setProperty("--badge", b && b.offsetHeight ? "58px" : "0px");
}
new MutationObserver(avoidHostBadge).observe(document.body, { childList: true });
avoidHostBadge();

render();
if (DEMO && new URLSearchParams(location.search).get("s") === "team") setTimeout(() => {
  const h = [...document.querySelectorAll(".section h2")].find(x => x.textContent.startsWith("Mon équipe"));
  if (h) scrollTo(0, h.getBoundingClientRect().top + scrollY - 110);
}, 150);
if (teamNotice) setTimeout(() => toast(teamNotice), 300);
let obSkipFlag = false; try { obSkipFlag = localStorage.getItem("recharge.ob") === "skip"; } catch (e) {}
if (!DEMO && !S.profile && !obSkipFlag && !navigator.webdriver && !teamNotice) setTimeout(() => openOnboarding(0), 350);
if (!DEMO && !navigator.webdriver && S.profile && S.lastBilan !== today().slice(0, 7)) {
  const pm = prevMonth(today().slice(0, 7)), b = bilan(pm);
  S.lastBilan = today().slice(0, 7); save();
  if (b.relances || b.commandes) setTimeout(() => openBilan(pm), 500);
}
if (DEMO && new URLSearchParams(location.search).get("s") === "card") setTimeout(() => { const c = S.clients.find(x => x.status === "vip"); if (c) openFiche(c.id); }, 150);
if (DEMO && new URLSearchParams(location.search).get("s") === "fid") setTimeout(() => {
  const h = [...document.querySelectorAll(".section h2")].find(x => x.textContent.startsWith("Carte fidélité"));
  if (h) scrollTo(0, h.getBoundingClientRect().top + scrollY - 70);
}, 150);
</script>
</body>
</html>
